# promtool unit tests for services/prometheus/alerts.yml (#1365, UC-035 A2).
# Run: make test-contract (tests/contract/test_alert_rules.py mounts this file at
# /tests and services/prometheus at /rules), or directly:
#   docker run --rm --entrypoint promtool -v $PWD/services/prometheus:/rules:ro \
#     -v $PWD/tests/contract/prometheus:/tests:ro prom/prometheus:<compose tag> \
#     test rules /tests/alerts_test.yml
#
# Not covered here on purpose: GameCrashRate and ServiceUpdatePending (dead, #1275).
rule_files:
  - /rules/alerts.yml

evaluation_interval: 30s

tests:
  # ControllerDisconnected: controller_connected == 0 for 30s (critical).
  - interval: 30s
    input_series:
      - series: 'controller_connected{serial="MOCK0001"}'
        values: '1 1 0 0 0 0'
      - series: 'controller_connected{serial="MOCK0002"}'
        values: '1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 30s
        alertname: ControllerDisconnected
        exp_alerts: []
      - eval_time: 2m
        alertname: ControllerDisconnected
        exp_alerts:
          - exp_labels:
              severity: critical
              serial: MOCK0001
            exp_annotations:
              summary: "Controller MOCK0001 disconnected"
              description: "Controller lost connection during active game."

  # ControllerLowBattery: level < 2 for 1m (warning); level 2 does not fire.
  - interval: 30s
    input_series:
      - series: 'controller_battery_level{serial="MOCK0001"}'
        values: '1x10'
      - series: 'controller_battery_level{serial="MOCK0002"}'
        values: '2x10'
    alert_rule_test:
      - eval_time: 30s
        alertname: ControllerLowBattery
        exp_alerts: []
      - eval_time: 2m
        alertname: ControllerLowBattery
        exp_alerts:
          - exp_labels:
              severity: warning
              serial: MOCK0001
            exp_annotations:
              summary: "Controller MOCK0001 has low battery"
              description: "Battery level is 1/5. Replace or charge soon."

  # PoorFrameConsistency: < 95 % for 2m.
  - interval: 30s
    input_series:
      - series: 'game_loop_frame_consistency_percent'
        values: '90x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: PoorFrameConsistency
        exp_alerts: []
      - eval_time: 4m
        alertname: PoorFrameConsistency
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Poor frame consistency"
              description: "Only 90% of frames within target timing (should be >95%)."

  # HighGRPCClientErrorRate: > 0.5 errors/s for 2m, per service/method.
  - interval: 30s
    input_series:
      - series: 'grpc_client_errors_total{service="menu",method="StartGame"}'
        values: '0+30x20'
      - series: 'grpc_client_errors_total{service="menu",method="GetState"}'
        values: '0+3x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: HighGRPCClientErrorRate
        exp_alerts:
          - exp_labels:
              severity: warning
              service: menu
              method: StartGame
            exp_annotations:
              summary: "High gRPC client error rate on menu/StartGame"
              description: "Service menu method StartGame has error rate 0.9999999999999999/s for 2+ minutes"

  # InterventionHandlerErrors: only block_reason="handler_error" counts.
  - interval: 30s
    input_series:
      - series: 'game_interventions_total{type="shield",objective="balance",blocked="true",block_reason="handler_error"}'
        values: '0+1x20'
      - series: 'game_interventions_total{type="shield",objective="balance",blocked="false",block_reason=""}'
        values: '0+10x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: InterventionHandlerErrors
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Intervention handlers are failing"
              description: "Dispatched intervention handlers raised at 0.03333333333333333/s for 2+ minutes (block_reason=handler_error)."
  - interval: 30s
    input_series:
      - series: 'game_interventions_total{type="shield",objective="balance",blocked="false",block_reason=""}'
        values: '0+10x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: InterventionHandlerErrors
        exp_alerts: []

  # FlagEvaluationFallbacks: any sustained fallback, per flag_key/reason.
  - interval: 30s
    input_series:
      - series: 'flag_eval_errors_total{flag_key="game_loop.update_frequency_hz",reason="TYPE_MISMATCH"}'
        values: '0+3x30'
    alert_rule_test:
      - eval_time: 3m
        alertname: FlagEvaluationFallbacks
        exp_alerts: []
      - eval_time: 12m
        alertname: FlagEvaluationFallbacks
        exp_alerts:
          - exp_labels:
              severity: warning
              flag_key: game_loop.update_frequency_hz
              reason: TYPE_MISMATCH
            exp_annotations:
              summary: "Feature flag 'game_loop.update_frequency_hz' falling back to default (TYPE_MISMATCH)"
              description: "Flag 'game_loop.update_frequency_hz' has been resolving to its hardcoded default at 0.1/s for 5+ minutes (reason=TYPE_MISMATCH). A TYPE_MISMATCH or PARSE_ERROR means a flag/getter type mismatch; a sustained PROVIDER_NOT_READY past the startup grace window means the flagd provider is unreachable. Overrides are being silently ignored."

  # AgentInterventionWriteFailures: result="error" writes for 2m; result="ok" never fires.
  - interval: 30s
    input_series:
      - series: 'agent_intervention_writes_total{result="error"}'
        values: '0+3x20'
      - series: 'agent_intervention_writes_total{result="ok"}'
        values: '0+30x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: AgentInterventionWriteFailures
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Agent cannot write intervention flags"
              description: "The agent ActionSink failed flag-file writes at 0.1/s for 2+ minutes (flagd file unreachable?). The ACT path is degraded."
  - interval: 30s
    input_series:
      - series: 'agent_intervention_writes_total{result="ok"}'
        values: '0+30x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: AgentInterventionWriteFailures
        exp_alerts: []

  # AgentInterventionFileCorruption: a single corruption fires at once (for: 0m).
  - interval: 30s
    input_series:
      - series: 'agent_intervention_file_corruption_total{phase="write"}'
        values: '0 0 0 1 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: AgentInterventionFileCorruption
        exp_alerts: []
      - eval_time: 2m
        alertname: AgentInterventionFileCorruption
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Agent interventions file was corrupt and self-healed"
              description: "The agent detected a poisoned interventions.json and self-healed it (1 event(s) in 5m). flagd would otherwise reject the whole flag set and silently default every intervention. See docs/agent-act-runbook.md → Recovery."

  # HighInputLatency: P95 controller sample age > 50 ms for 2m (live since #1376).
  # MOCK0001's samples all land in the 50-100 ms bucket; MOCK0002's under 10 ms.
  - interval: 30s
    input_series:
      - series: 'controller_input_lag_seconds_bucket{serial="MOCK0001",le="0.05"}'
        values: '0x20'
      - series: 'controller_input_lag_seconds_bucket{serial="MOCK0001",le="0.1"}'
        values: '0+30x20'
      - series: 'controller_input_lag_seconds_bucket{serial="MOCK0001",le="+Inf"}'
        values: '0+30x20'
      - series: 'controller_input_lag_seconds_bucket{serial="MOCK0002",le="0.01"}'
        values: '0+30x20'
      - series: 'controller_input_lag_seconds_bucket{serial="MOCK0002",le="0.05"}'
        values: '0+30x20'
      - series: 'controller_input_lag_seconds_bucket{serial="MOCK0002",le="0.1"}'
        values: '0+30x20'
      - series: 'controller_input_lag_seconds_bucket{serial="MOCK0002",le="+Inf"}'
        values: '0+30x20'
    alert_rule_test:
      - eval_time: 1m
        alertname: HighInputLatency
        exp_alerts: []
      - eval_time: 6m
        alertname: HighInputLatency
        exp_alerts:
          - exp_labels:
              severity: warning
              serial: MOCK0001
            exp_annotations:
              summary: "High input latency detected"
              description: "P95 age of controller samples sent on the gameplay stream is 0.0975s (>50ms threshold): the poll loop or a backend is stalling, or Bluetooth congestion is delaying frames."

  # LowGameLoopHz (#1353): relative to the configured rate
  # (game_current_update_frequency_hz from game_loop.update_frequency_hz), primary
  # games only. A loop on target at the documented 15 / 30 Hz settings stays quiet.
  - interval: 30s
    input_series:
      - series: 'game_current_update_frequency_hz{job="game-coordinator"}'
        values: '30x20'
      - series: 'game_actual_update_frequency_hz{job="game-coordinator",game_kind="primary",game_id="game_a"}'
        values: '29.8x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: LowGameLoopHz
        exp_alerts: []
  - interval: 30s
    input_series:
      - series: 'game_current_update_frequency_hz{job="game-coordinator"}'
        values: '15x20'
      - series: 'game_actual_update_frequency_hz{job="game-coordinator",game_kind="primary",game_id="game_a"}'
        values: '14.9x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: LowGameLoopHz
        exp_alerts: []
  # Below 90 % of the configured 30 Hz: fires for the primary game only.
  - interval: 30s
    input_series:
      - series: 'game_current_update_frequency_hz{job="game-coordinator"}'
        values: '30x20'
      - series: 'game_actual_update_frequency_hz{job="game-coordinator",game_kind="primary",game_id="game_a"}'
        values: '24x20'
      - series: 'game_actual_update_frequency_hz{job="game-coordinator",game_kind="shadow",game_id="game_s"}'
        values: '12x20'
    alert_rule_test:
      - eval_time: 15s
        alertname: LowGameLoopHz
        exp_alerts: []
      - eval_time: 2m
        alertname: LowGameLoopHz
        exp_alerts:
          - exp_labels:
              severity: warning
              job: game-coordinator
              game_kind: primary
              game_id: game_a
            exp_annotations:
              summary: "Game loop running below its configured rate"
              description: "Game game_a (primary) loop is running at 24Hz, below 90% of the configured game_loop.update_frequency_hz."
  # Still fires at the 60 Hz default when the loop drops to 50 Hz.
  - interval: 30s
    input_series:
      - series: 'game_current_update_frequency_hz{job="game-coordinator"}'
        values: '60x20'
      - series: 'game_actual_update_frequency_hz{job="game-coordinator",game_kind="primary",game_id="game_a"}'
        values: '50x20'
    alert_rule_test:
      - eval_time: 2m
        alertname: LowGameLoopHz
        exp_alerts:
          - exp_labels:
              severity: warning
              job: game-coordinator
              game_kind: primary
              game_id: game_a
            exp_annotations:
              summary: "Game loop running below its configured rate"
              description: "Game game_a (primary) loop is running at 50Hz, below 90% of the configured game_loop.update_frequency_hz."
  # Two coordinators: each game is compared with ITS coordinator's rate. The real
  # coordinator runs 30 Hz and its primary game 29 Hz; agent-game-coordinator runs
  # 60 Hz. Matching on(job) keeps the 30 Hz game quiet (a max() would fire).
  - interval: 30s
    input_series:
      - series: 'game_current_update_frequency_hz{job="game-coordinator-service"}'
        values: '30x20'
      - series: 'game_current_update_frequency_hz{job="agent-game-coordinator-service"}'
        values: '60x20'
      - series: 'game_actual_update_frequency_hz{job="game-coordinator-service",game_kind="primary",game_id="game_a"}'
        values: '29x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: LowGameLoopHz
        exp_alerts: []
  # Exact 90 % boundary: 27 Hz at 30 Hz configured is not below the threshold.
  - interval: 30s
    input_series:
      - series: 'game_current_update_frequency_hz{job="game-coordinator"}'
        values: '30x20'
      - series: 'game_actual_update_frequency_hz{job="game-coordinator",game_kind="primary",game_id="game_a"}'
        values: '27x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: LowGameLoopHz
        exp_alerts: []
