# promtool unit tests for services/prometheus/alerts.yml (#1365, UC-035 A2).
# Run: make test-contract (tests/contract/test_alert_rules.py mounts this file at
# /tests and services/prometheus at /rules), or directly:
#   docker run --rm --entrypoint promtool -v $PWD/services/prometheus:/rules:ro \
#     -v $PWD/tests/contract/prometheus:/tests:ro prom/prometheus:<compose tag> \
#     test rules /tests/alerts_test.yml
#
# Not covered here on purpose: HighInputLatency and LowGameLoopHz (being changed
# by #1376 / #1379 / #1353), GameCrashRate and ServiceUpdatePending (dead, #1275).
rule_files:
  - /rules/alerts.yml

evaluation_interval: 30s

tests:
  # ControllerDisconnected: controller_connected == 0 for 30s (critical).
  - interval: 30s
    input_series:
      - series: 'controller_connected{serial="MOCK0001"}'
        values: '1 1 0 0 0 0'
      - series: 'controller_connected{serial="MOCK0002"}'
        values: '1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 30s
        alertname: ControllerDisconnected
        exp_alerts: []
      - eval_time: 2m
        alertname: ControllerDisconnected
        exp_alerts:
          - exp_labels:
              severity: critical
              serial: MOCK0001
            exp_annotations:
              summary: "Controller MOCK0001 disconnected"
              description: "Controller lost connection during active game."

  # ControllerLowBattery: level < 2 for 1m (warning); level 2 does not fire.
  - interval: 30s
    input_series:
      - series: 'controller_battery_level{serial="MOCK0001"}'
        values: '1x10'
      - series: 'controller_battery_level{serial="MOCK0002"}'
        values: '2x10'
    alert_rule_test:
      - eval_time: 30s
        alertname: ControllerLowBattery
        exp_alerts: []
      - eval_time: 2m
        alertname: ControllerLowBattery
        exp_alerts:
          - exp_labels:
              severity: warning
              serial: MOCK0001
            exp_annotations:
              summary: "Controller MOCK0001 has low battery"
              description: "Battery level is 1/5. Replace or charge soon."

  # PoorFrameConsistency: < 95 % for 2m.
  - interval: 30s
    input_series:
      - series: 'game_loop_frame_consistency_percent'
        values: '90x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: PoorFrameConsistency
        exp_alerts: []
      - eval_time: 4m
        alertname: PoorFrameConsistency
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Poor frame consistency"
              description: "Only 90% of frames within target timing (should be >95%)."

  # HighGRPCClientErrorRate: > 0.5 errors/s for 2m, per service/method.
  - interval: 30s
    input_series:
      - series: 'grpc_client_errors_total{service="menu",method="StartGame"}'
        values: '0+30x20'
      - series: 'grpc_client_errors_total{service="menu",method="GetState"}'
        values: '0+3x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: HighGRPCClientErrorRate
        exp_alerts:
          - exp_labels:
              severity: warning
              service: menu
              method: StartGame
            exp_annotations:
              summary: "High gRPC client error rate on menu/StartGame"
              description: "Service menu method StartGame has error rate 0.9999999999999999/s for 2+ minutes"

  # InterventionHandlerErrors: only block_reason="handler_error" counts.
  - interval: 30s
    input_series:
      - series: 'game_interventions_total{type="shield",objective="balance",blocked="true",block_reason="handler_error"}'
        values: '0+1x20'
      - series: 'game_interventions_total{type="shield",objective="balance",blocked="false",block_reason=""}'
        values: '0+10x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: InterventionHandlerErrors
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Intervention handlers are failing"
              description: "Dispatched intervention handlers raised at 0.03333333333333333/s for 2+ minutes (block_reason=handler_error)."
  - interval: 30s
    input_series:
      - series: 'game_interventions_total{type="shield",objective="balance",blocked="false",block_reason=""}'
        values: '0+10x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: InterventionHandlerErrors
        exp_alerts: []

  # FlagEvaluationFallbacks: any sustained fallback, per flag_key/reason.
  - interval: 30s
    input_series:
      - series: 'flag_eval_errors_total{flag_key="game_loop.update_frequency_hz",reason="TYPE_MISMATCH"}'
        values: '0+3x30'
    alert_rule_test:
      - eval_time: 3m
        alertname: FlagEvaluationFallbacks
        exp_alerts: []
      - eval_time: 12m
        alertname: FlagEvaluationFallbacks
        exp_alerts:
          - exp_labels:
              severity: warning
              flag_key: game_loop.update_frequency_hz
              reason: TYPE_MISMATCH
            exp_annotations:
              summary: "Feature flag 'game_loop.update_frequency_hz' falling back to default (TYPE_MISMATCH)"
              description: "Flag 'game_loop.update_frequency_hz' has been resolving to its hardcoded default at 0.1/s for 5+ minutes (reason=TYPE_MISMATCH). A TYPE_MISMATCH or PARSE_ERROR means a flag/getter type mismatch; a sustained PROVIDER_NOT_READY past the startup grace window means the flagd provider is unreachable. Overrides are being silently ignored."

  # AgentInterventionWriteFailures: result="error" writes for 2m; result="ok" never fires.
  - interval: 30s
    input_series:
      - series: 'agent_intervention_writes_total{result="error"}'
        values: '0+3x20'
      - series: 'agent_intervention_writes_total{result="ok"}'
        values: '0+30x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: AgentInterventionWriteFailures
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Agent cannot write intervention flags"
              description: "The agent ActionSink failed flag-file writes at 0.1/s for 2+ minutes (flagd file unreachable?). The ACT path is degraded."
  - interval: 30s
    input_series:
      - series: 'agent_intervention_writes_total{result="ok"}'
        values: '0+30x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: AgentInterventionWriteFailures
        exp_alerts: []

  # AgentInterventionFileCorruption: a single corruption fires at once (for: 0m).
  - interval: 30s
    input_series:
      - series: 'agent_intervention_file_corruption_total{phase="write"}'
        values: '0 0 0 1 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: AgentInterventionFileCorruption
        exp_alerts: []
      - eval_time: 2m
        alertname: AgentInterventionFileCorruption
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Agent interventions file was corrupt and self-healed"
              description: "The agent detected a poisoned interventions.json and self-healed it (1 event(s) in 5m). flagd would otherwise reject the whole flag set and silently default every intervention. See docs/agent-act-runbook.md → Recovery."
