manifestVersion: "1.0"
projects:
  - name: joustmania
    path: projects/joustmania
environmentGroups:
  - name: default
    environments:
      - name: joustmania
        url:
          type: environment
          value: DYNATRACE_ENVIRONMENT_URL
        auth:
          oAuth:
            clientId:
              type: environment
              name: DYNATRACE_OAUTH_CLIENT_ID
            clientSecret:
              type: environment
              name: DYNATRACE_OAUTH_CLIENT_SECRET
            tokenEndpoint:
              type: value
              value: https://sso-sprint.dynatracelabs.com/sso/oauth2/token
