# Metric event alerts — skipped on DPS (Dynatrace Platform).
# DPS does not support the builtin:anomaly-detection.metric-events schema.
# These alerts need to be rewritten as Grail-based DQL alerts for DPS.
configs:
  - id: controller-low-battery
    type:
      settings:
        schema: builtin:anomaly-detection.metric-events
        scope: environment
    config:
      template: alert-templates/controller-low-battery.json
      name: ControllerLowBattery
      skip: true
