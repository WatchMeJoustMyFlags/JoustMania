# ALSA configuration for JoustMania container
# Uses direct hardware access - simpler and more reliable in containers
#
# Note: Only one audio stream can play at a time with this configuration.
# The audio service handles this by managing playback channels.

# Default output - direct hardware access to USB Audio (Card 2)
pcm.!default {
    type plug
    slave {
        pcm "hw:2,0"
        rate 44100
        channels 2
    }
}

ctl.!default {
    type hw
    card 2
}
