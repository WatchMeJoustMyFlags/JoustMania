# ALSA configuration for JoustMania container
# Uses direct hardware access to avoid dmix/IPC issues in containers
#
# Override by mounting your own: -v /path/to/asound.conf:/etc/asound.conf:ro

# Default output - direct hardware access
# Card 2 is typically USB Audio on Raspberry Pi
# Adjust if your audio device is on a different card
pcm.!default {
    type plug
    slave.pcm "hw:2,0"
}

ctl.!default {
    type hw
    card 2
}
