      text: >-
        Everyone, please hand off your controllers to other new players now.
        New players, press A when you are ready to start.

    # Sensitivity
    - {id: ultra_high, sound: MENU_VOX_SENSITIVITY_ULTRA_HIGH, text: "Ultra high sensitivity.", recorded: true}
    - {id: high, sound: MENU_VOX_SENSITIVITY_HIGH, text: "High sensitivity.", recorded: true}
    - {id: medium, sound: MENU_VOX_SENSITIVITY_MEDIUM, text: "Medium sensitivity.", recorded: true}
    - {id: low, sound: MENU_VOX_SENSITIVITY_LOW, text: "Low sensitivity.", recorded: true}
    - {id: ultra_low, sound: MENU_VOX_SENSITIVITY_ULTRA_LOW, text: "Ultra low sensitivity.", recorded: true}

    # Admin options (numbers, on/off, true/false and option names)
    - {id: adminop_1, sound: MENU_VOX_ADMINOP_1, text: "One.", recorded: true}
    - {id: adminop_2, sound: MENU_VOX_ADMINOP_2, text: "Two.", recorded: true}
    - {id: adminop_3, sound: MENU_VOX_ADMINOP_3, text: "Three.", recorded: true}
    - {id: adminop_4, sound: MENU_VOX_ADMINOP_4, text: "Four.", recorded: true}
    - {id: adminop_5, sound: MENU_VOX_ADMINOP_5, text: "Five.", recorded: true}
    - {id: adminop_6, sound: MENU_VOX_ADMINOP_6, text: "Six.", recorded: true}
    - {id: adminop_on, sound: MENU_VOX_ADMINOP_ON, text: "On.", recorded: true}
    - {id: adminop_off, sound: MENU_VOX_ADMINOP_OFF, text: "Off.", recorded: true}
    - {id: adminop_True, sound: MENU_VOX_ADMINOP_TRUE, text: "True.", recorded: true}
    - {id: adminop_False, sound: MENU_VOX_ADMINOP_FALSE, text: "False.", recorded: true}
    - {id: adminop_force_all_start, sound: MENU_VOX_ADMINOP_FORCE_ALL_START, text: "Force all start.", recorded: true}
    - {id: adminop_random_team_size, sound: MENU_VOX_ADMINOP_RANDOM_TEAM_SIZE, text: "Random team size.", recorded: true}
    - {id: adminop_freeze_mode, text: "Freeze mode.", recorded: true}
    - {id: adminop_lives, text: "Lives.", recorded: true}
    - {id: adminop_resurrection, text: "Resurrection.", recorded: true}
    - {id: adminop_sheilds, text: "Shields.", recorded: true}
    - {id: adminop_traitor_team_size, text: "Traitor team size.", recorded: true}

    # Upstream update messages (no caller in this repo)
    - {id: update_started, text: "Update started.", recorded: true}
    - {id: joustmania_updated, text: "JoustMania updated.", say: "Joust Mania updated.", recorded: true}
    - id: large_update
      recorded: true
      text: "Large JoustMania update available. Hold Start and Select to begin."
      say: "Large Joust Mania update available. Hold Start and Select to begin."
    - id: joustmania_failed
      recorded: true
      text: >-
        JoustMania update failed. Make sure you are connected to the internet, and please try again.
        If failure continues, check the setup.log file in the JoustMania folder.
        Also, check JoustMania.com for updates.
      say: >-
        Joust Mania update failed. Make sure you are connected to the internet, and please try again.
        If failure continues, check the setup dot log file in the Joust Mania folder.
        Also, check Joust Mania dot com for updates.

