# Voice catalog (#2107, UC-031 BR-007, C-050): every voice line once, as text.
#
# `make voice` renders each line for every generated profile below into
# services/audio/assets/<Area>/vox/<profile>/<id>.ogg and records it in
# services/audio/assets/voice_manifest.json; `make voice-check` (CI) fails when
# this file, the manifest and the files disagree. Never edit a generated file
# by hand: change the line here and run `make voice`.
#
# Line keys:
#   id        file stem; equals the `Sound` value in lib/types.py
#   sound     `Sound` member name, when one exists (the new #2106 lines get
#             theirs with the audio runtime, #2107 part 2)
#   text      what the line says
#   say       optional respelling for the synthesizer (defaults to text)
#
# The texts of the original lines were transcribed from the former recordings
# (aaron, ivy; deleted in #2107 part 3) with a local speech-to-text pass
# (faster-whisper small.en) and the file names, then corrected by hand.
version: 1

# Loudness target: the median integrated loudness of the former Menu/vox/ivy
# recordings (-20.4 LUFS, measured with pyloudnorm, BS.1770-4), so every line
# sits at the same level.
loudness:
  target_lufs: -20.4
  tolerance_lu: 1.5

# Output format, the one the audio service decodes.
audio:
  sample_rate: 44100
  channels: 2
  vorbis_quality: 4

# Generated profiles: one pinned Piper voice each, run through sherpa-onnx
# (never the GPL piper-tts package). Licences: services/audio/assets/audio_credits.txt.
# `partner` is the generated profile a missing line plays from (fallback, BR-007).
# en_US-norman-medium was tried for gen_male and dropped: a speech-to-text
# check could not recognise its single words.
profiles:
  gen_male:
    partner: gen_female
    model: vits-piper-en_US-john-medium
    model_url: https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-john-medium.tar.bz2
    model_sha256: d90362cfa48e429d3096f644785184446145b6e38216f2eaf4c0601b8aad5a36
    speaker: 0
    length_scale: 1.0
    # Piper's defaults: lower noise blurred john's single words in a speech-to-text check.
    noise_scale: 0.667
    noise_scale_w: 0.8
  gen_female:
    partner: gen_male
    model: vits-piper-en_US-kristin-medium
    model_url: https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-kristin-medium.tar.bz2
    model_sha256: c2206f572df2956c50b1ae3367eebce3853c663e890cba8048cd62b1e4dbe6c7
    speaker: 0
    length_scale: 1.0
    noise_scale: 0.333
    noise_scale_w: 0.333

# `make voice-sample` re-renders these and compares duration and loudness with
# the committed files (Piper output is not bit-reproducible).
sample: [Menu/high, Menu/menu Joust FFA, Menu/label_sensitivity]

areas:
  Menu:
    # Game mode selection
    - {id: menu Joust FFA, sound: MENU_VOX_JOUST_FFA, text: "Joust, free for all."}
    - {id: menu Joust Teams, sound: MENU_VOX_JOUST_TEAMS, text: "Joust teams."}
    - {id: menu Joust Random Teams, sound: MENU_VOX_RANDOM_TEAMS, text: "Joust random teams."}
    - {id: menu Swapper, sound: MENU_VOX_SWAPPER, text: "Swapper."}
    - {id: menu Werewolves, sound: MENU_VOX_WEREWOLVES, text: "Werewolves."}
    - {id: menu Traitor, sound: MENU_VOX_TRAITOR, text: "Traitors."}
    - {id: menu Zombies, sound: MENU_VOX_ZOMBIES, text: "Zombies."}
    - {id: menu FightClub, sound: MENU_VOX_FIGHT_CLUB, text: "Fight Club."}
    - {id: menu Tournament, sound: MENU_VOX_TOURNAMENT, text: "Tournament.", say: "Turnament."}
    - {id: menu NonStopJoust, sound: MENU_VOX_NONSTOP_JOUST, text: "Non-stop joust."}

    # Instructions toggle
    - {id: instructions_on, sound: MENU_VOX_INSTRUCTIONS_ON, text: "Instructions on."}
    - {id: instructions_off, sound: MENU_VOX_INSTRUCTIONS_OFF, text: "Instructions off."}

    # Mode instructions. Only Free-for-All plays its clip today (game_instructions on);
    # the other modes are the FR-014 backlog (#2151), catalogued so it can wire them.
    - id: FFA-instructions
      sound: MENU_VOX_FFA_INSTRUCTIONS
      text: >-
        Joust free-for-all selected. Protect your own controller while trying to jostle others.
        When the music speeds up, your controller sensitivity decreases and you are harder to kill.
        Get ready to joust!
    - id: Teams-instructions
      sound: MENU_VOX_TEAMS_INSTRUCTIONS
      text: >-
        Joust random teams selected. Protect your own controller while trying to jostle others.
        When the music speeds up, your controller sensitivity decreases and you are harder to kill.
        Your selected team will be the color of your controller. Get ready to joust.
    - id: Swapper-instructions
      sound: MENU_VOX_SWAPPER_INSTRUCTIONS
      text: >-
        Swapper selected. Protect your own controller while trying to jostle others. There are two teams.
        If you die, you will respawn on the other team. The last player is on their own. Get ready to joust!
    - id: Tournament-instructions
      sound: MENU_VOX_TOURNAMENT_INSTRUCTIONS
      text: >-
        Tournament selected. Everyone will be paired up against another player.
        Your opponent will have the same color as your controller.
        If you defeat your opponent, you will go on to the next round.
        If your controller is white, wait to be assigned to a new player.
        The last player standing wins. Get ready to joust.
    - id: Traitor-instructions
      sound: MENU_VOX_TRAITOR_INSTRUCTIONS
      text: >-
        Traitor selected. Three teams face off against one another. However, there is one traitor on every team.
        Traitors are on a secret fourth team. If your controller vibrates during the start countdown,
        you are a traitor. Get ready to joust!
    - id: werewolf-instructions
      sound: MENU_VOX_WEREWOLF_INSTRUCTIONS
      text: >-
        Werewolf joust selected. If your controller vibrates at the start of the match, you are a werewolf.
        Werewolves will have a short period of time to kill as many humans as possible before they are revealed.
        Listen for further instructions, and get ready to joust.
    - id: zombie-instructions
      sound: MENU_VOX_ZOMBIE_INSTRUCTIONS
      text: >-
        Zombies selected. Two zombies will be randomly selected at the beginning of play.
        Zombies have a few minutes to turn all humans into more zombies. Otherwise, humans win.
        If you die as a human or a zombie, your controller will vibrate and turn red.
        You must stand still during this period until you respawn as a zombie.
        Humans can kill zombies via regular melee or with bullets.
        Use the trigger button to fire one bullet to kill one random zombie.
        If you collect five bullets, your controller will turn magenta, and you can throw a Molotov to kill all zombies.
        Humans can get more bullets by killing zombies in any way. Good luck, and get ready for the invasion!
    - id: Fightclub-instructions
      text: >-
        Two players fight. The winner must defend their title. The player with the highest score wins.

    # Lobby announcements
    - {id: notenoughplayers, sound: MENU_VOX_NOT_ENOUGH_PLAYERS, text: "Not enough players."}

    # Sensitivity
    - {id: ultra_high, sound: MENU_VOX_SENSITIVITY_ULTRA_HIGH, text: "Ultra high sensitivity."}
    - {id: high, sound: MENU_VOX_SENSITIVITY_HIGH, text: "High sensitivity."}
    - {id: medium, sound: MENU_VOX_SENSITIVITY_MEDIUM, text: "Medium sensitivity."}
    - {id: low, sound: MENU_VOX_SENSITIVITY_LOW, text: "Low sensitivity."}
    - {id: ultra_low, sound: MENU_VOX_SENSITIVITY_ULTRA_LOW, text: "Ultra low sensitivity."}

    # Admin options (numbers, on/off, true/false)
    - {id: adminop_1, sound: MENU_VOX_ADMINOP_1, text: "One."}
    - {id: adminop_2, sound: MENU_VOX_ADMINOP_2, text: "Two."}
    - {id: adminop_3, sound: MENU_VOX_ADMINOP_3, text: "Three."}
    - {id: adminop_4, sound: MENU_VOX_ADMINOP_4, text: "Four."}
    - {id: adminop_5, sound: MENU_VOX_ADMINOP_5, text: "Five."}
    - {id: adminop_6, sound: MENU_VOX_ADMINOP_6, text: "Six."}
    - {id: adminop_on, sound: MENU_VOX_ADMINOP_ON, text: "On."}
    - {id: adminop_off, sound: MENU_VOX_ADMINOP_OFF, text: "Off."}
    - {id: adminop_True, sound: MENU_VOX_ADMINOP_TRUE, text: "True."}
    - {id: adminop_False, sound: MENU_VOX_ADMINOP_FALSE, text: "False."}


    # word ends with a full stop: without it Piper blurs it.
    - {id: label_sensitivity, sound: MENU_VOX_LABEL_SENSITIVITY, text: "Sensitivity."}
    - {id: label_teams, sound: MENU_VOX_LABEL_TEAMS, text: "Teams."}
    - {id: label_agent, sound: MENU_VOX_LABEL_AGENT, text: "Agent."}
    - {id: label_backend, sound: MENU_VOX_LABEL_BACKEND, text: "Backend.", say: "Back end."}
    - {id: label_volume, sound: MENU_VOX_LABEL_VOLUME, text: "Volume."}
    - {id: label_game_mode, sound: MENU_VOX_LABEL_GAME_MODE, text: "Game mode."}
    - {id: label_instructions, sound: MENU_VOX_LABEL_INSTRUCTIONS, text: "Instructions."}
    - {id: pad_locked, sound: MENU_VOX_PAD_LOCKED, text: "Pad locked."}
    - {id: pad_unlocked, sound: MENU_VOX_PAD_UNLOCKED, text: "Pad unlocked."}

    # Decision backends (#2106)
    - {id: backend_rules, sound: MENU_VOX_BACKEND_RULES, text: "Rules."}
    - {id: backend_claude, sound: MENU_VOX_BACKEND_CLAUDE, text: "Claude."}
    - {id: backend_openai, sound: MENU_VOX_BACKEND_OPENAI, text: "OpenAI.", say: "Open A I."}
    - {id: backend_jev, sound: MENU_VOX_BACKEND_JEV, text: "Jev."}

    # Status words (#2106)
    - {id: status_not_possible, sound: MENU_VOX_STATUS_NOT_POSSIBLE, text: "Not possible."}
    - {id: status_maximum, sound: MENU_VOX_STATUS_MAXIMUM, text: "Maximum."}
    - {id: status_minimum, sound: MENU_VOX_STATUS_MINIMUM, text: "Minimum."}
    - {id: status_cancelled, sound: MENU_VOX_STATUS_CANCELLED, text: "Cancelled.", say: "Canceled."}
    - {id: status_no_connection, sound: MENU_VOX_STATUS_NO_CONNECTION, text: "No connection."}

  # Game announcers: only the lines a game mode plays (audit for #2147). Commander
  # and Fight Club play no voice line, so they have no area here.
  Joust:
    - {id: 1 minute, sound: VOX_1_MINUTE, text: "One minute remaining."}
    - {id: congratulations, sound: VOX_CONGRATULATIONS, text: "Congratulations!"}
    - {id: human win, sound: VOX_HUMAN_WIN, text: "Humans win!"}
    - {id: werewolf win, sound: VOX_WEREWOLF_WIN, text: "Werewolves win!"}
    - id: werewolf intro
      sound: VOX_WEREWOLF_INTRO
      text: >-
        Everyone, close your eyes. If your controller is vibrating right now, you are a werewolf.
        Werewolves, open your eyes now and look for your team members. Werewolves, close your eyes.
        In 30 seconds, werewolves will be revealed. Everyone, open your eyes.
      say: >-
        Everyone, close your eyes. If your controller is vibrating right now, you are a werewolf.
        Werewolves, open your eyes now and look for your team members. Werewolves, close your eyes.
        In thirty seconds, werewolves will be revealed. Everyone, open your eyes.
    - {id: werewolf reveal, sound: VOX_WEREWOLF_REVEAL, text: "Werewolves are revealed."}
    - {id: traitor win, sound: VOX_TRAITOR_WIN, text: "Traitors win!"}
    - id: traitor_intro
      sound: SFX_TRAITOR_INTRO
      text: "If your controller vibrates during the start countdown, you are a traitor."
    - {id: blue team win, sound: VOX_BLUE_TEAM_WIN, text: "And the winner is... Blue team!"}
    - {id: magenta team win, sound: VOX_MAGENTA_TEAM_WIN, text: "And the winner is... Magenta team!"}
    - {id: yellow team win, sound: VOX_YELLOW_TEAM_WIN, text: "And the winner is... Yellow team!"}
    - {id: green team win, sound: VOX_GREEN_TEAM_WIN, text: "And the winner is... Green team!"}
    - {id: cyan team win, sound: VOX_CYAN_TEAM_WIN, text: "And the winner is... Cyan team!"}

  Zombie:
    # "1 minute" plays from Joust (area order), so it is catalogued there.
    # zombie_death is a growl, not speech: the sound effect Zombie/sounds/zombie_death.ogg (no line).
    - {id: 30 seconds, sound: VOX_ZOMBIE_THIRTY_SECONDS, text: "Thirty seconds remaining."}
    - {id: 10 seconds left, sound: VOX_ZOMBIE_TEN_SECONDS, text: "Ten seconds left."}
    - {id: human_victory, sound: VOX_HUMAN_VICTORY, text: "Human victory!"}
    - {id: zombie_victory, sound: VOX_ZOMBIE_VICTORY, text: "Zombies win!"}
