[package]
name = "rust-hid"
version = "0.1.0"
edition = "2024"
description = "PS Move HID gRPC service for JoustMania"

[[bin]]
name = "rust-hid"
path = "src/main.rs"

[dependencies]
# gRPC
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tonic-health = "0.14"
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
# HID device access (hidraw backend for Linux)
hidapi = { version = "2.6", features = ["linux-static-hidraw"] }
# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-opentelemetry = "0.33"
# OpenTelemetry
opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.32"
# Process metrics via /proc/self
procfs = "0.18"
# Hostname for resource attributes
gethostname = "1.0"
# Feature flags (OpenFeature + flagd provider)
open-feature = "0.3"
open-feature-flagd = { version = "0.1", default-features = false, features = ["rpc"] }
# Tower middleware for gRPC tracing layer
tower = "0.5"
# HTTP types (Request, Response, HeaderMap) used by tower tracing layer
http = "1"

[profile.release]
strip = true

[build-dependencies]
tonic-prost-build = "0.14"
