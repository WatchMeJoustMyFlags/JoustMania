[project]
name = "joustmania-python-hid"
version = "1.0.0"
description = "Python HID gRPC service for PS Move controllers"
requires-python = ">=3.9,<3.13"
dependencies = [
    # Workspace packages
    "joustmania-proto",
    "joustmania-lib",

    # HID access
    "hidapi>=0.14.0",

    # gRPC
    "grpcio>=1.70.0",
    "grpcio-health-checking>=1.70.0",

    # OpenTelemetry
    "opentelemetry-distro>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "opentelemetry-instrumentation-grpc>=0.49b0",

    # Metrics
    "prometheus-client>=0.19.0",
    "psutil>=5.9.0",

    # Performance: uvloop for faster event loop (Linux only)
    "uvloop>=0.19.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[tool.uv.sources]
joustmania-proto = { workspace = true }
joustmania-lib = { workspace = true }

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
py-modules = []

# ruff
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "ASYNC", "B", "C4", "RET", "SIM", "ARG"]
ignore = ["ANN"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"servicer.py" = ["N802", "ARG002"]  # gRPC methods use PascalCase, unused context arg
"server.py" = ["E402"]
"tests/*.py" = ["ARG002", "E402"]
"tests/conftest.py" = ["N802", "E402", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["lib", "proto", "services"]
