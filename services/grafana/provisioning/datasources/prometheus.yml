apiVersion: 1

# Drop the datasources of removed containers (Prometheus #1449, Loki #2059)
# from Grafana databases persisted in the grafana-data volume.
deleteDatasources:
  - name: "Prometheus (Direct)"
    orgId: 1
  - name: Loki
    orgId: 1

datasources:
  # VictoriaMetrics (Prometheus-compatible) for high-frequency metrics
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://victoria-metrics:8428
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "10ms"  # Support 100Hz queries
