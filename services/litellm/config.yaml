# LiteLLM gateway config (#1049, per the #1046 design)
#
# The "tool in the middle": the agent talks to ONE OpenAI-compatible endpoint
# (this proxy on :4000) and backend selection + key custody + fallback chains
# live HERE, in config — not in the agent's Go binary.
#
# Control-plane boundary (#1046): OpenFeature / agent.json stays the control
# plane. The agent.json `model` flag (variants: phi4-mini | gemma3:4b | claude |
# copilot) is sent verbatim as the OpenAI `model` param. The route NAMES below
# MUST be a superset of those variants so a flag flip resolves to a real route.
# This file only maps route -> provider; it does NOT decide WHICH route to use.
#
# Keys live ONLY in this gateway's env (ANTHROPIC_API_KEY), NEVER in the agent
# container. The gateway works Ollama-only with NO key set — see fallbacks.

model_list:
  # ---- Free local default: host Ollama (no key, fully offline) ----
  # api_base points at the HOST machine's Ollama and is ENV-DRIVEN via
  # OLLAMA_BASE_URL (the compose service supplies the default) — NEVER hardcode a
  # machine IP here. The right host differs PER ENVIRONMENT:
  #   - Docker Desktop (macOS/Windows) & Linux w/ extra_hosts host-gateway:
  #       http://host.docker.internal:11434   (the compose default)
  #   - WSL2: host.docker.internal often resolves to the Docker NAT gateway
  #       (172.17.0.1), NOT the Windows/WSL host running Ollama, so the warmup
  #       ping gets connection-REFUSED. Point OLLAMA_BASE_URL at the WSL host's
  #       LAN/NAT IP instead, e.g. http://192.168.x.x:11434 (`ip route | awk
  #       '/default/{print $3}'` from inside a container, or the WSL host IP).
  #   - LAN Jetson / remote Ollama (#738): http://<jetson-ip>:11434
  # Set it in .env or the deployment env; do not edit this file per host.
  - model_name: phi4-mini
    litellm_params:
      model: ollama_chat/phi4-mini
      api_base: os.environ/OLLAMA_BASE_URL

  # gemma3:4b — the higher-quality local tier (#738; typically the Jetson over
  # the LAN). Same Ollama backend by default; repoint OLLAMA_BASE_URL per host.
  - model_name: gemma3:4b
    litellm_params:
      model: ollama_chat/gemma3:4b
      api_base: os.environ/OLLAMA_BASE_URL

  # ---- Optional cloud top layer: Anthropic (API key, NOT Max OAuth) ----
  # Reached only when ANTHROPIC_API_KEY is set in the GATEWAY env. The
  # agent.json `model=claude` variant resolves here. Falls back to local on a
  # cloud outage (see litellm_settings.fallbacks below).
  - model_name: claude
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # `copilot` is an agent.json variant but has NO sanctioned standalone API
  # (#1046 dropped it). Map it to the local default so a stale flag value still
  # resolves (fail-soft) instead of returning an unknown-model error.
  - model_name: copilot
    litellm_params:
      model: ollama_chat/phi4-mini
      api_base: os.environ/OLLAMA_BASE_URL

  # ---- Wildcard pass-through to Ollama (#1208) ----
  # The agent sends AGENT_INFERENCE_MODEL verbatim as the OpenAI `model` param.
  # That value MUST match an Ollama tag the operator actually pulled
  # (`/api/tags`), which varies per deployment (e.g. `gemma4:latest` was wired
  # live in verification #11 but only the four explicit routes above existed ->
  # model-not-found / wrong-route). This catch-all forwards ANY otherwise-unknown
  # model name straight to Ollama (`gemma4` -> ollama_chat/gemma4 @ api_base), so
  # the agent's configured tag resolves WITHOUT editing this file. Explicit
  # routes above take precedence for exact matches (claude/gemma3:4b keep their
  # cloud route + fallback semantics); only unmatched names hit the wildcard.
  - model_name: "*"
    litellm_params:
      model: ollama_chat/*
      api_base: os.environ/OLLAMA_BASE_URL

litellm_settings:
  # OpenTelemetry (#1087): emit one span per LLM call (gen_ai semconv — model,
  # token counts, latency, success/failure, fallback) to the shared collector.
  # The "otel" callback covers both success and failure. Exporter target +
  # service identity come from the OTEL_* env vars set on the gateway service in
  # docker-compose.yml (OTEL_EXPORTER=otlp_grpc, OTEL_ENDPOINT=otel-collector:4317).
  callbacks: ["otel"]
  # Fallback chains (#1046, #1208): a cloud outage degrades to LOCAL, never to
  # nothing. Each entry is a single-key map of a primary model_name -> a LIST of
  # alternative model_names that MUST exist in model_list above.
  #   claude    -> phi4-mini : Anthropic failure / unset key keeps answering local
  #   gemma3:4b -> phi4-mini : the higher-quality local tier degrades to the
  #                            always-present small local route.
  # phi4-mini is the terminal local tier and intentionally has no entry here.
  fallbacks:
    - claude: ["phi4-mini"]
    - gemma3:4b: ["phi4-mini"]
  # Catch-all fallback (#1208): any model_group WITHOUT a specific `fallbacks`
  # entry (e.g. a warmup ping on phi4-mini itself, or the `copilot` alias) routes
  # here instead of raising "No fallback model group found for original
  # model_group=X". phi4-mini IS the terminal local route, so it falls back to
  # itself — a no-op that silences the spurious router error seen on every warmup
  # ping (#1208) while still surfacing a genuine backend outage as a real 5xx.
  default_fallbacks: ["phi4-mini"]
  # Keep latency bounded so a hung backend degrades to the fallback promptly.
  request_timeout: 30
  # Don't abort the proxy if ANTHROPIC_API_KEY is unset — the gateway must run
  # Ollama-only. The claude route simply errors on use and falls back to local.
  drop_params: true

general_settings:
  # Optional shared key for the proxy's OpenAI-compatible API. When set, the
  # agent must send it as AGENT_INFERENCE_API_KEY. Unset (default) = open on the
  # internal docker network only (the service is not published to the host).
  master_key: os.environ/LITELLM_MASTER_KEY

  # Config/health validation (#1208): background-poll every model in model_list
  # so an unreachable api_base (the host.docker.internal-vs-WSL-host mismatch
  # that triggered this issue) surfaces PROMPTLY in `GET /health` and in the
  # proxy logs at startup — instead of only as a 5xx on each agent warmup ping.
  # NB: the COMPOSE healthcheck deliberately stays on /health/liveliness (it must
  # NOT crash-loop the gateway when the optional Ollama backend is simply absent,
  # e.g. inference still stubbed). /health is the operator-facing model probe;
  # liveliness is the container liveness gate. Auth: /health honours master_key.
  background_health_checks: true
  health_check_interval: 300
