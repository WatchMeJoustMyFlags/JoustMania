# Envoy configuration for JoustMania
# Entry point for all HTTP traffic on port 80
#
# Route configuration:
#   /joustmania*    -> connect-proxy:8080 (PRESERVE prefix, gRPC-Web)
#   /grafana/*      -> grafana:3000       (PRESERVE prefix, serve_from_sub_path=true)
#   /jaeger/*       -> jaeger:16686       (PRESERVE prefix, base_path=/jaeger in config.yaml)
#   /victoria-metrics/* -> victoria-metrics:8428 (STRIP prefix, API expects root)
#   /flags/*        -> flag-service:8070  (STRIP prefix, flag service API, #1407)
#   /pairing/*      -> connect-proxy:8080 (PRESERVE prefix, operator unpair, UC-005)
#   /health         -> envoy internal     (health check)
#   /*              -> dashboard:8080     (SPA with fallback)

static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 80
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        # gRPC-Web API (Connect protocol)
                        # PRESERVE prefix - connect-proxy expects /joustmania.* paths
                        - match:
                            prefix: "/joustmania"
                          route:
                            cluster: connect_proxy
                            timeout: 3600s  # Long timeout for streaming RPCs

                        # Grafana UI
                        # PRESERVE prefix - Grafana configured with serve_from_sub_path=true
                        - match:
                            prefix: "/grafana/"
                          route:
                            cluster: grafana
                        - match:
                            path: "/grafana"
                          redirect:
                            path_redirect: "/grafana/"

                        # Jaeger UI
                        # PRESERVE prefix - configured with --query.base-path=/jaeger/
                        - match:
                            prefix: "/jaeger/"
                          route:
                            cluster: jaeger
                        - match:
                            path: "/jaeger"
                          redirect:
                            path_redirect: "/jaeger/"

                        # VictoriaMetrics API
                        # STRIP prefix - API expects root paths
                        - match:
                            prefix: "/victoria-metrics/"
                          route:
                            cluster: victoria_metrics
                            prefix_rewrite: "/"
                        - match:
                            path: "/victoria-metrics"
                          redirect:
                            path_redirect: "/victoria-metrics/"

                        # Agent experiment dossier (#1183)
                        # PRESERVE prefix - agent serves /experiments + /experiments/{id} at root
                        - match:
                            prefix: "/experiments"
                          route:
                            cluster: agent_dossier

                        # Flag service HTTP/JSON API (epic #1407, services.md §7.2)
                        # STRIP prefix - the service serves /{flagSetId}/{flagName} at root,
                        # so stage scripts use http://localhost/flags/<set>/<flag> (C-015: no
                        # new host port). Unauthenticated on the LAN by decision (D11).
                        - match:
                            prefix: "/flags/"
                          route:
                            cluster: flag_service
                            prefix_rewrite: "/"

                        # Operator unpair (UC-005), forwarded to the pairing daemon
                        # PRESERVE prefix - connect-proxy handles /pairing/* paths
                        - match:
                            prefix: "/pairing/"
                          route:
                            cluster: connect_proxy
                            # above the proxy's 35 s client and the daemon's 30 s unpair timeout
                            timeout: 40s

                        # Health check endpoint
                        - match:
                            path: "/health"
                          direct_response:
                            status: 200
                            body:
                              inline_string: "OK"

                        # Dashboard SPA (catch-all)
                        # static-web-server handles SPA fallback internally
                        - match:
                            prefix: "/"
                          route:
                            cluster: dashboard

                # Generate trace context and propagate W3C traceparent headers.
                # Envoy sends spans to the OTEL Collector via gRPC, which
                # forwards them to Jaeger.
                generate_request_id: true
                tracing:
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      grpc_service:
                        envoy_grpc:
                          cluster_name: otel_collector
                        timeout: 5s
                      service_name: envoy
                      resource_detectors:
                        - name: envoy.tracers.opentelemetry.resource_detectors.environment
                          typed_config:
                            "@type": type.googleapis.com/envoy.extensions.tracers.opentelemetry.resource_detectors.v3.EnvironmentResourceDetectorConfig
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # Connect-proxy for gRPC-Web
    - name: connect_proxy
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: connect_proxy
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: connect-proxy
                      port_value: 8080

    # Grafana metrics visualization
    - name: grafana
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: grafana
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: grafana
                      port_value: 3000

    # Jaeger tracing UI
    - name: jaeger
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: jaeger
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: jaeger
                      port_value: 16686

    # VictoriaMetrics long-term metrics storage
    - name: victoria_metrics
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: victoria_metrics
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: victoria-metrics
                      port_value: 8428

    # Flag service HTTP API (epic #1407)
    - name: flag_service
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: flag_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: flag-service
                      port_value: 8070

    # Dashboard SPA (static-web-server)
    - name: dashboard
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: dashboard
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: dashboard
                      port_value: 8080

    # Agent experiment-dossier HTTP view (#1183)
    - name: agent_dossier
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: agent_dossier
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: agent
                      port_value: 13134

    # OTEL Collector for trace export (gRPC on port 4317)
    - name: otel_collector
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: otel_collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: otel-collector
                      port_value: 4317

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
