receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Prometheus receiver to scrape infrastructure targets that don't push via OTLP.
  # These metrics flow to VictoriaMetrics so Grafana dashboards (which default to
  # VictoriaMetrics) can display host metrics alongside OTEL-pushed service metrics.
  prometheus/infra:
    config:
      scrape_configs:
        - job_name: 'node'
          scrape_interval: 30s
          scrape_timeout: 25s
          static_configs:
            - targets: ['node-exporter:9100']
              labels:
                instance: 'raspberry-pi'

  # Observability stack: monitoring tools that observe the system
  prometheus/observability:
    config:
      scrape_configs:
        - job_name: 'victoria-metrics'
          scrape_interval: 30s
          static_configs:
            - targets: ['victoria-metrics:8428']
        - job_name: 'prometheus'
          scrape_interval: 30s
          static_configs:
            - targets: ['prometheus:9090']
        # Self-telemetry: the collector exposes its own metrics on :8888.
        # Rename otelcol_process_* to standard process_* for unified dashboards.
        - job_name: 'otel-collector'
          scrape_interval: 30s
          static_configs:
            - targets: ['localhost:8888']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'otelcol_process_cpu_seconds'
              target_label: __name__
              replacement: 'process_cpu_seconds_total'
            - source_labels: [__name__]
              regex: 'otelcol_process_memory_rss'
              target_label: __name__
              replacement: 'process_resident_memory_bytes'

  # Filelog receiver — tail Docker container JSON logs for non-OTLP services
  # (connect-proxy, rust-hid, envoy, flagd, redis, etc.)
  filelog/docker:
    include:
      - /var/lib/docker/containers/*/*-json.log
    start_at: end
    include_file_path: true
    include_file_name: false
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.time
          layout: '%Y-%m-%dT%H:%M:%S.%LZ'
      - type: move
        from: attributes.log
        to: body
      - type: move
        from: attributes.stream
        to: attributes["log.iostream"]
      - type: remove
        field: attributes.time

  # Infrastructure: supporting services for the game platform
  prometheus/infrastructure:
    config:
      scrape_configs:
        - job_name: 'flagd'
          scrape_interval: 30s
          static_configs:
            - targets: ['flagd:8014']

processors:
  # Batch processor for better performance (traces/logs)
  batch:
    timeout: 10s
    send_batch_size: 1024

  # Fast batch processor for sub-second metrics (Issue #105)
  batch/fast:
    timeout: 100ms
    send_batch_size: 1000

  # Memory limiter to prevent OOM
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

  # Resource processor to add common attributes
  resource:
    attributes:
      - key: deployment.environment
        value: development
        action: insert
      # NOTE: service.namespace removed — when set, the prometheusremotewrite
      # exporter prefixes the job label (e.g. "joustmania/controller-manager")
      # which breaks dashboard queries expecting just "controller-manager".

  # Filter processor to select only acceleration metrics for bizevents pipeline
  filter/accel:
    metrics:
      include:
        match_type: regexp
        metric_names: ["controller_accel_.*"]

  # Resource processors for scraped targets — Dynatrace needs service.name
  # to recognize these as services in the service overview. OTLP-pushed
  # services (Python, Rust) set this in their SDK; scraped targets need it
  # injected here.
  resource/flagd:
    attributes:
      - key: service.name
        value: flagd
        action: insert
      - key: service.namespace
        value: infrastructure
        action: insert

  resource/otel-collector:
    attributes:
      - key: service.name
        value: otel-collector
        action: insert
      - key: service.namespace
        value: observability
        action: insert

  # Transform processor — promote Docker labels to OTEL resource attributes
  transform/docker_logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # service.name from compose service label
          - set(resource.attributes["service.name"], attributes["attrs"]["com.docker.compose.service"])
            where attributes["attrs"]["com.docker.compose.service"] != nil
          # container.name (same as service name in compose)
          - set(resource.attributes["container.name"], attributes["attrs"]["com.docker.compose.service"])
            where attributes["attrs"]["com.docker.compose.service"] != nil
          # container.image.name from full image reference (strip tag after)
          - set(resource.attributes["container.image.name"], attributes["attrs"]["com.docker.compose.image"])
            where attributes["attrs"]["com.docker.compose.image"] != nil
          # container.image.tag — extract portion after last ':'
          - set(resource.attributes["container.image.tag"], attributes["attrs"]["com.docker.compose.image"])
            where attributes["attrs"]["com.docker.compose.image"] != nil
          - replace_pattern(resource.attributes["container.image.name"], ":[^:]*$", "")
            where resource.attributes["container.image.name"] != nil
          - replace_pattern(resource.attributes["container.image.tag"], "^.*:", "")
            where resource.attributes["container.image.tag"] != nil
          # container.id from file path
          - set(resource.attributes["container.id"], attributes["log.file.path"])
            where attributes["log.file.path"] != nil
          - replace_pattern(resource.attributes["container.id"], "^.*/([a-f0-9]+)/.*$", "$1")
            where resource.attributes["container.id"] != nil
          # Clean up intermediate attributes
          - delete_key(attributes, "attrs")
            where attributes["attrs"] != nil

  # Filter processor — exclude services that already push OTLP logs + the collector itself
  filter/exclude_otlp_services:
    logs:
      exclude:
        match_type: regexp
        resource_attributes:
          - key: service.name
            value: "^(controller-manager|game-coordinator|menu|audio|pairing-daemon|otel-collector)$"

  # Cumulative-to-delta processor for Dynatrace.
  # Dynatrace requires delta temporality for counters; the local stack
  # (VictoriaMetrics/Prometheus) expects cumulative. This processor is only
  # used in Dynatrace-specific pipelines, keeping local pipelines isolated.
  cumulativetodelta: {}

exporters:
  # OTLP exporter to send traces to Jaeger
  # Jaeger has OTLP support enabled and accepts OTLP on port 4317
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Prometheus remote write to VictoriaMetrics for high-frequency metrics storage
  prometheusremotewrite:
    endpoint: "http://victoria-metrics:8428/api/v1/write"
    tls:
      insecure: true

  # Prometheus exporter for metrics (exposed on :8889 for backward compatibility)
  prometheus:
    endpoint: "0.0.0.0:8889"

  # Loki exporter for logs (OTLP native ingestion, Loki 3.x)
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # Debug exporter for local troubleshooting
  debug:
    verbosity: basic

  # Dynatrace OTLP HTTP exporter.
  # Uses env-var expansion: set DYNATRACE_ENDPOINT and DYNATRACE_API_TOKEN.
  otlphttp/dynatrace:
    endpoint: ${env:DYNATRACE_ENDPOINT}
    headers:
      Authorization: "Api-Token ${env:DYNATRACE_API_TOKEN}"

  # Custom Dynatrace bizevents exporter.
  # Converts metric data points directly to Dynatrace business events,
  # bypassing the metrics→logs signal conversion. High-frequency acceleration
  # data (100Hz) is invisible in Dynatrace's 1-minute metric resolution —
  # bizevents bypass this limit.
  dtbizevents:
    endpoint: ${env:DYNATRACE_BIZEVENTS_ENDPOINT}
    api_token: ${env:DYNATRACE_BIZEVENTS_TOKEN}
    batch_interval_ms: 1000

service:
  pipelines:
    # ── Local pipelines (unchanged from config.yaml) ───────────────────

    # Traces pipeline
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlp/jaeger, debug]

    # Metrics pipeline - uses fast batch processor for sub-second updates
    # Fan-out to VictoriaMetrics (storage) and Prometheus (backward compat)
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch/fast, resource]
      exporters: [prometheusremotewrite, prometheus]

    # Infrastructure metrics pipeline — scraped targets (node-exporter, etc.)
    # Only exports to VictoriaMetrics since Prometheus already scrapes these directly.
    # Does NOT use the resource processor (no need to tag host metrics with
    # deployment.environment, and avoids any future service.namespace issues).
    metrics/infra:
      receivers: [prometheus/infra]
      processors: [memory_limiter, batch/fast]
      exporters: [prometheusremotewrite]

    # Observability metrics — victoria-metrics, prometheus, otel-collector
    metrics/observability:
      receivers: [prometheus/observability]
      processors: [memory_limiter, batch/fast]
      exporters: [prometheusremotewrite]

    # Infrastructure metrics — flagd (scraped, not OTLP-pushed)
    metrics/infrastructure:
      receivers: [prometheus/infrastructure]
      processors: [memory_limiter, batch/fast]
      exporters: [prometheusremotewrite]

    # Logs pipeline
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlphttp/loki, debug]

    # Container logs pipeline — Docker JSON logs from non-OTLP services
    logs/containers:
      receivers: [filelog/docker]
      processors: [memory_limiter, transform/docker_logs, filter/exclude_otlp_services, batch, resource]
      exporters: [otlphttp/loki, debug]

    # ── Dynatrace pipelines ────────────────────────────────────────────
    # Parallel export to Dynatrace. Uses batch (10s) instead of batch/fast
    # (100ms) because Dynatrace has 1-minute metric resolution — sub-second
    # batches would just waste bandwidth to a cloud endpoint.

    traces/dynatrace:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlphttp/dynatrace]

    metrics/dynatrace:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource, cumulativetodelta]
      exporters: [otlphttp/dynatrace]

    metrics/infra-dynatrace:
      receivers: [prometheus/infra]
      processors: [memory_limiter, batch, cumulativetodelta]
      exporters: [otlphttp/dynatrace]

    metrics/observability-dynatrace:
      receivers: [prometheus/observability]
      processors: [memory_limiter, resource/otel-collector, batch, cumulativetodelta]
      exporters: [otlphttp/dynatrace]

    metrics/infrastructure-dynatrace:
      receivers: [prometheus/infrastructure]
      processors: [memory_limiter, resource/flagd, batch, cumulativetodelta]
      exporters: [otlphttp/dynatrace]

    logs/dynatrace:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlphttp/dynatrace]

    # Container logs to Dynatrace — container.* attributes create proper entities
    logs/containers-dynatrace:
      receivers: [filelog/docker]
      processors: [memory_limiter, transform/docker_logs, filter/exclude_otlp_services, batch, resource]
      exporters: [otlphttp/dynatrace]

    # ── Bizevents pipeline (acceleration → Dynatrace business events) ─
    # High-frequency accel metrics (100Hz) are invisible in Dynatrace's
    # 1-minute metric resolution. The dtbizevents exporter converts them
    # directly to flat JSON and POSTs to /api/v2/bizevents/ingest.

    metrics/accel-bizevents:
      receivers: [otlp]
      processors: [memory_limiter, filter/accel, batch/fast, resource]
      exporters: [dtbizevents]

  extensions: [health_check]

extensions:
  health_check:
    endpoint: :13133
