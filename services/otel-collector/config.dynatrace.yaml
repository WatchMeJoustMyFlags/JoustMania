receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Prometheus receiver to scrape infrastructure targets that don't push via OTLP.
  # These metrics flow to VictoriaMetrics so Grafana dashboards (which default to
  # VictoriaMetrics) can display host metrics alongside OTEL-pushed service metrics.
  prometheus/infra:
    config:
      scrape_configs:
        - job_name: 'node'
          scrape_interval: 30s
          scrape_timeout: 25s
          static_configs:
            - targets: ['node-exporter:9100']
              labels:
                instance: 'raspberry-pi'

  # Observability stack: monitoring tools that observe the system
  prometheus/observability:
    config:
      scrape_configs:
        - job_name: 'victoria-metrics'
          scrape_interval: 30s
          static_configs:
            - targets: ['victoria-metrics:8428']
        - job_name: 'prometheus'
          scrape_interval: 30s
          static_configs:
            - targets: ['prometheus:9090']
        # Self-telemetry: the collector exposes its own metrics on :8888.
        # Rename otelcol_process_* to standard process_* for unified dashboards.
        - job_name: 'otel-collector'
          scrape_interval: 30s
          static_configs:
            - targets: ['localhost:8888']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'otelcol_process_cpu_seconds'
              target_label: __name__
              replacement: 'process_cpu_seconds_total'
            - source_labels: [__name__]
              regex: 'otelcol_process_memory_rss'
              target_label: __name__
              replacement: 'process_resident_memory_bytes'

  # Infrastructure: supporting services for the game platform
  prometheus/infrastructure:
    config:
      scrape_configs:
        - job_name: 'flagd'
          scrape_interval: 30s
          static_configs:
            - targets: ['flagd:8014']

processors:
  # Batch processor for better performance (traces/logs)
  batch:
    timeout: 10s
    send_batch_size: 1024

  # Fast batch processor for sub-second metrics (Issue #105)
  batch/fast:
    timeout: 100ms
    send_batch_size: 1000

  # Memory limiter to prevent OOM
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

  # Resource processor to add common attributes
  resource:
    attributes:
      - key: deployment.environment
        value: development
        action: insert
      # NOTE: service.namespace removed — when set, the prometheusremotewrite
      # exporter prefixes the job label (e.g. "joustmania/controller-manager")
      # which breaks dashboard queries expecting just "controller-manager".

  # Filter processor to select only acceleration metrics for bizevents pipeline
  filter/accel:
    metrics:
      include:
        match_type: regexp
        metric_names: ["controller_accel_.*"]

  # Cumulative-to-delta processor for Dynatrace.
  # Dynatrace requires delta temporality for counters; the local stack
  # (VictoriaMetrics/Prometheus) expects cumulative. This processor is only
  # used in Dynatrace-specific pipelines, keeping local pipelines isolated.
  cumulativetodelta: {}

exporters:
  # OTLP exporter to send traces to Jaeger
  # Jaeger has OTLP support enabled and accepts OTLP on port 4317
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Prometheus remote write to VictoriaMetrics for high-frequency metrics storage
  prometheusremotewrite:
    endpoint: "http://victoria-metrics:8428/api/v1/write"
    tls:
      insecure: true

  # Prometheus exporter for metrics (exposed on :8889 for backward compatibility)
  prometheus:
    endpoint: "0.0.0.0:8889"

  # Loki exporter for logs (OTLP native ingestion, Loki 3.x)
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # Debug exporter for local troubleshooting
  debug:
    verbosity: basic

  # Dynatrace OTLP HTTP exporter.
  # Uses env-var expansion: set DYNATRACE_ENDPOINT and DYNATRACE_API_TOKEN.
  otlphttp/dynatrace:
    endpoint: ${env:DYNATRACE_ENDPOINT}
    headers:
      Authorization: "Api-Token ${env:DYNATRACE_API_TOKEN}"

  # OTLP HTTP exporter to bizevents bridge sidecar
  # Sends metricsaslogs output (OTLP logs) for conversion to Dynatrace bizevents
  otlphttp/bizevents-bridge:
    endpoint: "http://bizevents-bridge:4319"
    encoding: json
    tls:
      insecure: true

connectors:
  # Converts metric data points into OTLP log records for Dynatrace bizevents.
  # Dynatrace has 1-minute metric resolution, so high-frequency acceleration
  # data (100Hz) is invisible as metrics. Converting to logs lets Dynatrace
  # OpenPipeline route them as business events for analysis.
  metricsaslogs:
    include_resource_attributes: true
    include_scope_info: true

service:
  pipelines:
    # ── Local pipelines (unchanged from config.yaml) ───────────────────

    # Traces pipeline
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlp/jaeger, debug]

    # Metrics pipeline - uses fast batch processor for sub-second updates
    # Fan-out to VictoriaMetrics (storage) and Prometheus (backward compat)
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch/fast, resource]
      exporters: [prometheusremotewrite, prometheus]

    # Infrastructure metrics pipeline — scraped targets (node-exporter, etc.)
    # Only exports to VictoriaMetrics since Prometheus already scrapes these directly.
    # Does NOT use the resource processor (no need to tag host metrics with
    # deployment.environment, and avoids any future service.namespace issues).
    metrics/infra:
      receivers: [prometheus/infra]
      processors: [memory_limiter, batch/fast]
      exporters: [prometheusremotewrite]

    # Observability metrics — victoria-metrics, prometheus, otel-collector
    metrics/observability:
      receivers: [prometheus/observability]
      processors: [memory_limiter, batch/fast]
      exporters: [prometheusremotewrite]

    # Infrastructure metrics — flagd (scraped, not OTLP-pushed)
    metrics/infrastructure:
      receivers: [prometheus/infrastructure]
      processors: [memory_limiter, batch/fast]
      exporters: [prometheusremotewrite]

    # Logs pipeline
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlphttp/loki, debug]

    # ── Dynatrace pipelines ────────────────────────────────────────────
    # Parallel export to Dynatrace. Uses batch (10s) instead of batch/fast
    # (100ms) because Dynatrace has 1-minute metric resolution — sub-second
    # batches would just waste bandwidth to a cloud endpoint.

    traces/dynatrace:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlphttp/dynatrace]

    metrics/dynatrace:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource, cumulativetodelta]
      exporters: [otlphttp/dynatrace]

    metrics/infra-dynatrace:
      receivers: [prometheus/infra]
      processors: [memory_limiter, batch, cumulativetodelta]
      exporters: [otlphttp/dynatrace]

    metrics/observability-dynatrace:
      receivers: [prometheus/observability]
      processors: [memory_limiter, batch, cumulativetodelta]
      exporters: [otlphttp/dynatrace]

    metrics/infrastructure-dynatrace:
      receivers: [prometheus/infrastructure]
      processors: [memory_limiter, batch, cumulativetodelta]
      exporters: [otlphttp/dynatrace]

    logs/dynatrace:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlphttp/dynatrace]

    # ── Bizevents pipeline (acceleration → Dynatrace business events) ─
    # High-frequency accel metrics (100Hz) are invisible in Dynatrace's
    # 1-minute metric resolution. The metricsaslogs connector converts
    # them to log records, which the bizevents-bridge sidecar transforms
    # into flat JSON and POSTs to /api/v2/bizevents/ingest.

    metrics/accel-bizevents:
      receivers: [otlp]
      processors: [memory_limiter, filter/accel, batch/fast, resource]
      exporters: [metricsaslogs]

    logs/bizevents:
      receivers: [metricsaslogs]
      processors: [memory_limiter, batch, resource]
      exporters: [otlphttp/bizevents-bridge]

  extensions: [health_check]

extensions:
  health_check:
    endpoint: :13133
