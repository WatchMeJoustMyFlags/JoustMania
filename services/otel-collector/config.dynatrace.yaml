receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Observability stack: monitoring tools that observe the system
  prometheus/observability:
    config:
      scrape_configs:
        - job_name: 'victoria-metrics'
          scrape_interval: 30s
          static_configs:
            - targets: ['victoria-metrics:8428']
        - job_name: 'prometheus'
          scrape_interval: 30s
          static_configs:
            - targets: ['prometheus:9090']
        # Self-telemetry: the collector exposes its own metrics on :8888.
        # Rename otelcol_process_* to standard process_* for unified dashboards.
        - job_name: 'otel-collector'
          scrape_interval: 30s
          static_configs:
            - targets: ['localhost:8888']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'otelcol_process_cpu_seconds'
              target_label: __name__
              replacement: 'process_cpu_seconds_total'
            - source_labels: [__name__]
              regex: 'otelcol_process_memory_rss'
              target_label: __name__
              replacement: 'process_resident_memory_bytes'

  # Filelog receiver — tail Docker container JSON logs for non-OTLP services
  # (connect-proxy, rust-hid, envoy, flagd, etc.)
  filelog/docker:
    include:
      - /var/lib/docker/containers/*/*-json.log
    start_at: end
    include_file_path: true
    include_file_name: false
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.time
          layout: '%Y-%m-%dT%H:%M:%S.%LZ'
      - type: move
        from: attributes.log
        to: body
      - type: move
        from: attributes.stream
        to: attributes["log.iostream"]
      - type: remove
        field: attributes.time

  # ── Host metrics — Dynatrace OpenTelemetry Host Monitoring extension ───
  # Split into three collection intervals per Dynatrace reference config:
  #   1m: Critical metrics for fast alerting (CPU utilization, load 1m)
  #   5m: Standard metrics (network, disk, filesystem, processes)
  #   1h: Slow-changing metadata (memory limit, CPU count, uptime)
  # Requires hostfs volume mounts: /proc, /sys, / → /hostfs/

  hostmetrics/1m:
    root_path: /hostfs/root
    collection_interval: 1m
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
          system.cpu.time:
            enabled: false
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
          system.memory.usage:
            enabled: false
      load:
        metrics:
          system.cpu.load_average.1m:
            enabled: true
          system.cpu.load_average.5m:
            enabled: false
          system.cpu.load_average.15m:
            enabled: false

  hostmetrics/5m:
    root_path: /hostfs/root
    collection_interval: 5m
    scrapers:
      cpu:
        metrics:
          system.cpu.time:
            enabled: true
      memory:
        metrics:
          system.memory.usage:
            enabled: true
      paging:
        metrics:
          system.paging.usage:
            enabled: true
          system.paging.operations:
            enabled: true
          system.paging.faults:
            enabled: true
      network:
        exclude:
          match_type: regexp
          interfaces: ['^(lo|veth.*|docker.*|br-.*)$$']
        metrics:
          system.network.io:
            enabled: true
          system.network.packets:
            enabled: true
          system.network.errors:
            enabled: true
          system.network.connections:
            enabled: true
          system.network.dropped:
            enabled: true
      load:
        metrics:
          system.cpu.load_average.1m:
            enabled: false
          system.cpu.load_average.5m:
            enabled: true
          system.cpu.load_average.15m:
            enabled: true
      disk:
        metrics:
          system.disk.io:
            enabled: true
          system.disk.operations:
            enabled: true
          system.disk.io_time:
            enabled: true
          system.disk.operation_time:
            enabled: true
          system.disk.pending_operations:
            enabled: false
          system.disk.merged:
            enabled: false
          system.disk.weighted_io_time:
            enabled: false
      filesystem:
        exclude_mount_points:
          match_type: regexp
          mount_points: ['^/(sys|proc|dev|host|etc)($$|/)']
        metrics:
          system.filesystem.usage:
            enabled: true
          system.filesystem.utilization:
            enabled: true
          system.filesystem.inodes.usage:
            enabled: true
      processes:
        metrics:
          system.processes.count:
            enabled: true
          system.processes.created:
            enabled: true
      process:
        mute_process_all_errors: true
        metrics:
          process.cpu.utilization:
            enabled: true
          process.cpu.time:
            enabled: true
          process.memory.usage:
            enabled: true
          process.memory.virtual:
            enabled: true
          process.disk.io:
            enabled: true

  hostmetrics/1h:
    root_path: /hostfs/root
    collection_interval: 1h
    scrapers:
      memory:
        metrics:
          system.memory.limit:
            enabled: true
          system.memory.usage:
            enabled: false
      cpu:
        metrics:
          system.cpu.logical.count:
            enabled: true
          system.cpu.physical.count:
            enabled: true
          system.cpu.time:
            enabled: false
      system:
        metrics:
          system.uptime:
            enabled: true

  # Container metrics — per-container CPU, memory, network, block I/O
  # Requires Docker socket mount: /var/run/docker.sock
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s
    provide_per_core_cpu_metrics: false
    metrics:
      container.cpu.usage.total:
        enabled: true
      container.memory.usage.total:
        enabled: true
      container.memory.usage.limit:
        enabled: true
      container.network.io.usage.rx_bytes:
        enabled: true
      container.network.io.usage.tx_bytes:
        enabled: true
      container.blockio.io_service_bytes_recursive:
        enabled: true
      container.cpu.percent:
        enabled: true
      container.memory.percent:
        enabled: true

  # Infrastructure: supporting services for the game platform
  # Split into separate receivers so each gets its own resource processor
  # (service.name) in the Dynatrace pipelines.
  prometheus/flagd:
    config:
      scrape_configs:
        - job_name: 'flagd'
          scrape_interval: 30s
          static_configs:
            - targets: ['flagd:8014']

  prometheus/envoy:
    config:
      scrape_configs:
        - job_name: 'envoy'
          scrape_interval: 30s
          metrics_path: '/stats/prometheus'
          static_configs:
            - targets: ['envoy:9901']

processors:
  # Batch processor for better performance (traces/logs)
  batch:
    timeout: 10s
    send_batch_size: 1024

  # Fast batch processor for sub-second metrics (Issue #105)
  batch/fast:
    timeout: 100ms
    send_batch_size: 1000

  # Batch processor for Dynatrace host metrics (per reference config)
  batch/dynatrace:
    send_batch_size: 3000
    send_batch_max_size: 3000
    timeout: 60s

  # Memory limiter to prevent OOM
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

  # Resource processor to add common attributes
  resource:
    attributes:
      - key: deployment.environment
        value: development
        action: insert
      # NOTE: service.namespace removed — when set, the prometheusremotewrite
      # exporter prefixes the job label (e.g. "joustmania/controller-manager")
      # which breaks dashboard queries expecting just "controller-manager".

  # Filter processor to select only acceleration metrics for bizevents pipeline
  filter/accel:
    metrics:
      include:
        match_type: regexp
        metric_names: ["controller_accel_.*"]

  # ── Dynatrace Host Monitoring processors ────────────────────────────
  # Per Dynatrace reference config (host-metrics.yaml). These optimize
  # hostmetrics data for the OpenTelemetry Host Monitoring extension.

  # Filter: remove idle CPU state (the extension computes it from utilization)
  filter/hostmetrics:
    metrics:
      datapoint:
        - metric.name == "system.cpu.utilization" and attributes["state"] == "idle"

  # Transform: aggregate CPU across cores, clean up noisy attributes
  transform/hostmetrics:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          # Clean process command line for entity IDs
          - replace_pattern(resource.attributes["process.command_line"], " ", "_")
          # Convert host.ip from array to first value
          - set(resource.attributes["host.ip"], resource.attributes["host.ip"][0])
            where resource.attributes["host.ip"] != nil

      - context: datapoint
        statements:
          # Strip noisy process attributes — extension only needs command_line
          - delete_key(resource.attributes, "process.cgroup") where IsMatch(metric.name, "^process\\..*")
          - delete_key(resource.attributes, "process.command") where IsMatch(metric.name, "^process\\..*")
          - delete_key(resource.attributes, "process.executable.path") where IsMatch(metric.name, "^process\\..*")
          - delete_key(resource.attributes, "process.owner") where IsMatch(metric.name, "^process\\..*")
          - delete_key(resource.attributes, "process.parent_pid") where IsMatch(metric.name, "^process\\..*")
          - delete_key(resource.attributes, "process.pid") where IsMatch(metric.name, "^process\\..*")
          - delete_key(resource.attributes, "process.command_line") where IsMatch(metric.name, "^process\\..*")
          - delete_key(resource.attributes, "process.command_args") where IsMatch(metric.name, "^process\\..*")
          # Remove empty device attributes
          - delete_key(datapoint.attributes, "device") where datapoint.attributes["device"] == ""
          # Remove protocol from network metrics
          - delete_key(datapoint.attributes, "protocol") where IsMatch(metric.name, "^system\\.network\\..*")
          # Filesystem: extension uses mountpoint and state only
          - delete_key(datapoint.attributes, "device") where IsMatch(metric.name, "^system\\.filesystem\\..*")
          - delete_key(datapoint.attributes, "mode") where IsMatch(metric.name, "^system\\.filesystem\\..*")
          - delete_key(datapoint.attributes, "type") where IsMatch(metric.name, "^system\\.filesystem\\..*")

      - context: metric
        statements:
          # Sum CPU utilization across states (per core)
          - aggregate_on_attributes("sum", ["cpu"]) where metric.name == "system.cpu.utilization"

      - context: datapoint
        statements:
          # Remove per-core dimension after summing
          - delete_key(datapoint.attributes, "cpu") where metric.name == "system.cpu.utilization"

      - context: metric
        statements:
          # Average across cores into a single host-level value
          - aggregate_on_attributes("mean") where metric.name == "system.cpu.utilization"

  resource/host:
    attributes:
      - key: service.namespace
        value: host
        action: insert
      - key: service.name
        value: node
        action: insert

  resource/containers:
    attributes:
      - key: service.namespace
        value: containers
        action: insert

  # Resource processors for scraped targets — Dynatrace needs service.name
  # to recognize these as services in the service overview. OTLP-pushed
  # services (Python, Rust) set this in their SDK; scraped targets need it
  # injected here.
  resource/flagd:
    attributes:
      - key: service.name
        value: flagd
        action: insert
      - key: service.namespace
        value: infrastructure
        action: insert

  resource/envoy:
    attributes:
      - key: service.name
        value: envoy
        action: insert
      - key: service.namespace
        value: infrastructure
        action: insert

  resource/otel-collector:
    attributes:
      - key: service.name
        value: otel-collector
        action: insert
      - key: service.namespace
        value: observability
        action: insert

  # Transform processor — promote Docker labels to OTEL resource attributes
  transform/docker_logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # service.name from compose service label
          - set(resource.attributes["service.name"], attributes["attrs"]["com.docker.compose.service"])
            where attributes["attrs"]["com.docker.compose.service"] != nil
          # container.name (same as service name in compose)
          - set(resource.attributes["container.name"], attributes["attrs"]["com.docker.compose.service"])
            where attributes["attrs"]["com.docker.compose.service"] != nil
          # container.image.name from full image reference (strip tag after)
          - set(resource.attributes["container.image.name"], attributes["attrs"]["com.docker.compose.image"])
            where attributes["attrs"]["com.docker.compose.image"] != nil
          # container.image.tag — extract portion after last ':'
          - set(resource.attributes["container.image.tag"], attributes["attrs"]["com.docker.compose.image"])
            where attributes["attrs"]["com.docker.compose.image"] != nil
          - replace_pattern(resource.attributes["container.image.name"], ":[^:]*$", "")
            where resource.attributes["container.image.name"] != nil
          - replace_pattern(resource.attributes["container.image.tag"], "^.*:", "")
            where resource.attributes["container.image.tag"] != nil
          # container.id from file path
          - set(resource.attributes["container.id"], attributes["log.file.path"])
            where attributes["log.file.path"] != nil
          - replace_pattern(resource.attributes["container.id"], "^.*/([a-f0-9]+)/.*$", "$1")
            where resource.attributes["container.id"] != nil
          # Clean up intermediate attributes
          - delete_key(attributes, "attrs")
            where attributes["attrs"] != nil

  # Filter processor — exclude services that already push OTLP logs + the collector itself
  filter/exclude_otlp_services:
    logs:
      exclude:
        match_type: regexp
        resource_attributes:
          - key: service.name
            value: "^(controller-manager|game-coordinator|menu|audio|pairing-daemon|otel-collector|connect-proxy|rust-hid|python-hid)$"

  # Resource detection for service pipelines (traces, metrics, logs from OTLP).
  # Uses env + system only — NOT docker. The docker detector would stamp the
  # collector's own container.name on all service data, breaking Dynatrace
  # entity linking (every service appears to run in the collector container).
  # Services set their own container.name via the SDK.
  # override: false preserves SDK-set attributes (service.name, host.name, etc.).
  resourcedetection/services:
    detectors: [env, system]
    timeout: 5s
    override: false
    system:
      hostname_sources: ["lookup"]
      resource_attributes:
        host.name:
          enabled: true
        host.id:
          enabled: true
        host.arch:
          enabled: true
        host.ip:
          enabled: true
        host.mac:
          enabled: true
        host.cpu.model.name:
          enabled: true
        os.type:
          enabled: true
        os.description:
          enabled: true
        os.name:
          enabled: true
        os.version:
          enabled: true

  # Resource detection for infrastructure pipelines (hostmetrics, docker_stats,
  # scraped targets, container logs). Includes docker detector because these
  # pipelines originate from the collector itself — the collector's container
  # metadata is correct context here.
  resourcedetection/infra:
    detectors: [env, system, docker]
    timeout: 5s
    override: false
    system:
      hostname_sources: ["lookup"]
      resource_attributes:
        host.name:
          enabled: true
        host.id:
          enabled: true
        host.arch:
          enabled: true
        host.ip:
          enabled: true
        host.mac:
          enabled: true
        host.cpu.model.name:
          enabled: true
        os.type:
          enabled: true
        os.description:
          enabled: true
        os.name:
          enabled: true
        os.version:
          enabled: true
    docker:
      resource_attributes:
        container.name:
          enabled: true
        container.image.name:
          enabled: true

  # Cumulative-to-delta processor for Dynatrace.
  # Dynatrace requires delta temporality for counters; the local stack
  # (VictoriaMetrics/Prometheus) expects cumulative. This processor is only
  # used in Dynatrace-specific pipelines, keeping local pipelines isolated.
  cumulativetodelta:
    max_staleness: 25h

exporters:
  # OTLP exporter to send traces to Jaeger
  # Jaeger has OTLP support enabled and accepts OTLP on port 4317
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Prometheus remote write to VictoriaMetrics for high-frequency metrics storage
  prometheusremotewrite:
    endpoint: "http://victoria-metrics:8428/api/v1/write"
    tls:
      insecure: true

  # Prometheus exporter for metrics (exposed on :8889 for backward compatibility)
  prometheus:
    endpoint: "0.0.0.0:8889"

  # Loki exporter for logs (OTLP native ingestion, Loki 3.x)
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # Debug exporter for local troubleshooting
  debug:
    verbosity: basic

  # Dynatrace OTLP HTTP exporter.
  # Uses env-var expansion: set DYNATRACE_ENDPOINT and DYNATRACE_API_TOKEN.
  otlphttp/dynatrace:
    endpoint: ${env:DYNATRACE_ENDPOINT}
    headers:
      Authorization: "Api-Token ${env:DYNATRACE_API_TOKEN}"

  # Custom Dynatrace bizevents exporter.
  # Converts metric data points directly to Dynatrace business events,
  # bypassing the metrics→logs signal conversion. High-frequency acceleration
  # data (100Hz) is invisible in Dynatrace's 1-minute metric resolution —
  # bizevents bypass this limit.
  dtbizevents:
    endpoint: ${env:DYNATRACE_BIZEVENTS_ENDPOINT}
    api_token: ${env:DYNATRACE_BIZEVENTS_TOKEN}
    batch_interval_ms: 1000

service:
  pipelines:
    # ── Local pipelines ───────────────────────────────────────────────

    # Traces pipeline
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlp/jaeger, debug]

    # Metrics pipeline - uses fast batch processor for sub-second updates
    # Fan-out to VictoriaMetrics (storage) and Prometheus (backward compat)
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch/fast, resource]
      exporters: [prometheusremotewrite, prometheus]

    # Host metrics — all intervals merged for local storage
    metrics/host:
      receivers: [hostmetrics/1m, hostmetrics/5m, hostmetrics/1h]
      processors: [memory_limiter, resource/host, batch/fast]
      exporters: [prometheusremotewrite]

    # Container metrics — per-container resource usage from Docker API
    metrics/containers:
      receivers: [docker_stats]
      processors: [memory_limiter, resource/containers, batch/fast]
      exporters: [prometheusremotewrite]

    # Observability metrics — victoria-metrics, prometheus, otel-collector
    metrics/observability:
      receivers: [prometheus/observability]
      processors: [memory_limiter, batch/fast]
      exporters: [prometheusremotewrite]

    # Infrastructure metrics — flagd + envoy (scraped, not OTLP-pushed)
    metrics/flagd:
      receivers: [prometheus/flagd]
      processors: [memory_limiter, batch/fast]
      exporters: [prometheusremotewrite]

    metrics/envoy:
      receivers: [prometheus/envoy]
      processors: [memory_limiter, batch/fast]
      exporters: [prometheusremotewrite]

    # Logs pipeline
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlphttp/loki, debug]

    # Container logs pipeline — Docker JSON logs from non-OTLP services
    logs/containers:
      receivers: [filelog/docker]
      processors: [memory_limiter, transform/docker_logs, filter/exclude_otlp_services, batch, resource]
      exporters: [otlphttp/loki, debug]

    # ── Dynatrace pipelines ──────────────────────────────────────────

    # Service pipelines use resourcedetection/services (no docker detector)
    traces/dynatrace:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/services, batch, resource]
      exporters: [otlphttp/dynatrace]

    metrics/dynatrace:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/services, batch, resource, cumulativetodelta]
      exporters: [otlphttp/dynatrace]

    logs/dynatrace:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/services, batch, resource]
      exporters: [otlphttp/dynatrace]

    # Infrastructure pipelines use resourcedetection/infra (with docker detector)
    metrics/host-dynatrace:
      receivers: [hostmetrics/1m, hostmetrics/5m, hostmetrics/1h]
      processors: [filter/hostmetrics, resourcedetection/infra, transform/hostmetrics, cumulativetodelta, batch/dynatrace]
      exporters: [otlphttp/dynatrace]

    metrics/containers-dynatrace:
      receivers: [docker_stats]
      processors: [memory_limiter, resourcedetection/infra, resource/containers, batch, cumulativetodelta]
      exporters: [otlphttp/dynatrace]

    metrics/observability-dynatrace:
      receivers: [prometheus/observability]
      processors: [memory_limiter, resourcedetection/infra, resource/otel-collector, batch, cumulativetodelta]
      exporters: [otlphttp/dynatrace]

    metrics/flagd-dynatrace:
      receivers: [prometheus/flagd]
      processors: [memory_limiter, resourcedetection/infra, resource/flagd, batch, cumulativetodelta]
      exporters: [otlphttp/dynatrace]

    metrics/envoy-dynatrace:
      receivers: [prometheus/envoy]
      processors: [memory_limiter, resourcedetection/infra, resource/envoy, batch, cumulativetodelta]
      exporters: [otlphttp/dynatrace]

    # Container logs to Dynatrace — container.* attributes create proper entities
    logs/containers-dynatrace:
      receivers: [filelog/docker]
      processors: [memory_limiter, transform/docker_logs, filter/exclude_otlp_services, resourcedetection/infra, batch, resource]
      exporters: [otlphttp/dynatrace]

    # ── Bizevents pipeline (acceleration → Dynatrace business events) ─
    # High-frequency accel metrics (100Hz) are invisible in Dynatrace's
    # 1-minute metric resolution. The dtbizevents exporter converts them
    # directly to flat JSON and POSTs to /api/v2/bizevents/ingest.

    metrics/accel-bizevents:
      receivers: [otlp]
      processors: [memory_limiter, filter/accel, batch/fast, resource]
      exporters: [dtbizevents]

  extensions: [health_check]

extensions:
  health_check:
    endpoint: :13133
