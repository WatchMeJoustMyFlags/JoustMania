receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Scrape receivers for targets that don't push via OTLP.
  # Split by namespace so each pipeline gets the correct service.namespace tag.
  # Metrics flow to VictoriaMetrics via prometheus_remote_write.

  # Observability stack: monitoring tools that observe the system
  prometheus/observability:
    config:
      scrape_configs:
        - job_name: 'victoria-metrics'
          scrape_interval: 30s
          static_configs:
            - targets: ['victoria-metrics:8428']
        # Self-telemetry: the collector exposes its own metrics on :8888.
        # Rename otelcol_process_* to standard process_* for unified dashboards.
        # v0.153.0 exposed them unsuffixed (otelcol_process_cpu_seconds,
        # otelcol_process_memory_rss); the optional suffix keeps the rename
        # working if a later version adds _total / _bytes (regexes are anchored).
        - job_name: 'otel-collector'
          scrape_interval: 30s
          static_configs:
            - targets: ['localhost:8888']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'otelcol_process_cpu_seconds(_total)?'
              target_label: __name__
              replacement: 'process_cpu_seconds_total'
            - source_labels: [__name__]
              regex: 'otelcol_process_memory_rss(_bytes)?'
              target_label: __name__
              replacement: 'process_resident_memory_bytes'
            # The endpoint's target_info carries service_name=otelcol-joustmania
            # and a per-start instance UUID; the receiver would promote them to
            # the resource, so every series landed under job
            # observability/otelcol-joustmania with a new instance each restart.
            # Dropping it keeps service.name = this job: observability/otel-collector.
            - source_labels: [__name__]
              regex: 'target_info'
              action: drop

  # Infrastructure: supporting services for the game platform
  prometheus/infrastructure:
    config:
      scrape_configs:
        - job_name: 'flagd'
          scrape_interval: 30s
          static_configs:
            - targets: ['flagd:8014']
        - job_name: 'envoy'
          scrape_interval: 30s
          metrics_path: '/stats/prometheus'
          static_configs:
            - targets: ['envoy:9901']

  # Host: OS-level metrics from the Raspberry Pi (replaces node-exporter)
  # Requires hostfs volume mounts: /proc, /sys, / → /hostfs/
  hostmetrics/1m:
    root_path: /hostfs/root
    collection_interval: 1m
    scrapers:
      cpu:
      memory:
      load:

  hostmetrics/5m:
    root_path: /hostfs/root
    collection_interval: 5m
    scrapers:
      disk:
      filesystem:
        exclude_mount_points:
          match_type: regexp
          mount_points: ['^/(sys|proc|dev|host|etc)($$|/)']
      network:
        exclude:
          match_type: regexp
          interfaces: ['^(lo|veth.*|docker.*|br-.*)$$']
      paging:

  hostmetrics/1h:
    root_path: /hostfs/root
    collection_interval: 1h
    scrapers:
      cpu:
        metrics:
          system.cpu.logical.count:
            enabled: true
          system.cpu.physical.count:
            enabled: true
          system.cpu.time:
            enabled: false

  # Container metrics — per-container CPU, memory, network, block I/O
  # Requires Docker socket mount: /var/run/docker.sock
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s
    provide_per_core_cpu_metrics: false
    metrics:
      container.cpu.usage.total:
        enabled: true
      container.memory.usage.total:
        enabled: true
      container.memory.usage.limit:
        enabled: true
      container.network.io.usage.rx_bytes:
        enabled: true
      container.network.io.usage.tx_bytes:
        enabled: true
      container.blockio.io_service_bytes_recursive:
        enabled: true
      container.cpu.percent:
        enabled: true
      container.memory.percent:
        enabled: true

processors:
  # Batch processor for better performance (traces/logs)
  # #1155: shorter timeout + smaller batch flush sooner, lowering peak heap held
  # by the trace/log pipelines under sustained agent experiment-loop span volume
  # (4 paired shadow games/tick × decision/action/effect/experiment spans).
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

  # Fast batch processor for sub-second metrics (Issue #105)
  batch/fast:
    timeout: 100ms
    send_batch_size: 1000

  # Traces batch processor (#828): a shorter timeout than the shared `batch`
  # so the SECOND hop of the agent observe path (collector → otlp/agent) flushes
  # sooner. Combined with the lower controller-manager BSP flush (per-service
  # observability flag), this cuts the controller.bluetooth_health observe
  # latency the rollout loop reacts to. Smaller, sooner trace batches also lower
  # the collector's peak heap held by the traces pipeline (synergy with the
  # #1167/#1173 memory work — the memory_limiter envelope is untouched). The
  # logs pipeline keeps the shared `batch` (5s) unchanged.
  batch/traces:
    timeout: 2s
    send_batch_size: 512
    send_batch_max_size: 1024

  # Memory limiter to prevent OOM (#1155).
  #
  # ROOT CAUSE of the exit-137 OOM-kills: limit_mib (512) was set ABOVE the
  # container's `deploy.resources.limits.memory` ceiling (was 256 MiB) in
  # docker-compose.yml. With no spike_limit_mib, the soft limit defaulted to
  # 512 - 20% = ~410 MiB (the "~422 MiB" observed). Both the hard AND soft limit
  # sat ABOVE the kernel cgroup ceiling, so the kernel OOM-killed the container
  # long before the limiter could ever shed load — the limiter never engaged.
  #
  # FIX: the container ceiling is raised to 768 MiB in docker-compose.yml and the
  # limiter is aligned BELOW it per OTEL guidance (limit_mib ~= 80% of container,
  # spike_limit_mib ~= 25% of limit_mib). Now the limiter refuses/sheds data at
  # ~600 MiB (soft ~450 MiB) — well under the 768 MiB cgroup ceiling — so under
  # the agent experiment-loop span burst the collector backpressures instead of
  # being OOM-killed, and keeps exporting the #1140 trace-correlation spans.
  #
  # #1167: this config.yaml is mounted READ-ONLY by EVERY stack (base/Pi/prod,
  # ci, dry-run), so the limiter can't be hardcoded per-stack. The two
  # thresholds are env-substituted with LEAN DEFAULTS equal to the #1161 base
  # values, using the OTel Collector confmap env provider's default-value syntax
  # `${env:VAR:-default}` (supported since collector v0.108.0; this image is
  # built with OCB 0.164.0, well past that — see images/otel-collector/Dockerfile).
  # If the env vars are unset (base/Pi/prod + ci) the limiter stays at 600/150
  # under the lean 768 MiB ceiling.
  #
  # #1173: the experiment-heavy stacks (docker-compose.dry-run.yml, and the
  # gateway overlay retired in #1234) used to raise the ceiling to 1536 MiB with
  # 1200/300 — provisioned for the verification-#8 OOM, when the filelog/logs
  # pipeline peaked at ~1.3 GiB. #1176 (heartbeat log demotion) + #1177 (2s
  # traces batch) cut the volume so far the collector now steady-states at
  # ~85 MiB / ~6% (verification #9), making 1.5 GiB heavily over-provisioned.
  # Those stacks are now reduced to a 1024 MiB ceiling with 800/200 — still
  # well above the lean 768 MiB base for sustained-load headroom (verification
  # #9 couldn't hold a continuous 5-min window, so we keep a buffer over the
  # base rather than collapsing fully to it), and combined with the
  # max_concurrent_files cap on filelog/docker the receiver stays bounded even
  # if log volume regrows. The limiter still sheds NEAR the ceiling (~78% / ~20%)
  # before the cgroup OOM-kills. No span sampling: ALL spans are kept.
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:OTEL_MEMLIMIT_MIB:-600}
    spike_limit_mib: ${env:OTEL_MEMSPIKE_MIB:-150}

  # Resource processors set service.namespace per pipeline.
  # The prometheus_remote_write exporter prefixes job labels with the namespace
  # (e.g. "joustmania/game-coordinator", "infrastructure/flagd", "host/node").
  # All dashboard queries use these prefixed job names.
  resource/observability:
    attributes:
      - key: service.namespace
        value: observability
        action: insert

  resource/infrastructure:
    attributes:
      - key: service.namespace
        value: infrastructure
        action: insert

  resource/host:
    attributes:
      - key: service.namespace
        value: host
        action: insert
      - key: service.name
        value: node
        action: insert

  resource/containers:
    attributes:
      - key: service.namespace
        value: containers
        action: insert

  # Keep only the agent's agent.decide spans for the span_metrics connector
  # (#1427). The traces/span_metrics pipeline runs beside the main traces
  # pipeline, so dropping here never removes a span from Jaeger or the agent.
  # Restricting the connector to one span name of one service bounds the
  # series count: backend (4) x outcome (6) x status code (3).
  filter/agent_decide:
    error_mode: ignore
    trace_conditions:
      - span.name != "agent.decide" or resource.attributes["service.name"] != "agent"

  # Drop gRPC health-check spans (#2286): docker healthchecks and watchdog
  # probes call grpc.health.v1.Health/Check every few seconds, and on the Pi
  # they were 1362 of 1500 Jaeger spans. The probes only need the RPC to
  # answer; no service records its own span for it, so one drop here covers
  # the Python, Go and Rust instrumentation alike. Only the main traces
  # pipeline uses it (the span_metrics pipeline keeps agent.decide only).
  filter/grpc_health:
    error_mode: ignore
    trace_conditions:
      # Full name (Go otelgrpc, rust) or the package-stripped name that
      # lib/grpc_tracing.py records for the Python services.
      - span.attributes["rpc.service"] == "grpc.health.v1.Health" or span.attributes["rpc.service"] == "Health"

  # Resource processor to add common attributes for OTLP-pushed metrics
  resource:
    attributes:
      - key: deployment.environment
        value: development
        action: insert
      # service.namespace is set per-service in the Python SDK:
      #   "joustmania" for game services (game-coordinator, menu, audio)
      #   "infrastructure" for platform services (controller-manager, pairing-daemon)

connectors:
  # Decision backend x outcome as metrics, derived from the agent.decide spans
  # (#1427, maintainer decision 2: no agent-side counter; "traces -> metrics"
  # is a talk beat). Fed only agent.decide spans by filter/agent_decide.
  # Exported to VictoriaMetrics (prometheus_remote_write) as
  #   traces_span_metrics_calls_total
  #   traces_span_metrics_duration_seconds_bucket / _sum / _count
  # with labels decide_backend (rules, jev, claude, openai), decide_outcome
  # (act, noop, held, fallback, invalid, discarded), span_name, service_name
  # and status_code; job is infrastructure/agent (the span's resource).
  # Attribute names: services/agent/decision/decide_hook.go (AttrDecideBackend,
  # AttrDecideOutcome).
  span_metrics:
    namespace: traces.span.metrics
    dimensions:
      - name: decide.backend
      - name: decide.outcome
    # collector.instance.id changes on every collector start (a new series per
    # restart); span.kind is always INTERNAL for agent.decide.
    exclude_dimensions: [collector.instance.id, span.kind]
    histogram:
      unit: s
      # The rules path ranks in milliseconds; a remote backend call takes up to
      # tens of seconds (decide latency budget, gen_ai buckets). Explicit
      # buckets so p95 is not an interpolation inside one wide default bucket.
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 4s, 8s, 16s, 32s]
    metrics_flush_interval: 15s
    # Stop exporting a series 10 min after its last span. The agent's
    # service.instance.id (instance label) changes on every container
    # recreate; without expiry the dead instance's series would be
    # re-exported forever.
    metrics_expiration: 10m

exporters:
  # OTLP exporter to send traces to Jaeger
  # Jaeger has OTLP support enabled and accepts OTLP on port 4317
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Prometheus remote write to VictoriaMetrics for high-frequency metrics storage
  prometheus_remote_write:
    endpoint: "http://victoria-metrics:8428/api/v1/write"
    tls:
      insecure: true

  # OTLP exporter for best-effort fan-out to the agent service.
  # Resilience: a down/slow agent must NEVER stall delivery to Jaeger or
  # VictoriaMetrics, so retries are disabled, the timeout is short, and the
  # sending queue is bounded — overflow is dropped rather than back-pressured.
  otlp/agent:
    endpoint: agent:4317
    tls:
      insecure: true
    timeout: 2s
    retry_on_failure:
      enabled: false
    sending_queue:
      enabled: true
      queue_size: 1000

  # Debug exporter for local troubleshooting
  debug:
    verbosity: basic

service:
  pipelines:
    # Traces pipeline
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/grpc_health, batch/traces, resource]
      exporters: [otlp/jaeger, otlp/agent, debug]

    # agent.decide spans -> span_metrics connector (#1427). Same receiver as
    # the traces pipeline (fan-out), so the filter never affects Jaeger.
    traces/span_metrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/agent_decide]
      exporters: [span_metrics]

    # Span metrics -> VictoriaMetrics only (the agent does not ingest them).
    metrics/span_metrics:
      receivers: [span_metrics]
      processors: [memory_limiter, batch/fast, resource]
      exporters: [prometheus_remote_write]

    # Metrics pipeline - uses fast batch processor for sub-second updates
    # Fan-out to VictoriaMetrics (storage) and the agent
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch/fast, resource]
      exporters: [prometheus_remote_write, otlp/agent]

    # Observability metrics — victoria-metrics, otel-collector
    metrics/observability:
      receivers: [prometheus/observability]
      processors: [memory_limiter, resource/observability, batch/fast]
      exporters: [prometheus_remote_write]

    # Infrastructure metrics — flagd (scraped, not OTLP-pushed)
    metrics/infrastructure:
      receivers: [prometheus/infrastructure]
      processors: [memory_limiter, resource/infrastructure, batch/fast]
      exporters: [prometheus_remote_write]

    # Host metrics — OTEL hostmetrics receiver (replaces node-exporter)
    metrics/host:
      receivers: [hostmetrics/1m, hostmetrics/5m, hostmetrics/1h]
      processors: [memory_limiter, resource/host, batch/fast]
      exporters: [prometheus_remote_write]

    # Container metrics — per-container resource usage from Docker API
    metrics/containers:
      receivers: [docker_stats]
      processors: [memory_limiter, resource/containers, batch/fast]
      exporters: [prometheus_remote_write]

    # Logs pipeline: no log backend since Loki was removed (#2059, FR-082
    # Obsolete). The pipeline stays so the Python OTLPLogExporter gets an
    # answer instead of UNIMPLEMENTED retries; the debug exporter is the sink.
    # Container logs: `docker compose logs`.
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [debug]

  extensions: [health_check]

extensions:
  health_check:
    endpoint: :13133
