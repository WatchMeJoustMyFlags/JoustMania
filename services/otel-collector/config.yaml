receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Scrape receivers for targets that don't push via OTLP.
  # Split by namespace so each pipeline gets the correct service.namespace tag.
  # Metrics flow to VictoriaMetrics via prometheusremotewrite.

  # Observability stack: monitoring tools that observe the system
  prometheus/observability:
    config:
      scrape_configs:
        - job_name: 'victoria-metrics'
          scrape_interval: 30s
          static_configs:
            - targets: ['victoria-metrics:8428']
        - job_name: 'prometheus'
          scrape_interval: 30s
          static_configs:
            - targets: ['prometheus:9090']
        # Self-telemetry: the collector exposes its own metrics on :8888.
        # Rename otelcol_process_* to standard process_* for unified dashboards.
        - job_name: 'otel-collector'
          scrape_interval: 30s
          static_configs:
            - targets: ['localhost:8888']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'otelcol_process_cpu_seconds'
              target_label: __name__
              replacement: 'process_cpu_seconds_total'
            - source_labels: [__name__]
              regex: 'otelcol_process_memory_rss'
              target_label: __name__
              replacement: 'process_resident_memory_bytes'

  # Infrastructure: supporting services for the game platform
  prometheus/infrastructure:
    config:
      scrape_configs:
        - job_name: 'flagd'
          scrape_interval: 30s
          static_configs:
            - targets: ['flagd:8014']
        - job_name: 'envoy'
          scrape_interval: 30s
          metrics_path: '/stats/prometheus'
          static_configs:
            - targets: ['envoy:9901']

  # Filelog receiver — tail Docker container JSON logs for non-OTLP services
  # (connect-proxy, rust-hid, envoy, flagd, redis, etc.)
  filelog/docker:
    include:
      - /var/lib/docker/containers/*/*-json.log
    start_at: end
    include_file_path: true
    include_file_name: false
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.time
          layout: '%Y-%m-%dT%H:%M:%S.%LZ'
      - type: move
        from: attributes.log
        to: body
      - type: move
        from: attributes.stream
        to: attributes["log.iostream"]
      - type: remove
        field: attributes.time

  # Host: OS-level metrics from the Raspberry Pi (replaces node-exporter)
  # Split into three collection intervals matching the Dynatrace config
  # so both configs use the same receiver names.
  # Requires hostfs volume mounts: /proc, /sys, / → /hostfs/
  hostmetrics/1m:
    root_path: /hostfs/root
    collection_interval: 1m
    scrapers:
      cpu:
      memory:
      load:

  hostmetrics/5m:
    root_path: /hostfs/root
    collection_interval: 5m
    scrapers:
      disk:
      filesystem:
        exclude_mount_points:
          match_type: regexp
          mount_points: ['^/(sys|proc|dev|host|etc)($$|/)']
      network:
        exclude:
          match_type: regexp
          interfaces: ['^(lo|veth.*|docker.*|br-.*)$$']
      paging:

  hostmetrics/1h:
    root_path: /hostfs/root
    collection_interval: 1h
    scrapers:
      cpu:
        metrics:
          system.cpu.logical.count:
            enabled: true
          system.cpu.physical.count:
            enabled: true
          system.cpu.time:
            enabled: false

  # Container metrics — per-container CPU, memory, network, block I/O
  # Requires Docker socket mount: /var/run/docker.sock
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s
    provide_per_core_cpu_metrics: false
    metrics:
      container.cpu.usage.total:
        enabled: true
      container.memory.usage.total:
        enabled: true
      container.memory.usage.limit:
        enabled: true
      container.network.io.usage.rx_bytes:
        enabled: true
      container.network.io.usage.tx_bytes:
        enabled: true
      container.blockio.io_service_bytes_recursive:
        enabled: true
      container.cpu.percent:
        enabled: true
      container.memory.percent:
        enabled: true

processors:
  # Batch processor for better performance (traces/logs)
  batch:
    timeout: 10s
    send_batch_size: 1024

  # Fast batch processor for sub-second metrics (Issue #105)
  batch/fast:
    timeout: 100ms
    send_batch_size: 1000

  # Memory limiter to prevent OOM
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

  # Resource processors set service.namespace per pipeline.
  # The prometheusremotewrite exporter prefixes job labels with the namespace
  # (e.g. "joustmania/game-coordinator", "infrastructure/flagd", "host/node").
  # All dashboard queries use these prefixed job names.
  resource/observability:
    attributes:
      - key: service.namespace
        value: observability
        action: insert

  resource/infrastructure:
    attributes:
      - key: service.namespace
        value: infrastructure
        action: insert

  resource/host:
    attributes:
      - key: service.namespace
        value: host
        action: insert
      - key: service.name
        value: node
        action: insert

  resource/containers:
    attributes:
      - key: service.namespace
        value: containers
        action: insert

  # Transform processor — promote Docker labels to OTEL resource attributes
  transform/docker_logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # service.name from compose service label
          - set(resource.attributes["service.name"], attributes["attrs"]["com.docker.compose.service"])
            where attributes["attrs"]["com.docker.compose.service"] != nil
          # container.name (same as service name in compose)
          - set(resource.attributes["container.name"], attributes["attrs"]["com.docker.compose.service"])
            where attributes["attrs"]["com.docker.compose.service"] != nil
          # container.image.name from full image reference (strip tag after)
          - set(resource.attributes["container.image.name"], attributes["attrs"]["com.docker.compose.image"])
            where attributes["attrs"]["com.docker.compose.image"] != nil
          # container.image.tag — extract portion after last ':'
          - set(resource.attributes["container.image.tag"], attributes["attrs"]["com.docker.compose.image"])
            where attributes["attrs"]["com.docker.compose.image"] != nil
          - replace_pattern(resource.attributes["container.image.name"], ":[^:]*$", "")
            where resource.attributes["container.image.name"] != nil
          - replace_pattern(resource.attributes["container.image.tag"], "^.*:", "")
            where resource.attributes["container.image.tag"] != nil
          # container.id from file path
          - set(resource.attributes["container.id"], attributes["log.file.path"])
            where attributes["log.file.path"] != nil
          - replace_pattern(resource.attributes["container.id"], "^.*/([a-f0-9]+)/.*$", "$1")
            where resource.attributes["container.id"] != nil
          # Clean up intermediate attributes
          - delete_key(attributes, "attrs")
            where attributes["attrs"] != nil

  # Filter processor — exclude services that already push OTLP logs + the collector itself
  filter/exclude_otlp_services:
    logs:
      exclude:
        match_type: regexp
        resource_attributes:
          - key: service.name
            value: "^(controller-manager|game-coordinator|menu|audio|pairing-daemon|otel-collector|connect-proxy|rust-hid|python-hid)$"

  # Resource processor to add common attributes for OTLP-pushed metrics
  resource:
    attributes:
      - key: deployment.environment
        value: development
        action: insert
      # service.namespace is set per-service in the Python SDK:
      #   "joustmania" for game services (game-coordinator, menu, audio)
      #   "infrastructure" for platform services (controller-manager, pairing-daemon)

exporters:
  # OTLP exporter to send traces to Jaeger
  # Jaeger has OTLP support enabled and accepts OTLP on port 4317
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Prometheus remote write to VictoriaMetrics for high-frequency metrics storage
  prometheusremotewrite:
    endpoint: "http://victoria-metrics:8428/api/v1/write"
    tls:
      insecure: true

  # Prometheus exporter for metrics (exposed on :8889 for backward compatibility)
  prometheus:
    endpoint: "0.0.0.0:8889"

  # Loki exporter for logs (OTLP native ingestion, Loki 3.x)
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # OTLP exporter for best-effort fan-out to the agent service.
  # Resilience: a down/slow agent must NEVER stall delivery to Jaeger or
  # VictoriaMetrics, so retries are disabled, the timeout is short, and the
  # sending queue is bounded — overflow is dropped rather than back-pressured.
  otlp/agent:
    endpoint: agent:4317
    tls:
      insecure: true
    timeout: 2s
    retry_on_failure:
      enabled: false
    sending_queue:
      enabled: true
      queue_size: 1000

  # Debug exporter for local troubleshooting
  debug:
    verbosity: basic

service:
  pipelines:
    # Traces pipeline
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlp/jaeger, otlp/agent, debug]

    # Metrics pipeline - uses fast batch processor for sub-second updates
    # Fan-out to VictoriaMetrics (storage) and Prometheus (backward compat)
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch/fast, resource]
      exporters: [prometheusremotewrite, prometheus, otlp/agent]

    # Observability metrics — victoria-metrics, prometheus, otel-collector
    metrics/observability:
      receivers: [prometheus/observability]
      processors: [memory_limiter, resource/observability, batch/fast]
      exporters: [prometheusremotewrite]

    # Infrastructure metrics — flagd (scraped, not OTLP-pushed)
    metrics/infrastructure:
      receivers: [prometheus/infrastructure]
      processors: [memory_limiter, resource/infrastructure, batch/fast]
      exporters: [prometheusremotewrite]

    # Host metrics — OTEL hostmetrics receiver (replaces node-exporter)
    metrics/host:
      receivers: [hostmetrics/1m, hostmetrics/5m, hostmetrics/1h]
      processors: [memory_limiter, resource/host, batch/fast]
      exporters: [prometheusremotewrite]

    # Container metrics — per-container resource usage from Docker API
    metrics/containers:
      receivers: [docker_stats]
      processors: [memory_limiter, resource/containers, batch/fast]
      exporters: [prometheusremotewrite]

    # Logs pipeline
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlphttp/loki, debug]

    # Container logs pipeline — Docker JSON logs from non-OTLP services
    logs/containers:
      receivers: [filelog/docker]
      processors: [memory_limiter, transform/docker_logs, filter/exclude_otlp_services, batch, resource]
      exporters: [otlphttp/loki, debug]

  extensions: [health_check]

extensions:
  health_check:
    endpoint: :13133
