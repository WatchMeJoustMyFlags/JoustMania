[project]
name = "joustmania-mobile-gateway"
version = "1.0.0"
description = "Mobile Gateway service for JoustMania — phone-as-controller via WebSocket"
requires-python = ">=3.9,<3.13"
dependencies = [
    # Workspace packages
    "joustmania-proto",
    "joustmania-lib",

    # HTTP/WebSocket server
    "aiohttp>=3.9.0",

    # gRPC client to controller-manager
    "grpcio>=1.70.0",

    # OpenTelemetry
    "opentelemetry-distro>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28.0",

    # Metrics
    "psutil>=5.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-aiohttp>=1.0.0",
    "pytest-cov>=4.1.0",
]

[tool.uv.sources]
joustmania-proto = { workspace = true }
joustmania-lib = { workspace = true }

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
py-modules = []

# ruff - Linting configuration for this service
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "ASYNC", "B", "C4", "RET", "SIM", "ARG"]
ignore = ["ANN"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"server.py" = ["E402"]
"tests/*.py" = ["ARG002", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["lib", "proto", "services"]
