# Mutable-flag registry of the flag service (FR-132, UC-053 BR-001).
#
# Encodes docs/specs/flags.md §13. A change to one updates the other in the same
# PR; registry/sync_test.go fails when they drift. A flag without a row here is
# read-only baseline: it changes only by a reviewed edit of its flag file and a
# restart of the flag service (C-033).
#
# kind:    state | level | grant | event | overlay
# scope:   stack | game | game+serial | experiment+arm | real | fraction
# bounds:  (none)         every declared variant
#          variants: [..] only these declared variants
#          range: [lo, hi] (+ integer: true) a number within the range, inclusive
#          pattern: [[segment, ..], ..] a ':'-separated string; segments are
#                   "enum a|b", "int lo hi", "float lo hi"; one list per alternative
#          free_string: true any string up to 512 characters
#          payload: {field: rule} event payload; rules: serial, serial_or_empty,
#                   sound, "enum a|b"
#          fraction: [lo, hi] fraction_percent range of a fraction write
#          shape: true    an object with the keys and value kinds of the default variant
# persist: true = an admin setting a write MAY persist with "persist": true
# description: one line in game terms, at most 120 characters; required on every row
#          with scope experiment+arm (the experiment proposer shows it, #2345), optional
#          elsewhere; the same text as the flags.md §13.3 description table
#
# A declared variant name is always accepted (within a variants subset). Numeric
# ranges match the readers' clamps (services/game_coordinator/interventions.py,
# difficulty_handlers.py, lifecycle_handlers.py).
flags:
  # --- interventions (flags.md §13.1): every write is game-scoped ---------------
  - {set: interventions, key: music_tempo_override, kind: state, scope: [game], bounds: {range: [1.0, 1.3]}}
  - {set: interventions, key: global_sensitivity_override, kind: state, scope: [game], bounds: {range: [0, 4], integer: true}}
  - {set: interventions, key: global_difficulty_factor, kind: state, scope: [game], bounds: {range: [0.5, 2.0]}}
  - {set: interventions, key: volume_override, kind: state, scope: [game], bounds: {range: [0.3, 1.0]}}
  - {set: interventions, key: pacing_profile, kind: state, scope: [game], bounds: {variants: [default, calm, frantic]}}
  - {set: interventions, key: tempo_ramp, kind: state, scope: [game], bounds: {pattern: [["float 1.0 1.3", "float 0.1 15", "enum linear|ease"]]}}
  - {set: interventions, key: auto_rubberband, kind: state, scope: [game], bounds: {variants: ["off", gentle, strong]}}
  - {set: interventions, key: player_sensitivity_factor, kind: level, scope: [game+serial], bounds: {range: [0.5, 2.0]}}
  - {set: interventions, key: player_handicap_factor, kind: level, scope: [game+serial], bounds: {range: [0.5, 2.0]}}
  - {set: interventions, key: shield_seconds, kind: grant, scope: [game+serial], bounds: {range: [1, 10]}}
  - {set: interventions, key: toughness_boost_seconds, kind: grant, scope: [game+serial], bounds: {pattern: [["float 0.1 30"], ["float 0.1 30", "float 1.0 2.0"]]}}
  - {set: interventions, key: soft_penalty_action, kind: grant, scope: [game+serial], bounds: {pattern: [["enum warn|tighten"], ["enum tighten", "float 0.1 30", "float 0.5 1.0"]]}}
  - {set: interventions, key: eliminate_player, kind: event, scope: [game], bounds: {payload: {serial: serial}}}
  - {set: interventions, key: revive_player, kind: event, scope: [game], bounds: {payload: {serial: serial}}}
  - {set: interventions, key: controller_effect, kind: event, scope: [game], bounds: {payload: {serial: serial_or_empty, effect: "enum rumble|pulse|flash|show_battery"}}}
  - {set: interventions, key: audio_cue, kind: event, scope: [game], bounds: {payload: {sound: sound}}}
  - {set: interventions, key: end_game, kind: event, scope: [game], bounds: {payload: {}}}

  # --- agent (flags.md §13.2) ---------------------------------------------------
  - {set: agent, key: interventions_allowed, kind: overlay, scope: [stack], persist: true}
  - {set: agent, key: enabled, kind: overlay, scope: [stack], bounds: {variants: ["on", "off"]}}
  - {set: agent, key: interventions_enabled, kind: overlay, scope: [stack], bounds: {variants: ["on", "off"]}}
  - {set: agent, key: experiments_enabled, kind: overlay, scope: [stack], bounds: {variants: ["on", "off"]}}
  - {set: agent, key: experiment_dynamic_enabled, kind: overlay, scope: [stack], bounds: {variants: ["on", "off"]}}
  - {set: agent, key: rollout_enabled, kind: overlay, scope: [stack], bounds: {variants: ["on", "off"]}}
  - {set: agent, key: decision.backend, kind: overlay, scope: [stack], persist: true, bounds: {variants: [rules, claude, openai, jev]}}
  - {set: agent, key: decision.act_confidence_threshold, kind: overlay, scope: [stack]}
  - {set: agent, key: decision.jev.act_confidence_threshold, kind: overlay, scope: [stack]}
  - {set: agent, key: decision.capture_content, kind: overlay, scope: [stack], bounds: {variants: ["on", "off"]}}
  - {set: agent, key: decision.claude.model, kind: overlay, scope: [stack], persist: true}
  - {set: agent, key: decision.openai.reasoning_effort, kind: overlay, scope: [stack]}
  - {set: agent, key: decision.jev.model, kind: overlay, scope: [stack], persist: true}
  - {set: agent, key: decision.openai.model, kind: overlay, scope: [stack], persist: true, bounds: {free_string: true}}
  # Credential-bearing URL: declared variants only, so no runtime write can send
  # the API key to an arbitrary host (the API is unauthenticated, D11).
  - {set: agent, key: decision.claude.base_url, kind: overlay, scope: [stack]}
  - {set: agent, key: decision.openai.base_url, kind: overlay, scope: [stack]}
  - {set: agent, key: decision.min_interval_ms, kind: overlay, scope: [stack], bounds: {range: [100, 60000], integer: true}}
  - {set: agent, key: decision.openai.timeout_ms, kind: overlay, scope: [stack], bounds: {range: [100, 60000], integer: true}}
  - {set: agent, key: llm.max_requests_per_minute, kind: overlay, scope: [stack]}
  - {set: agent, key: llm.eligible_game_kinds, kind: overlay, scope: [stack]}
  - {set: agent, key: decision.claude.timeout_ms, kind: overlay, scope: [stack]}
  - {set: agent, key: decision.jev.timeout_ms, kind: overlay, scope: [stack]}
  - {set: agent, key: decision.jev.base_url, kind: overlay, scope: [stack]}
  - {set: agent, key: experiment.mock_archetypes, kind: overlay, scope: [stack]}
  - {set: agent, key: experiment.max_game_seconds, kind: overlay, scope: [stack], bounds: {range: [10, 1800], integer: true}}
  - {set: agent, key: policy.max_interventions_per_minute, kind: overlay, scope: [stack], bounds: {range: [1, 100], integer: true}}
  - {set: agent, key: policy.coordinator_backstop_per_minute, kind: overlay, scope: [stack], bounds: {range: [1, 100], integer: true}}
  - {set: agent, key: policy.max_shields_per_player_per_game, kind: overlay, scope: [stack], bounds: {range: [0, 20], integer: true}}
  - {set: agent, key: policy.shield_cooldown_seconds, kind: overlay, scope: [stack], bounds: {range: [0, 120], integer: true}}
  - {set: agent, key: fitness.accelerate.target_session_seconds, kind: overlay, scope: [stack]}
  - {set: agent, key: verdict_min_n, kind: overlay, scope: [stack], bounds: {range: [1, 1000], integer: true}}
  - {set: agent, key: verdict_min_pairs, kind: overlay, scope: [stack], bounds: {range: [1, 1000], integer: true}}
  - {set: agent, key: experiment_tick_seconds, kind: overlay, scope: [stack], bounds: {range: [1, 1000], integer: true}}
  - {set: agent, key: experiment_max_games, kind: overlay, scope: [stack], bounds: {range: [1, 1000], integer: true}}
  # Experiment settings migrated from env (#1810, flags.md §15): operator-written, never by
  # the agent. experiment_max_games and the proposer gate are capped by their env ceilings
  # (C-034, FR-152); the grace 0 is its `off` variant.
  - {set: agent, key: experiment_completed_grace_seconds, kind: overlay, scope: [stack], bounds: {range: [0, 600], integer: true}}
  - {set: agent, key: experiment_proposer_enabled, kind: overlay, scope: [stack], bounds: {variants: ["on", "off"]}}
  # Dynamic declarer settings migrated from env (#1907, flags.md §15): operator-written. The
  # denylist only ADDS keys to the compiled built-in list (UC-070 BR-008), so a free string
  # can only tighten the agent (C-034).
  - {set: agent, key: experiment_dynamic_candidates, kind: overlay, scope: [stack], bounds: {free_string: true}}
  - {set: agent, key: experiment_dynamic_denylist, kind: overlay, scope: [stack], bounds: {free_string: true}}
  - {set: agent, key: experiment_dynamic_objective, kind: overlay, scope: [stack], bounds: {variants: [balanced, endurance, accelerate]}}
  - {set: agent, key: experiment_dynamic_target_n, kind: overlay, scope: [stack], bounds: {range: [0, 1000], integer: true}}
  # The experiment seed (#1907): declared variants only, so every seed is a reviewed variant
  # (TestExperimentSeedVariants checks each against its game key's bounds).
  - {set: agent, key: experiment_seed, kind: overlay, scope: [stack], bounds: {variants: ["off", windows_frantic]}}
  # Agent tuning migrated from env (#1788, flags.md §15): operator-written, never by the agent.
  - {set: agent, key: inference.backend, kind: overlay, scope: [stack], persist: true, bounds: {variants: [stub, claude]}}
  - {set: agent, key: inference.model, kind: overlay, scope: [stack], bounds: {free_string: true}}
  - {set: agent, key: inference.effort, kind: overlay, scope: [stack]}
  - {set: agent, key: inference.timeout_seconds, kind: overlay, scope: [stack], bounds: {range: [30, 120], integer: true}}
  - {set: agent, key: decision.probe_decisions, kind: overlay, scope: [stack], bounds: {variants: ["on", "off"]}}
  - {set: agent, key: effect.window_seconds, kind: overlay, scope: [stack], bounds: {range: [10, 40]}}
  - {set: agent, key: promotion.rewatch_interval_seconds, kind: overlay, scope: [stack], bounds: {range: [30, 120], integer: true}}
  - {set: agent, key: promotion.rewatch_timeout_seconds, kind: overlay, scope: [stack], bounds: {range: [1800, 7200], integer: true}}
  - {set: agent, key: promotion.revert_cooldown_seconds, kind: overlay, scope: [stack], bounds: {range: [300, 1200], integer: true}}

  # --- game (flags.md §13.3) ----------------------------------------------------
  # The experiment catalog (#1415): gameplay calibration flags an experiment arm
  # may change (FR-138) and a promotion may set for real games (W5). Capacity,
  # lobby, team-structure and presentation flags are not in it.
  - {set: game, key: sensitivity, kind: overlay, scope: [stack, experiment+arm, real], persist: true, description: "movement a player survives: 0 ultra_slow (strictest) to 4 ultra_fast (most lenient)"}
  - {set: game, key: nonstop.time_limit_seconds, kind: overlay, scope: [real], bounds: {range: [0, 600], integer: true}}
  - {set: game, key: invincibility_seconds, kind: overlay, scope: [real], bounds: {range: [0, 10]}}
  - {set: game, key: fight_club.min_rounds, kind: overlay, scope: [real], bounds: {range: [1, 30], integer: true}}
  - {set: game, key: werewolf.reveal_time_seconds, kind: overlay, scope: [real], bounds: {range: [10, 90]}}
  - {set: game, key: death_grace_period_seconds, kind: overlay, scope: [experiment+arm, real], bounds: {range: [0, 5]}, description: "seconds a player cannot die after swapping team, turning zombie or respawning"}
  - {set: game, key: nonstop.respawn_seconds, kind: overlay, scope: [experiment+arm, real], bounds: {range: [0.5, 10]}, description: "seconds a dead Non-Stop Joust player waits before respawning"}
  - {set: game, key: nonstop.spawn_protection_seconds, kind: overlay, scope: [experiment+arm, real], bounds: {range: [0, 6]}, description: "seconds a respawned Non-Stop Joust player cannot die"}
  - {set: game, key: fight_club.round_seconds, kind: overlay, scope: [experiment+arm, real], bounds: {range: [5, 60]}, description: "length of one Fight Club round in seconds"}
  - {set: game, key: tournament.match_seconds, kind: overlay, scope: [experiment+arm, real], bounds: {range: [5, 60]}, description: "seconds a Tournament match lasts before a random fighter wins"}
  - {set: game, key: tournament.time_between_matches_seconds, kind: overlay, scope: [experiment+arm, real], bounds: {range: [1, 15]}, description: "pause in seconds between two Tournament matches"}
  - {set: game, key: werewolf.werewolf_fraction, kind: overlay, scope: [experiment+arm, real], bounds: {range: [0.1, 0.6]}, description: "share of Werewolf players who are werewolves (0.44 = 44 percent)"}
  - {set: game, key: zombie.initial_count, kind: overlay, scope: [experiment+arm, real], bounds: {range: [1, 5], integer: true}, description: "players who start a Zombies game as zombies"}
  - {set: game, key: zombie.respawn_min_seconds, kind: overlay, scope: [experiment+arm, real], bounds: {range: [0.5, 10]}, description: "shortest wait in seconds before a killed zombie respawns"}
  - {set: game, key: zombie.respawn_max_seconds, kind: overlay, scope: [experiment+arm, real], bounds: {range: [2, 30]}, description: "longest wait in seconds before a killed zombie respawns"}
  - {set: game, key: windows, kind: overlay, scope: [experiment+arm, real], bounds: {shape: true}, description: "min and max seconds of the fast and slow music phases, in the game and in its end phase"}
  - {set: game, key: num_teams, kind: overlay, scope: [stack], persist: true}
  - {set: game, key: force_all_start, kind: overlay, scope: [stack], persist: true, bounds: {variants: ["on", "off"]}}
  # shadow_policy: an overlay may only tighten admission to "block"; loosening to
  # "allow" stays a reviewed baseline edit (C-033). Clearing it restores the baseline.
  - {set: game, key: shadow_policy, kind: overlay, scope: [stack], bounds: {variants: [block]}}
  # Tempo intensity ramp (#1833, UC-031 BR-005): changeable on stage; the bounds
  # are the coordinator's own clamp (games/base.py RAMP_SECONDS_MIN/MAX).
  - {set: game, key: tempo.ramp_up_seconds, kind: overlay, scope: [stack], bounds: {range: [0.1, 10]}}
  - {set: game, key: tempo.ramp_down_seconds, kind: overlay, scope: [stack], bounds: {range: [0.1, 10]}}
  # Shield charge (#1837, UC-040 BR-019): charge_expiry and the #2094 cue flags are human
  # flags, changeable on stage; never experiment+arm or real, so no agent writer can reach
  # them (C-034). shield.activation and the hold keys below are agent-tunable as
  # experiment+arm and real values (FR-162, UC-043 A17); their bounds are the ceilings.
  # real_write: no_live_real_game (#2096, UC-043 A17): a write in scope real is refused
  # with 409 real_game_live while a real game is registered (flags.md §13).
  # persist: the operator pad's value (UC-015 BR-018).
  - {set: game, key: shield.activation, kind: overlay, scope: [stack, experiment+arm, real], persist: true, bounds: {variants: [instant, trigger, hold]}, real_write: no_live_real_game, description: "how a granted shield works: on at grant, on a trigger press, or while the trigger is held"}
  - {set: game, key: shield.charge_expiry_seconds, kind: overlay, scope: [stack], bounds: {range: [0, 120]}}
  # Shield charge rumble pattern (#2094, UC-040 BR-021): read by the controller manager per charge.
  - {set: game, key: shield.charge_rumble_intensity, kind: overlay, scope: [stack], bounds: {range: [0, 255]}}
  - {set: game, key: shield.charge_rumble_pulse_ms, kind: overlay, scope: [stack], bounds: {range: [50, 500]}}
  - {set: game, key: shield.charge_reminder_seconds, kind: overlay, scope: [stack], bounds: {range: [0, 30]}}
  - {set: game, key: shield.charge_pre_expiry_seconds, kind: overlay, scope: [stack], bounds: {range: [0, 8]}}
  - {set: game, key: shield.ending_rumble_seconds, kind: overlay, scope: [stack], bounds: {range: [0, 3]}}
  # Hold-mode shield energy (#2096, UC-040 BR-024, BR-027): latched per hold game.
  # Agent-tunable since FR-162 (UC-043 A17); the ranges are the ceilings (C-034).
  # persist: an operator/admin value may be persisted (#2452); the agent writes in memory only.
  - {set: game, key: shield.energy_max_seconds, kind: overlay, scope: [stack, experiment+arm, real], persist: true, bounds: {range: [1, 10]}, real_write: no_live_real_game, description: "hold mode: most shield energy in seconds a player can store"}
  - {set: game, key: shield.energy_budget_seconds, kind: overlay, scope: [stack, experiment+arm, real], persist: true, bounds: {range: [3, 30]}, real_write: no_live_real_game, description: "hold mode: total seconds of active shield a player may use in one game"}
  - {set: game, key: shield.energy_initial_seconds, kind: overlay, scope: [stack, experiment+arm, real], persist: true, bounds: {range: [0, 5]}, real_write: no_live_real_game, description: "hold mode: shield energy in seconds each player starts the game with"}
  - {set: game, key: shield.recharge_per_second, kind: overlay, scope: [stack, experiment+arm, real], persist: true, bounds: {range: [0, 0.5]}, real_write: no_live_real_game, description: "hold mode: shield energy regained per second while the shield is not held"}
  - {set: game, key: shield.min_burst_seconds, kind: overlay, scope: [stack, experiment+arm, real], persist: true, bounds: {range: [0.1, 1]}, real_write: no_live_real_game, description: "hold mode: least shield energy in seconds one activation costs"}
  # Hold feedback (#2096, UC-040 BR-026): latched per hold game and shipped to the controller.
  - {set: game, key: shield.hold_rumble_intensity, kind: overlay, scope: [stack, experiment+arm, real], persist: true, bounds: {range: [0, 150]}, real_write: no_live_real_game, description: "hold mode: rumble strength while a player holds the shield, 0 = none"}
  - {set: game, key: shield.empty_pulse_ms, kind: overlay, scope: [stack, experiment+arm, real], persist: true, bounds: {range: [100, 800]}, real_write: no_live_real_game, description: "hold mode: length in ms of the pulse when a held shield runs out"}
  # Hold feedback of #2463 (UC-040 BR-026): stack-only and human-only, outside the eight
  # agent-writable hold keys (C-034, TestC034_HoldKeysCeilings).
  - {set: game, key: shield.hold_rumble_max_intensity, kind: overlay, scope: [stack], bounds: {range: [0, 230]}}
  - {set: game, key: shield.hold_led_floor_percent, kind: overlay, scope: [stack], bounds: {range: [10, 100]}}
  # Shield end grace of #2464 (UC-040 BR-033): stack-only and human-only; it makes every
  # agent shield longer, so the agent never writes it (C-034).
  - {set: game, key: shield.end_grace_seconds, kind: overlay, scope: [stack], bounds: {range: [0, 2]}}

  # --- user, controller, rollout (flags.md §13.4) ------------------------------
  - {set: user, key: current_game, kind: overlay, scope: [stack], persist: true}
  - {set: user, key: game_instructions, kind: overlay, scope: [stack], persist: true, bounds: {variants: ["on", "off"]}}
  - {set: user, key: audio_volume.master, kind: overlay, scope: [stack], persist: true, bounds: {variants: [mute, quiet, normal, loud, max]}}
  - {set: user, key: play_audio, kind: overlay, scope: [stack], bounds: {variants: ["on", "off"]}}
  - {set: controller, key: bluetooth_backend, kind: overlay, scope: [stack, fraction], bounds: {fraction: [1, 100]}}
  # rust-hid's per-controller output rate cap (#2125, UC-002 BR-005): tunable on stage.
  - {set: controller, key: rust_hid.output_rate_hz, kind: overlay, scope: [stack], persist: true, bounds: {variants: [slow, normal, fast, max]}}
  - {set: rollout, key: current_controller_count, kind: overlay, scope: [stack], bounds: {variants: [none, one, three, six, all]}}
  - {set: rollout, key: target_backend, kind: overlay, scope: [stack]}
  - {set: rollout, key: strategy, kind: overlay, scope: [stack]}
  - {set: rollout, key: remediation_allowed, kind: overlay, scope: [stack]}

  # --- observability (flags.md §13.5) ------------------------------------------
  # The propagation probe: read by no service, written by the integration tests
  # to measure write -> flagd -> reader propagation (#1408, NFR-050 in #1413).
  - {set: observability, key: flagservice.propagation_probe, kind: overlay, scope: [stack], bounds: {free_string: true}}
  # The logging group of the env-to-flag migration (flags.md §15, #1788): operator-written, read by every service.
  - {set: observability, key: log_level, kind: overlay, scope: [stack]}
  - {set: observability, key: debug, kind: overlay, scope: [stack]}
  # The trace shape of experiment shadow games (#2223): own root + Link (link) or child of agent.experiment (child).
  - {set: observability, key: telemetry.experiment_game_parent, kind: overlay, scope: [stack]}
