[project]
name = "joustmania-pairing-daemon"
version = "1.0.0"
description = "PS Move controller pairing daemon for JoustMania"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Shared OTEL metrics + telemetry library
    "joustmania-lib",

    # OpenTelemetry tracing
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",

    # DBus for BlueZ adapter management
    "dbus-fast>=2.0.0; sys_platform == 'linux'",  # Async D-Bus

    # NOTE: psmove/psmoveapi must be built from source (not on PyPI)
    # See: https://github.com/thp/psmoveapi for build instructions
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
psmove-pairing = "server:main"

[tool.uv.sources]
joustmania-lib = { workspace = true }

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
packages = ["psmove_pairing"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

# ruff - Linting configuration
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "ASYNC", "B", "C4", "RET", "SIM", "ARG"]
ignore = ["ANN"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports OK in __init__
"server.py" = ["N802"]  # HTTP handler do_GET is from parent class
"psmove_pairing/bluez_agent.py" = ["N802"]  # D-Bus method names (RequestPinCode etc.) come from BlueZ spec
"tests/*.py" = ["ARG001", "ARG002", "E402", "SIM105", "SIM117", "F841"]  # Test fixtures, test patterns

[tool.ruff.lint.isort]
known-first-party = ["psmove_pairing", "lib"]

[tool.coverage.run]
source = ["psmove_pairing"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
