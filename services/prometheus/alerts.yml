groups:
  - name: joustmania_alerts
    interval: 30s
    rules:
      # Controller alerts
      - alert: ControllerLowBattery
        expr: controller_battery_level < 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Controller {{$labels.serial}} has low battery"
          description: "Battery level is {{$value}}/5. Replace or charge soon."

      - alert: ControllerDisconnected
        expr: controller_connected == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Controller {{$labels.serial}} disconnected"
          description: "Controller lost connection during active game."

      - alert: HighInputLatency
        expr: histogram_quantile(0.95, rate(controller_input_lag_seconds_bucket[5m])) > 0.050
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High input latency detected"
          description: "P95 input latency is {{$value}}s (>50ms threshold)."

      # System alerts
      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) * 100 > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{$labels.job}}"
          description: "CPU usage is {{$value}}% for 2 minutes (>80% threshold)."

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes > 524288000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{$labels.job}}"
          description: "Memory usage is {{$value | humanize1024}}B (>500MB threshold)."

      - alert: LowGameLoopHz
        expr: game_actual_update_frequency_hz < 55
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Game loop running below target Hz"
          description: "Game loop is running at {{$value}}Hz (target is 60Hz)."

      - alert: HighGRPCLatency
        expr: histogram_quantile(0.99, sum by(job, le) (rate(grpc_request_duration_seconds_bucket[5m]))) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High gRPC latency on {{$labels.job}}"
          description: "P99 gRPC latency is {{$value}}s (>100ms threshold)."

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{$labels.job}} is down"
          description: "Prometheus cannot scrape metrics from {{$labels.job}}."

      # Game quality alerts
      - alert: PoorFrameConsistency
        expr: game_loop_frame_consistency_percent < 95
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Poor frame consistency"
          description: "Only {{$value}}% of frames within target timing (should be >95%)."

      - alert: GameCrashRate
        expr: rate(games_force_ended_total[10m]) / rate(games_started_total[10m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High game crash rate"
          description: "{{$value | humanizePercentage}} of games are crashing."

      # Host update alerts
      - alert: ServiceUpdatePending
        expr: joustmania_service_update_pending == 1
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "Service files have been updated"
          description: "Run 'sudo ./scripts/setup/install_autostart.sh' to apply the new service configuration."

      - alert: HighGRPCClientErrorRate
        expr: rate(grpc_client_errors_total[2m]) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High gRPC client error rate on {{ $labels.service }}/{{ $labels.method }}"
          description: "Service {{ $labels.service }} method {{ $labels.method }} has error rate {{ $value }}/s for 2+ minutes"

      # Intervention machinery alerts (#803)
      - alert: InterventionHandlerErrors
        expr: sum(rate(game_interventions_total{block_reason="handler_error"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Intervention handlers are failing"
          description: "Dispatched intervention handlers raised at {{ $value }}/s for 2+ minutes (block_reason=handler_error)."

      - alert: AgentInterventionWriteFailures
        expr: sum(rate(agent_intervention_writes_total{result="error"}[5m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Agent cannot write intervention flags"
          description: "The agent ActionSink failed flag-file writes at {{ $value }}/s for 2+ minutes (flagd file unreachable?). The ACT path is degraded."

      # Interventions-file corruption / self-heal (#924). The agent detects a
      # poisoned (unparseable) interventions.json after a write or at startup and
      # repairs it (restore last-known-good / write neutral document), emitting
      # agent_intervention_file_corruption_total{phase=write|startup}. flagd
      # surfaces config parse failures via logs only (no scrapable counter on
      # :8014), so this agent-side counter is the fast, reliable signal — a
      # poisoned file is visible within seconds instead of silently defaulting
      # every intervention. ANY increase fires immediately (for: 0m) because a
      # single corruption already kills all interventions until healed.
      - alert: AgentInterventionFileCorruption
        expr: sum(increase(agent_intervention_file_corruption_total[5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Agent interventions file was corrupt and self-healed"
          description: "The agent detected a poisoned interventions.json and self-healed it ({{ $value }} event(s) in 5m). flagd would otherwise reject the whole flag set and silently default every intervention. See docs/agent-act-runbook.md → Recovery."
