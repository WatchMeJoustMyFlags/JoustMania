global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    cluster: 'joustmania'
    environment: 'production'

rule_files:
  - 'alerts.yml'

scrape_configs:
  # OTEL Collector - aggregates metrics from real-time services (Issue #106)
  # Services push metrics via OTLP; collector exposes them on :8889
  # The OTEL Prometheus exporter sets job="joustmania/<service>" on metrics.
  # honor_labels preserves these instead of overwriting with job="otel-collector".
  - job_name: 'otel-collector'
    scrape_interval: 500ms
    honor_labels: true
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          collector: 'otel'
          pipeline: 'otel-push'
    # Strip "joustmania/" prefix from job label so dashboard queries match
    # e.g. "joustmania/controller-manager" -> "controller-manager"
    metric_relabel_configs:
      - source_labels: [job]
        target_label: job
        regex: 'joustmania/(.*)'
        replacement: $1

  # Controller Manager direct pull (pipeline comparison)
  - job_name: 'controller-manager-pull'
    scrape_interval: 10s
    static_configs:
      - targets: ['controller-manager:8000']
        labels:
          service: 'controller-manager'
          pipeline: 'prometheus-pull'

  # Menu Service (still uses prometheus_client pull)
  - job_name: 'menu'
    static_configs:
      - targets: ['menu:8000']
        labels:
          service: 'menu'

  # Audio Service (still uses prometheus_client pull)
  - job_name: 'audio'
    static_configs:
      - targets: ['audio:8000']
        labels:
          service: 'audio'

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter (host metrics - CPU, memory, disk, temperature)
  - job_name: 'node'
    scrape_interval: 30s
    scrape_timeout: 25s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'raspberry-pi'

  # PS Move Pairing Daemon (runs on host, not in Docker)
  - job_name: 'psmove-pairing'
    static_configs:
      - targets: ['host.docker.internal:8002']
        labels:
          service: 'psmove-pairing'
