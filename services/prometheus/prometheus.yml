global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    cluster: 'joustmania'
    environment: 'production'

rule_files:
  - 'alerts.yml'

scrape_configs:
  # OTEL Collector - aggregates metrics from real-time services (Issue #106)
  # Services push metrics via OTLP; collector exposes them on :8889
  # The OTEL Prometheus exporter adds namespace prefixes to job labels
  # (e.g. "joustmania/game-coordinator", "infrastructure/controller-manager").
  # honor_labels preserves these instead of overwriting with job="otel-collector".
  - job_name: 'otel-collector'
    scrape_interval: 500ms
    honor_labels: true
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          collector: 'otel'
          pipeline: 'otel-push'
    # Strip namespace prefix from job label for Prometheus Direct queries
    # e.g. "joustmania/game-coordinator" -> "game-coordinator"
    metric_relabel_configs:
      - source_labels: [job]
        target_label: job
        regex: '[^/]+/(.*)'
        replacement: $1

  # Controller Manager direct pull (pipeline comparison)
  - job_name: 'controller-manager-pull'
    scrape_interval: 10s
    static_configs:
      - targets: ['controller-manager:8000']
        labels:
          service: 'controller-manager'
          pipeline: 'prometheus-pull'

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Host metrics now collected by OTEL hostmetrics receiver (node-exporter removed)

  # flagd feature flag service (management port exposes Prometheus metrics)
  - job_name: 'flagd'
    scrape_interval: 30s
    static_configs:
      - targets: ['flagd:8014']
        labels:
          service: 'flagd'
