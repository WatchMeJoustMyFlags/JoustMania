[project]
name = "joustmania"
version = "0.8.0"
description = "Microservices-based motion gaming platform for PlayStation Move controllers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
keywords = ["gaming", "motion-control", "grpc", "opentelemetry", "microservices", "ps-move"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Framework :: AsyncIO",
]
# No dependencies - this is a workspace root, each member has its own deps
dependencies = []

[project.urls]
Repository = "https://github.com/WatchMeJoustMyFlags/JoustMania"
Documentation = "https://github.com/WatchMeJoustMyFlags/JoustMania/tree/main/docs"
Issues = "https://github.com/WatchMeJoustMyFlags/JoustMania/issues"
Changelog = "https://github.com/WatchMeJoustMyFlags/JoustMania/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.14.11",
    "ty>=0.0.11",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv.workspace]
members = [
    "lib",
    "proto",
    "services/controller_manager",
    "services/game_coordinator",
    "services/menu",
    "services/audio",
    "services/pairing_daemon",
    "services/python_hid",
    "tests/integration",
]

# pytest configuration (migrated from pytest.ini)
[tool.pytest.ini_options]
testpaths = ["services", "lib", "tests/integration"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v"

# ty - Type checking configuration
[tool.ty]
# Start permissive, tighten gradually
# ty is designed for gradual adoption

[tool.ty.rules]
# Enable strict checking incrementally as needed
# Example rules (commented out for gradual adoption):
# index-out-of-bounds = "error"
# division-by-zero = "error"

# ruff - Only exclusions here; rules are in each workspace member's pyproject.toml
[tool.ruff]
exclude = [
    "tools",             # Utility scripts (not part of main codebase)
    "tests/integration", # Integration tests (separate package)
]
