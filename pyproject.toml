[project]
name = "joustmania"
version = "2.0.0"
description = "Multi-player gaming system using PS Move controllers"
requires-python = ">=3.9,<3.13"
dependencies = [
    # Main application dependencies
    "flask>=2.0.0",
    "Flask-WTF>=1.0.0",
    "pyalsaaudio>=0.9.0",
    "pydub>=0.25.0",
    "pyyaml>=6.0",
    "dbus-python>=1.2.0",
    "python-dotenv>=0.19.0",
    "pygame>=2.0.0",
    # audioop is in stdlib for Python <3.13, audioop-lts for >=3.13
    "audioop-lts>=0.2.0; python_version >= '3.13'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "grpcio>=1.70.0",
    "grpcio-health-checking>=1.70.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "prometheus-client>=0.17.0",
]

[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.14.11",
    "ty>=0.0.11",
]

[tool.uv.workspace]
members = [
    "lib",
    "proto",
    "services/controller_manager",
    "services/game_coordinator",
    "services/settings",
    "services/menu",
    "services/audio",
    "tests/integration",
]

# ty - Type checking configuration
[tool.ty]
# Start permissive, tighten gradually
# ty is designed for gradual adoption

[tool.ty.rules]
# Enable strict checking incrementally as needed
# Example rules (commented out for gradual adoption):
# index-out-of-bounds = "error"
# division-by-zero = "error"

# ruff - Only exclusions here; rules are in each workspace member's pyproject.toml
[tool.ruff]
exclude = [
    "tools",             # Utility scripts (not part of main codebase)
    "tests/integration", # Integration tests (separate package)
]
