[project]
name = "joustmania"
version = "2.0.0"
description = "Multi-player gaming system using PS Move controllers"
requires-python = ">=3.9,<3.13"
dependencies = [
    # Main application dependencies
    "flask>=2.0.0",
    "Flask-WTF>=1.0.0",
    "pyalsaaudio>=0.9.0",
    "pydub>=0.25.0",
    "pyyaml>=6.0",
    "dbus-python>=1.2.0",
    "python-dotenv>=0.19.0",
    "pygame>=2.0.0",
    # audioop is in stdlib for Python <3.13, audioop-lts for >=3.13
    "audioop-lts>=0.2.0; python_version >= '3.13'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "grpcio>=1.70.0",
    "grpcio-health-checking>=1.70.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "prometheus-client>=0.17.0",
]

[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.14.11",
    "ty>=0.0.11",
]

[tool.uv.workspace]
members = [
    "lib",
    "proto",
    "services/controller_manager",
    "services/game_coordinator",
    "services/settings",
    "services/menu",
    "services/audio",
    "tests/integration",
]

# ty - Type checking configuration
[tool.ty]
# Start permissive, tighten gradually
# ty is designed for gradual adoption

[tool.ty.rules]
# Enable strict checking incrementally as needed
# Example rules (commented out for gradual adoption):
# index-out-of-bounds = "error"
# division-by-zero = "error"

# ruff - Linting and formatting configuration
[tool.ruff]
line-length = 120
target-version = "py311"

# Exclude generated files from linting
exclude = [
    "proto/*_pb2.py",
    "proto/*_pb2_grpc.py",
    "tools",  # Utility scripts (minor violations acceptable)
    "tests/integration",  # Integration tests (import order issues due to sys.path manipulation)
]

# Enable specific rule sets
[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations (type hints)
    "ASYNC",  # flake8-async
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
]

ignore = [
    # Type annotations - will add gradually via ty (already configured)
    "ANN",
]

# Per-file ignore rules
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports OK in __init__

# gRPC servicers use PascalCase method names (protocol requirement)
"services/*/servicer.py" = ["N802"]
"services/controller_manager/mock_control_service.py" = ["N802"]

# Test conftest files: gRPC mock classes use PascalCase, sys.path manipulation, unused mock args
"services/*/tests/conftest.py" = ["N802", "E402", "ARG002"]
"lib/tests/*.py" = ["ARG002"]  # Test fixtures with mock decorators have injected args

# Server files need sys.path manipulation before imports
"services/*/server.py" = ["E402"]

# Test files: sys.path manipulation, unused fixture args from mocks
"services/*/tests/test_*.py" = ["E402", "ARG002"]

# music_player.py uses wave.open with generators, can't easily use context manager
"services/audio/music_player.py" = ["SIM115"]

# piaudio.py is legacy code with many style issues
"services/audio/piaudio.py" = ["W605", "ARG002", "N802", "N806", "E722", "SIM115"]

# backend.py has intentional no-op methods that subclasses can optionally override
"services/controller_manager/backend.py" = ["B027"]

[tool.ruff.lint.isort]
# Define first-party packages for proper import sorting
known-first-party = ["core", "lib", "proto", "services", "common", "games", "piaudio"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
