# Development Override - Hot-reload source mounting
#
# Volume-mounts Python service source directories so code changes are
# reflected immediately without rebuilding images.
#
# Usage:
#   make dev                          # Recommended shortcut
#   docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.dev.yml up -d
#
# Note: Only Python application services are mounted. Infrastructure
# services (prometheus, grafana, etc.) and non-Python services
# (connect-proxy, dashboard) are unchanged.
#
# After changing code, restart the affected service to pick up changes:
#   docker compose restart game-coordinator

services:
  controller-manager:
    volumes:
      - ./services/controller_manager:/app/services/controller_manager
      - ./lib:/app/lib
      - ./proto:/app/proto

  game-coordinator:
    volumes:
      - ./services/game_coordinator:/app/services/game_coordinator
      - ./lib:/app/lib
      - ./proto:/app/proto

  menu:
    volumes:
      - ./services/menu:/app/services/menu
      - ./lib:/app/lib
      - ./proto:/app/proto
      # NOTE: the menu's flagd dir comes from the base compose mount
      # (./services/flagd:/etc/flagd), or the CI flag dir under
      # docker-compose.ci.yml (#959). No per-file game.json/user.json mounts here:
      # they were redundant with the base dir mount and would shadow the CI flag
      # dir when this overlay is combined with docker-compose.ci.yml (test-dev),
      # re-introducing the #957 served-vs-written file mismatch for the menu.

  audio:
    volumes:
      - ./services/audio:/app/services/audio
      - ./lib:/app/lib
      - ./proto:/app/proto

  pairing-daemon:
    volumes:
      - ./services/pairing_daemon:/app/services/pairing_daemon
      - ./lib:/app/lib

  # Rust HID: source mount for reference (requires rebuild unlike Python hot-reload)
  rust-hid:
    volumes:
      - ./services/rust-hid/src:/app/services/rust-hid/src:ro
