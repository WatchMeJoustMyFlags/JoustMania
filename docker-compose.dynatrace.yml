# Dynatrace Override - Parallel telemetry export to Dynatrace
#
# Swaps the OTEL Collector config for one that adds Dynatrace-specific pipelines
# while keeping all local pipelines (Jaeger, VictoriaMetrics, Grafana) intact.
#
# Usage (applied to the observability stack):
#   docker compose -f docker-compose.observability.yml -f docker-compose.dynatrace.yml up -d
#
# Or with the game stack too:
#   docker compose -f docker-compose.observability.yml -f docker-compose.dynatrace.yml up -d
#   docker compose up -d
#
# Required environment variables (set in .env or shell):
#   DYNATRACE_ENDPOINT    - e.g. https://{env-id}.live.dynatrace.com/api/v2/otlp
#   DYNATRACE_API_TOKEN   - API token with metrics.ingest, traces.ingest, logs.ingest scopes

services:
  otel-collector:
    volumes:
      - ./services/otel-collector/config.dynatrace.yaml:/etc/otel-collector-config.yaml:ro
    environment:
      - DYNATRACE_ENDPOINT=${DYNATRACE_ENDPOINT}
      - DYNATRACE_API_TOKEN=${DYNATRACE_API_TOKEN}
    deploy:
      resources:
        limits:
          memory: 384m  # bumped from 256m for extra Dynatrace pipelines
