# M8 Agent Dry-Run Override (#999)
#
# Layered ON TOP of docker-compose.ci.yml so the stack runs with mock
# controllers (backend=mock from services/flagd/ci/) and the full local
# observability stack. Use via `make dry-run` (which also pins IMAGE_TAG=latest
# and activates the `agent` + `dashboard` profiles):
#
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.override.yml \
#     -f docker-compose.ci.yml \
#     -f docker-compose.dry-run.yml \
#     --profile agent --profile dashboard up -d
#
# Why this file exists (the dry-run findings, #999):
#
# 1. (Resolved by the flag service, epic #1407.) The agent used to write a flag
#    dir flagd did not serve; it now writes through the flag service, which
#    loads the CI baseline, so there is nothing to align.
#
# 2. Experiment framework. The loop is gated only by the experiments_enabled and
#    `enabled` flags (the enable step `scripts/agent-dryrun-enable.sh on` flips
#    both; #1907 removed the env gates). The same step seeds ONE experiment (the
#    experiment_seed flag, variant windows_frantic; #1907 removed the
#    AGENT_EXPERIMENT_SEED_* env vars) so the declare->spawn->conclude->verdict
#    loop has work once enabled. Another seed is another reviewed variant of
#    experiment_seed (agent.json), selected with ./scripts/flags.sh set.
#    The refill tick is the experiment_tick_seconds flag (default 30 s; the former
#    15 s env override is gone, #1907).
#
# The agent MASTER kill-switch (agent set `enabled`) still defaults to `off`
# (fail-closed, unchanged). `make dry-run` prints the one-liner to switch it on
# through the flag service (scripts/agent-killswitch.sh on).

services:
  # Flag service: the dry-run/demo stack keeps its own admin state file, apart
  # from the CI one it layers on (re-review N4: one state file per stack).
  flag-service:
    environment:
      - FLAG_SERVICE_STATE_FILE=/var/lib/flag-service/admin-dry-run.json

  agent:
    profiles:
      - agent
    # The experiment seed is the experiment_seed flag since #1907 (the
    # AGENT_EXPERIMENT_SEED_* env vars are gone): `scripts/agent-dryrun-enable.sh on`
    # sets its `windows_frantic` variant (game.windows = the frantic pacing object,
    # objective balanced, N=8/arm) before it turns the gates on.

  # #1167: experiment-heavy collector envelope. The dry-run cohort loop runs ~4
  # paired shadow games/tick (~20 in flight), each emitting decision/action/effect
  # + experiment.* spans (all #1140 Links). At the lean #1161 base envelope
  # (768 MiB container / limiter 600/150) the collector OOM-killed (exit 137)
  # within ~2 min and refused/dropped agent spans. We keep ALL spans (no sampling)
  # and instead raise the ceiling ONLY for this experiment-heavy stack so the
  # Pi/prod base stays lean (experiments default off there).
  #
  # #1173: verification #8 found the OOM was driven by the filelog/logs pipeline
  # (all container stdout), not traces; it peaked at ~1.3 GiB, so 1536 MiB /
  # 1200/300 was provisioned for that. #1176 (heartbeat log demotion) + #1177
  # (2s traces batch) cut the log volume so far the collector now steady-states
  # at ~85 MiB / ~6% of 1.5 GiB (verification #9) — heavily over-provisioned.
  # Reduced to a 1024 MiB ceiling with the limiter at 800/200 (sheds ~78% / ~20%
  # near the ceiling). Still well above the lean 768 MiB base for sustained-load
  # headroom (verification #9 couldn't hold a continuous 5-min window, so keep a
  # buffer); combined with the filelog max_concurrent_files cap (config.yaml) the
  # receiver stays bounded even if log volume regrows.
  #
  # PRIOR (#1167): raised to 1536 MiB / 1200/300 to shed near the 1.5 GiB ceiling.
  # Merges onto the base collector by service name.
  otel-collector:
    environment:
      - OTEL_MEMLIMIT_MIB=800
      - OTEL_MEMSPIKE_MIB=200
    deploy:
      resources:
        limits:
          memory: 1024m
