# M8 Agent Dry-Run Override (#999)
#
# Layered ON TOP of docker-compose.ci.yml so the stack runs with mock
# controllers (backend=mock from services/flagd/ci/) and the full local
# observability stack. Use via `make dry-run` (which also pins IMAGE_TAG=latest
# and activates the `agent` + `dashboard` profiles):
#
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.override.yml \
#     -f docker-compose.ci.yml \
#     -f docker-compose.dry-run.yml \
#     --profile agent --profile dashboard up -d
#
# Why this file exists (the dry-run findings, #999):
#
# 1. Agent <-> flagd flag-dir mismatch. In ci-mode, docker-compose.ci.yml
#    overrides flagd (and menu) to mount ./services/flagd/ci:/etc/flagd, but the
#    base agent service keeps ./services/flagd:/etc/flagd. So the agent's
#    experiment-scoped game.json writes (FLAGD_FLAG_DIR=/etc/flagd ->
#    /etc/flagd/game.json) landed in the BASE file while flagd served the CI one
#    — the writes never reached the running flagd. Here we !override the agent
#    volume onto the SAME services/flagd/ci dir flagd and menu serve, so the file
#    the agent writes IS the file flagd reads (the #959 single-source-of-truth
#    invariant, extended to the agent under the ci flag dir).
#
# 2. Experiment framework opt-in. The base agent env now passes through the
#    AGENT_EXPERIMENT* vars (default-off); this file turns ON the cohort loop and
#    seeds ONE experiment so the declare->spawn->conclude->verdict loop has work.
#    Override values still win, e.g.:
#      AGENT_EXPERIMENT_SEED_FLAG=move_threshold make dry-run
#
# The agent MASTER kill-switch (agent.json `enabled`) still defaults to `off`
# (fail-closed, unchanged). `make dry-run` prints the one-liner to flip the CI
# copy on; we do NOT mutate the committed flag here so the default stays safe.

services:
  agent:
    profiles:
      - agent
    # Resolve the dir mismatch: serve/write the SAME flag dir flagd + menu use
    # under ci-mode. !override REPLACES the base ./services/flagd:/etc/flagd
    # mount (compose merges array values by default).
    volumes: !override
      - ./services/flagd/ci:/etc/flagd
      # !override REPLACES the base agent volumes list, which would otherwise drop
      # the durable experiment journal volume (#1023). Re-declare it here so the
      # dry-run/demo stack also keeps cohort journal state across recreation. The
      # top-level `agent-experiments:` volume is defined in docker-compose.yml and
      # carries through the compose merge — no redeclaration needed here.
      - agent-experiments:/var/lib/joustmania/agent/experiments
    environment:
      # Master opt-in for the #982/#991 experiment cohort loop.
      - AGENT_EXPERIMENTS_ENABLED=${AGENT_EXPERIMENTS_ENABLED:-true}
      # Seed ONE experiment at startup (simplest declaration trigger). The flag
      # key must EXIST in services/flagd/ci/game.json and the value's JSON kind
      # must match its existing variants (the Gate's type guard rejects a mistyped
      # seed).
      #
      # #1090: seed on a REAL FFA lever. ``game.windows`` is the music-tempo pacing
      # table that drives how fast the music cycles fast<->slow; the game-coordinator
      # reads it per game (base.py _get_music_change_time) and the resulting
      # music_speed LERPs the per-frame death threshold in _compute_effective_thresholds
      # (base.py:1319) consumed by the FFA death check (base.py:1556). The seed value
      # is the pre-vetted, in-bounds ``frantic`` variant object (faster tempo cycling
      # => shorter, more intense FFA games) — a genuinely measurable game-length /
      # difficulty effect, unlike the former death_grace_period_seconds seed which FFA
      # ignores entirely (it is a respawn-mode-only knob; see #1090). The seed VALUE is
      # parsed as JSON when it begins with '{' (parseSeedValue, #1090).
      - AGENT_EXPERIMENT_SEED_FLAG=${AGENT_EXPERIMENT_SEED_FLAG:-windows}
      - "AGENT_EXPERIMENT_SEED_VALUE=${AGENT_EXPERIMENT_SEED_VALUE:-{\"min_music_fast_time\":6,\"max_music_fast_time\":11,\"min_music_slow_time\":6,\"max_music_slow_time\":14,\"end_min_music_fast_time\":8,\"end_max_music_fast_time\":14,\"end_min_music_slow_time\":5,\"end_max_music_slow_time\":8}}"
      - AGENT_EXPERIMENT_SEED_OBJECTIVE=${AGENT_EXPERIMENT_SEED_OBJECTIVE:-balanced}
      - AGENT_EXPERIMENT_SEED_TARGET_N=${AGENT_EXPERIMENT_SEED_TARGET_N:-8}
      - "AGENT_EXPERIMENT_SEED_HYPOTHESIS=${AGENT_EXPERIMENT_SEED_HYPOTHESIS:-M8 dry-run seed - frantic music pacing windows shorten and intensify FFA games}"
      # Faster refill tick than the 30s default so shadow games spin up promptly
      # during a demo.
      - AGENT_EXPERIMENT_TICK_SECONDS=${AGENT_EXPERIMENT_TICK_SECONDS:-15}
      # Heuristic dynamic declarer (#995/#1041): default-off; set true to have the
      # agent autonomously pick which game.json flag to experiment on (alongside the
      # seed). The other AGENT_EXPERIMENT_DYNAMIC_* knobs pass through from the base.
      - AGENT_EXPERIMENT_DYNAMIC_ENABLED=${AGENT_EXPERIMENT_DYNAMIC_ENABLED:-false}

  # #1167: experiment-heavy collector envelope. The dry-run cohort loop runs ~4
  # paired shadow games/tick (~20 in flight), each emitting decision/action/effect
  # + experiment.* spans (all #1140 Links). At the lean #1161 base envelope
  # (768 MiB container / limiter 600/150) the collector OOM-killed (exit 137)
  # within ~2 min and refused/dropped agent spans. We keep ALL spans (no sampling)
  # and instead raise the ceiling ONLY for this experiment-heavy stack so the
  # Pi/prod base stays lean (experiments default off there). Raise the container
  # to 1536 MiB AND set the env-substituted limiter (config.yaml memory_limiter)
  # to 1200/300 so the limiter sheds NEAR the 1.5 GiB ceiling (~80% / ~25%) rather
  # than backpressuring at 600 — without this matching limiter bump the bigger
  # container would be wasted. Merges onto the base collector by service name.
  otel-collector:
    environment:
      - OTEL_MEMLIMIT_MIB=1200
      - OTEL_MEMSPIKE_MIB=300
    deploy:
      resources:
        limits:
          memory: 1536m
