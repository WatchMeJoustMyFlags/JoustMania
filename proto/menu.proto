syntax = "proto3";

package joustmania.menu;

option go_package = "github.com/joustmania/connect-proxy/gen/menu";

// Menu Service - Manages menu UI and user interactions
service MenuService {
  // Start menu
  rpc StartMenu(StartMenuRequest) returns (StartMenuResponse);

  // Stop menu
  rpc StopMenu(StopMenuRequest) returns (StopMenuResponse);

  // Stream menu events (button presses, selections)
  rpc StreamMenuEvents(StreamMenuEventsRequest) returns (stream MenuEvent);

  // Process menu input
  rpc ProcessInput(ProcessInputRequest) returns (ProcessInputResponse);

  // List the playable game modes (what the dashboard mode selector offers)
  rpc ListGameModes(ListGameModesRequest) returns (ListGameModesResponse);

  // Read-only menu snapshot for the operator pad (#2050, UC-015, services.md §3.1)
  rpc GetMenuStatus(GetMenuStatusRequest) returns (GetMenuStatusResponse);
}

// Menu state
enum MenuState {
  STOPPED = 0;
  RUNNING = 1;
  GAME_STARTING = 2;
}

// Request/Response messages
message StartMenuRequest {}

message StartMenuResponse {
  bool success = 1;
  string error = 2;
}

message StopMenuRequest {}

message StopMenuResponse {
  bool success = 1;
  string error = 2;
}

message StreamMenuEventsRequest {}

message MenuEvent {
  string event_type = 1;  // "selection_changed", "game_requested", "admin_action"
  map<string, string> data = 2;  // Event-specific data
  int64 timestamp = 3;  // Unix timestamp in milliseconds
}

message ProcessInputRequest {
  string input_type = 1;  // "button_press", "web_command", etc.
  map<string, string> data = 2;
}

message ProcessInputResponse {
  bool success = 1;
  string error = 2;
}

message ListGameModesRequest {}

message ListGameModesResponse {
  repeated string game_modes = 1;  // Games enum names of the implemented modes, in menu cycle order
  string default_mode = 2;         // Mode a client preselects ("JoustFFA")
}

message GetMenuStatusRequest {}

// Read from menu memory and the in-process flag clients, never from the HTTP flag writer.
message GetMenuStatusResponse {
  MenuState menu_state = 1;
  bool lifecycle_live = 2;          // the game lifecycle task is live (starting, running, restoring the lobby)
  int64 lifecycle_generation = 3;   // goes up when the lifecycle starts and when it ends (UC-015 A5)
  string selection = 4;             // Games enum name of the selected mode
  int32 ready_count = 5;
  int32 connected_count = 6;
  string admin_serial = 7;          // controller in admin mode, empty when none
  bool agent_enabled = 8;           // agent/enabled (the kill switch)
  string agent_level = 9;           // agent/interventions_allowed variant name
  string agent_saved_level = 10;    // level a resume restores, empty when none saved
  string agent_backend = 11;        // agent/decision.backend variant name
  int32 sensitivity = 12;           // game/sensitivity (0-4)
  int32 num_teams = 13;             // game/num_teams
  bool instructions = 14;           // user/game_instructions
  bool force_all_start = 15;        // game/force_all_start
  string audio_volume_master = 16;  // user/audio_volume.master variant name
  string agent_enabled_state = 17;  // "on", "off" or "unknown" (agent/enabled unresolvable; UC-015 BR-013, #2101)
  string agent_interventions_enabled_state = 18;  // agent/interventions_enabled (write gate): "on", "off" or "unknown" (UC-015 BR-002, BR-013, #2093)
  string shield_activation = 19;   // game/shield.activation variant name, empty when unresolvable (UC-015 BR-018, #2215)
  reserved 20;  // was shield_activation_operator (#2218), folded into operator_settings
  // Per setting with an "automatic" rung (sensitivity, num_teams, shield.activation): the operator's persisted
  // value as a variant name, or "automatic" when none is set (the flag file's default applies). A missing key =
  // unknown (not read yet or unreadable). UC-015 BR-018, #2222.
  map<string, string> operator_settings = 21;
}
