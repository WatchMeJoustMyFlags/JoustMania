syntax = "proto3";

package joustmania.audio;

option go_package = "github.com/joustmania/connect-proxy/gen/audio";

// Audio Service - Manages audio playback and mixing
service AudioService {
  rpc PlaySound(PlaySoundRequest) returns (PlaySoundResponse);
  rpc StopSound(StopSoundRequest) returns (StopSoundResponse);
  rpc PlayMusic(PlayMusicRequest) returns (PlayMusicResponse);
  rpc StopMusic(StopMusicRequest) returns (StopMusicResponse);
  rpc ChangeTempo(ChangeTempoRequest) returns (ChangeTempoResponse);
  rpc SetVolume(SetVolumeRequest) returns (SetVolumeResponse);
}

enum AudioPriority {
  LOW = 0;
  MEDIUM = 1;
  HIGH = 2;
  CRITICAL = 3;
}

message PlaySoundRequest {
  string file_path = 1;
  float volume = 2;
  AudioPriority priority = 3;
}

message PlaySoundResponse {
  bool success = 1;
  string error = 2;
  // Length of the clip in seconds; 0 when nothing is heard (muted, silent, missing file).
  // Lets a caller wait for a clip to finish (UC-020 A5).
  float duration_seconds = 3;
}

// Stops every playing sound effect (not music). Used on a force-end during the
// pre-game instruction clip (UC-020 A5, #1586). Nothing playing is still success.
message StopSoundRequest {}

message StopSoundResponse {
  bool success = 1;
  string error = 2;
  // Number of effect channels that were playing and got stopped.
  int32 stopped = 3;
}

message PlayMusicRequest {
  string file_pattern = 1;
  bool loop = 2;
  float tempo = 3;
  AudioPriority priority = 4;
}

message PlayMusicResponse {
  string track_id = 1;
  bool success = 2;
  string error = 3;
}

message StopMusicRequest {
  string track_id = 1;
}

message StopMusicResponse {
  bool success = 1;
  string error = 2;
}

message ChangeTempoRequest {
  string track_id = 1;
  float new_tempo = 2;
  float transition_duration = 3;
}

message ChangeTempoResponse {
  bool success = 1;
  string error = 2;
}

message SetVolumeRequest {
  float volume = 1;
}

message SetVolumeResponse {
  bool success = 1;
  string error = 2;
}
