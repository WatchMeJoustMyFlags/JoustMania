syntax = "proto3";

package joustmania.controller_manager;

option go_package = "github.com/joustmania/connect-proxy/gen/controller_manager";

// ControllerManager Service - Manages PS Move controllers
service ControllerManagerService {
  // Stream button press/release events (Phase 41 - event-driven for menu/UI)
  // Phase XX: Made bidirectional for LED state ownership - menu can send base colors and effects
  rpc StreamButtonEvents(stream ButtonEventStreamControl) returns (stream ButtonEvent);

  // Stream gameplay data with dynamic filtering (Phase 45 - bidirectional streaming)
  // Supports mid-stream filter changes, color commands, and game effects
  rpc StreamGameplayData(stream GameplayStreamControl) returns (stream GameplayDataUpdate);

  // Rename a controller (set custom human-readable name)
  rpc RenameController(RenameControllerRequest) returns (RenameControllerResponse);

  // Query the controller manager's authoritative live roster on demand (#1153).
  // Unlike the event-piggybacked connected_serials (only refreshed on the next
  // CONNECT/DISCONNECT), this returns the current connected set synchronously so
  // a client (the menu) can reconcile ghosts after a missed disconnect.
  rpc GetConnectedControllers(GetConnectedControllersRequest) returns (GetConnectedControllersResponse);

  // Identify a controller (UC-004, FR-121): flash it white and rumble it briefly,
  // then restore its colour. Lobby only: refused for controllers that are not
  // connected, reserved, or players of an open game gameplay stream.
  rpc IdentifyController(IdentifyControllerRequest) returns (IdentifyControllerResponse);

  // Browser view of StreamGameplayData (#1595): one config in, the gameplay
  // updates out. Served by connect-proxy only, which opens a StreamGameplayData
  // stream to the controller manager with this config, relays its updates and
  // closes it when the browser goes away. A server stream works over the
  // HTTP/1.1 hop from envoy, a bidi stream does not (505). The controller
  // manager does not implement it (UNIMPLEMENTED).
  rpc WatchGameplayData(GameplayStreamConfig) returns (stream GameplayDataUpdate);

}

// Controller state data
message ControllerState {
  string serial = 1;
  int32 move_num = 2;
  int32 battery = 3;
  bool trigger_pressed = 4;
  bool move_pressed = 5;
  // Field 6 removed (was: bool ready) - ready state is tracked by Menu service
  int32 team = 7;
  RGB color = 8;
  Vector3 accel = 9;
  Vector3 gyro = 10;

  // Additional button states (Phase 23 - Admin Mode)
  bool cross_pressed = 11;      // X button
  bool circle_pressed = 12;     // O button
  bool square_pressed = 13;     // Square button
  bool triangle_pressed = 14;   // Triangle button
  bool ps_pressed = 15;         // PlayStation button

  // Connection strength (Phase 48)
  int32 rssi = 16;              // Signal strength in dBm (-100 to 0, 0 = USB/unavailable)

  // Additional button states (Phase 79 - Admin Mode Game Selection)
  bool select_pressed = 17;     // Select button
  bool start_pressed = 18;      // Start button

  // Human-readable name (Issue #7)
  string name = 19;             // Auto-generated or user-assigned name
}

message RGB {
  int32 r = 1;
  int32 g = 2;
  int32 b = 3;
}

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

// Phase 41: Button event streaming (event-driven for menu/UI)
enum ButtonType {
  BUTTON_TRIGGER = 0;
  BUTTON_MOVE = 1;
  BUTTON_CROSS = 2;
  BUTTON_CIRCLE = 3;
  BUTTON_SQUARE = 4;
  BUTTON_TRIANGLE = 5;
  BUTTON_PS = 6;
  BUTTON_SELECT = 7;
  BUTTON_START = 8;
}

enum ButtonAction {
  ACTION_PRESS = 0;    // Button transitioned from released to pressed
  ACTION_RELEASE = 1;  // Button transitioned from pressed to released
}

// Event types for the button event stream (also handles connection events)
enum ControllerEventType {
  EVENT_BUTTON = 0;      // Button press/release (default for backwards compatibility)
  EVENT_CONNECT = 1;     // Controller connected
  EVENT_DISCONNECT = 2;  // Controller disconnected
}

message ButtonEvent {
  string serial = 1;
  int64 timestamp = 2;     // Unix timestamp in milliseconds
  ButtonType button = 3;   // Which button (only set for EVENT_BUTTON)
  ButtonAction action = 4; // Press or release (only set for EVENT_BUTTON)
  int32 battery = 5;       // Battery level at time of event
  RGB color = 6;           // Current controller color
  ControllerEventType event_type = 7;  // Event type (default EVENT_BUTTON for backwards compat)
  string name = 8;         // Human-readable controller name (Issue #7)
  repeated string connected_serials = 9;  // All connected serials (set on CONNECT/DISCONNECT only)
}

// Phase XX: Bidirectional control for button event stream (menu/UI)
// Menu sends base colors and effects, receives button events
message ButtonEventStreamControl {
  oneof control {
    ButtonEventStreamConfig config = 1;      // Initial configuration (can be empty)
    ControllerColorConfig base_color = 2;    // Set base color for a controller
    GameEffectCommand game_effect = 3;       // Trigger semantic game effect
  }
}

// Initial configuration for button event stream
message ButtonEventStreamConfig {
  // Empty for now - all button events are streamed
  // Could add filter options in future (e.g., specific buttons, controllers)
}

// Per-frame controller health counters (accumulated since last stream frame).
// When all fields are zero, protobuf omits the message entirely (zero wire cost).
message ControllerHealth {
  uint32 poll_drops = 1;    // Polls returning None since last stream frame
  uint32 poll_errors = 2;   // Polls throwing exceptions since last stream frame
  uint32 led_failures = 3;  // set_output() failures since last stream frame
}

// Phase 41: Gameplay data streaming (acceleration/gyro, plus the trigger for the shield charge)
message GameplayData {
  string serial = 1;
  int32 move_num = 2;
  int32 battery = 3;
  // Field 4 removed (was: bool ready) - ready state is tracked by Menu service
  int32 team = 5;
  RGB color = 6;
  Vector3 accel = 7;  // Primary gameplay data
  Vector3 gyro = 8;   // Secondary gameplay data
  // No other button states - use StreamButtonEvents if buttons are needed
  int32 rssi = 9;     // Signal strength in dBm (-100 to 0, 0 = USB/unavailable)
  string name = 10;   // Human-readable controller name (Issue #7)
  ControllerHealth health = 11;  // Per-frame health counters (#571)
  ConnectionQuality connection_quality = 12;  // Unset until the 10 s gap window has data (UC-035 BR-005)
  // The digital trigger (as the lobby ready), for the shield charge (#1837, UC-030 A6). True when the
  // trigger is down now OR was pressed since the previous frame delivered to a game stream (a latch
  // cleared per game frame, so a press between frames at 15/30 Hz is not lost). Only game streams
  // clear the latch; the game does the edge detection.
  bool trigger_pressed = 13;
}

// Connection quality of a controller from the gaps between fresh frames over a
// rolling 10 s window (UC-035 BR-005, #1431). Refreshed about once per second.
message ConnectionQuality {
  string level = 1;               // "good" | "fair" | "poor"
  float report_gap_p95_ms = 2;    // p95 gap (nearest rank)
  float report_gap_max_ms = 3;    // longest gap, still-open gap included
}

// Notification that a controller disconnected during gameplay streaming.
message DisconnectEvent {
  string serial = 1;
}

message GameplayDataUpdate {
  repeated GameplayData controllers = 1;
  int64 timestamp = 2;  // Unix timestamp in milliseconds
  repeated DisconnectEvent disconnects = 3;  // Controllers that disconnected since last frame (#580)
}

message GameplayStreamRequest {
  int32 update_frequency_hz = 1;  // Desired update frequency (servicer falls back to 30 when 0)
}

// Phase 45: Bidirectional streaming for dynamic controller filtering
// Control messages sent by client to update stream behavior mid-stream
message GameplayStreamControl {
  oneof control {
    GameplayStreamConfig config = 1;           // Initial configuration
    FilterUpdate filter_update = 2;            // Mid-stream filter change
    ControllerColorConfig base_color = 7;      // Set base color for a controller
    GameEffectCommand game_effect = 8;         // Trigger semantic game effect
  }
}

// Initial stream configuration (sent once at start)
message GameplayStreamConfig {
  int32 update_frequency_hz = 1;            // Game loop frequency
  reserved 2;                               // Removed: serials field (use colors instead)
  reserved "serials";
  repeated ControllerColorConfig colors = 3; // Initial base colors for players (serials derived from this)
}

// Filter update (sent when alive players change)
message FilterUpdate {
  repeated string serials = 1;              // New filter list (empty = all controllers)
}

// Phase XX: LED State Ownership
// Controller manager is the single owner of all LED state
// Clients send base colors, controller manager handles effects and auto-restore

// Simple controller color assignment - controller manager only cares about serial + color
message ControllerColorConfig {
  string serial = 1;  // Controller serial
  RGB color = 2;      // Base color for this controller
}

// Semantic game effects (controller manager handles animation and restore to base color)
enum GameEffect {
  GAME_EFFECT_NONE = 0;
  GAME_EFFECT_PLAYER_WARNING = 1;   // White flash + vibrate, restore to base color
  GAME_EFFECT_PLAYER_DEATH = 2;     // Red + vibrate, stays red (dead)
  GAME_EFFECT_PLAYER_RESPAWN = 3;   // White during spawn protection
  GAME_EFFECT_WINNER_RAINBOW = 4;   // Rainbow 3s, restore to base color
  GAME_EFFECT_COUNTDOWN = 5;        // Full countdown: Red→Yellow→Green (duration_ms per phase, default 750ms), restore to base
  GAME_EFFECT_ADMIN_ENTER = 6;      // White flash 3x, then persistent white
  GAME_EFFECT_ADMIN_EXIT = 7;       // Restore to base color
  GAME_EFFECT_LOW_BATTERY = 8;      // Red flash 2x warning
  GAME_EFFECT_FORCE_START_CHARGE = 9;  // Fade white→dim over 2s (force start countdown)
  GAME_EFFECT_SHOW_BATTERY = 10;    // Show battery level on ALL controllers (green/orange/red based on level)
  GAME_EFFECT_RUMBLE = 11;          // Vibrate only (for secret signaling like traitor/werewolf)
  GAME_EFFECT_PULSE = 12;           // Pulse with color, restore to base (for confirmations/announcements)
  GAME_EFFECT_FLASH = 13;           // Brief flash with color, restore to base
  // Agent shield (#1301, UC-040 BR-008/BR-010): shield colour (default white) fades 100%->30%
  // over duration_ms minus the last 1000ms, blinks 4 Hz in the last 1000ms, then restores the
  // base color. A persistent layer: short LED effects overlay it, a new base color is shown after it;
  // death, the winner rainbow and duration_ms=0 end it (duration_ms=0 on TOUGHNESS_BOOST: the boost layer only).
  GAME_EFFECT_SHIELD = 14;
  // Toughness boost (#1301, UC-040 BR-009): the weaker variant, a slow 0.5 Hz breathing at
  // 10-50% brightness, last-second blink at 50%, then restore. duration_ms=0 ends it.
  GAME_EFFECT_TOUGHNESS_BOOST = 15;
  // Identify (UC-004 BR-001, BR-002): white 2 Hz flash for duration_ms (default 3000ms)
  // plus a 500ms rumble, then the base color (or the color shown before, without one).
  // RPC-only: started by IdentifyController; a GameEffectCommand with it is rejected.
  // It only tags the running effect so a game stream can cancel it (UC-004 BR-003).
  GAME_EFFECT_IDENTIFY = 16;
  // Shield charge (#1837, UC-040 BR-021): the held, not yet activated shield. The player's current base
  // colour breathes 60-100% at 0.5 Hz (the lowest shield layer) for duration_ms (capped at 120 s; the
  // game re-sends while the charge is held) plus one 100 ms rumble tick at 120 when the layer starts.
  // duration_ms=0 ends only the charge layer (SHIELD 0 ends all layers).
  GAME_EFFECT_SHIELD_CHARGE = 17;
  // Shield swell (#1837, UC-040 BR-021): rumble only, 0->180->0 over 600 ms when a charge is activated.
  // Shares the rumble slot, so any later rumble (warning, death) replaces it. No LED, no layer.
  GAME_EFFECT_SHIELD_SWELL = 18;
  // Shield hold (#2096, UC-040 BR-026): a running hold activation. White, dimming from 100% to
  // cues.hold_led_floor_pct as the energy drains against shield_hold.activation_ms (#2463), last 1000ms
  // blinks 4 Hz; duration_ms = ms until the energy runs out. A background rumble while it runs, restored
  // after one-shot rumbles: ramp mode (cues.hold_rumble_max_intensity > cues.hold_rumble_intensity, #2463)
  // rises from hold_rumble_intensity to hold_rumble_max_intensity, no ending and no empty pulse; flat mode
  // stays at hold_rumble_intensity with the "ending soon" double pulse cues.ending_lead_ms before its end.
  // duration_ms=0 ends only this layer.
  GAME_EFFECT_SHIELD_HOLD = 19;
  // Shield energy (#2096, UC-040 BR-026): the idle energy of a hold game, the lowest shield layer, in the
  // base colour by state (empty steady, low / charged / full breathing). Persistent: any duration_ms > 0
  // shows it, 0 ends only this layer. shield_hold carries the level, rate and the cue to play.
  GAME_EFFECT_SHIELD_ENERGY = 20;
}

// Cue to play with a hold command (#2096, UC-040 BR-026).
enum ShieldHoldCue {
  SHIELD_HOLD_CUE_NONE = 0;
  SHIELD_HOLD_CUE_FULL = 1;    // a grant filled the pool: the #2094 grant pattern
  SHIELD_HOLD_CUE_TOP_UP = 2;  // a grant added energy without filling the pool: one pulse
  SHIELD_HOLD_CUE_EMPTY = 3;   // an activation ran out of energy or budget: one empty pulse (flat mode only, #2463)
}

// Cue values a hold game latched at its start (UC-040 BR-026, BR-027). An absent field means the
// controller manager's own flag read; 0 is a value (off).
message ShieldCueParams {
  optional int32 rumble_intensity = 1;       // shield.charge_rumble_intensity (pulses)
  optional int32 pulse_ms = 2;               // shield.charge_rumble_pulse_ms
  optional int32 ending_lead_ms = 3;         // shield.ending_rumble_seconds
  optional int32 hold_rumble_intensity = 4;  // shield.hold_rumble_intensity (background while active)
  optional int32 empty_pulse_ms = 5;         // shield.empty_pulse_ms (flat mode only)
  optional int32 hold_rumble_max_intensity = 6;  // shield.hold_rumble_max_intensity (#2463; <= field 4 = flat)
  optional int32 hold_led_floor_pct = 7;     // shield.hold_led_floor_percent (#2463; 100 = no dimming)
}

// State of a player's shield energy at the send (#2096, UC-040 BR-024, BR-026).
message ShieldHoldState {
  int32 energy_ms = 1;      // energy now
  int32 cap_ms = 2;         // shield.energy_max_seconds
  int32 full_ms = 3;        // min(cap, budget remaining): recharge stops and "full" starts here
  int32 min_burst_ms = 4;   // usable energy below this cannot activate ("empty")
  int32 rate_ms_per_s = 5;  // idle recharge (0 = none)
  ShieldHoldCue cue = 6;
  ShieldCueParams cues = 7;
  // SHIELD_HOLD (#2463): usable energy at the start of the activation plus grants during it, the
  // reference of the rumble ramp and the LED dimming. 0 on SHIELD_ENERGY and from an older coordinator.
  int32 activation_ms = 8;
}

// Trigger a game effect via stream
// For effects that need customization, optional color/duration/speed can be provided
message GameEffectCommand {
  string serial = 1;      // Controller serial (empty = all controllers for broadcast)
  GameEffect effect = 2;  // Effect to trigger
  RGB color = 3;          // Optional: override effect color (for PULSE, FLASH, etc.)
  int32 duration_ms = 4;  // Optional: override effect duration (0 = use default)
  int32 speed = 5;        // Optional: override effect speed (0 = use default)
  ShieldHoldState shield_hold = 6;  // SHIELD_HOLD / SHIELD_ENERGY only (#2096)

  // Trace context for distributed tracing (W3C Trace Context format)
  string trace_parent = 10;  // W3C traceparent header value
  string trace_state = 11;   // W3C tracestate header value
}

// Rename controller request/response (Issue #7)
message RenameControllerRequest {
  string serial = 1;      // Controller serial to rename
  string name = 2;        // New human-readable name
}

message RenameControllerResponse {
  bool success = 1;
  string error = 2;       // Error message if success is false
}

// Live-roster query (#1153). Empty request: returns the whole connected roster.
message GetConnectedControllersRequest {
}

// One connected controller in the authoritative live roster.
message ConnectedController {
  string serial = 1;   // Controller serial
  string name = 2;     // Human-readable controller name (Issue #7)
  int32 battery = 3;   // Last-known battery level
}

message GetConnectedControllersResponse {
  // Authoritative connected serials at the moment of the call. Convenience
  // mirror of controllers[].serial so callers that only need the roster set
  // don't have to unpack the richer messages.
  repeated string connected_serials = 1;
  repeated ConnectedController controllers = 2;
}

// Identify a controller (UC-004, FR-121).
message IdentifyControllerRequest {
  string serial = 1;       // Controller serial to identify
  int32 duration_ms = 2;   // Effect duration (0 = 3000ms; clamped to 500..10000ms)
}

message IdentifyControllerResponse {
  bool success = 1;        // True when the effect started
  // started / not_connected / in_game / reserved / invalid (UC-004; same values as
  // the controller.identify span's identify.outcome and the metric's outcome label)
  string outcome = 2;
  string error = 3;        // Human-readable reason when success is false
  int32 duration_ms = 4;   // The effect duration actually used (after default / clamping)
}
