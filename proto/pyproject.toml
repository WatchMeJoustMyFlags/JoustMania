[project]
name = "joustmania-proto"
version = "1.0.0"
description = "Shared protocol buffer contracts for JoustMania microservices"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.70.0",
    "grpcio-tools>=1.70.0",
    # >=6.33.5: openfeature-provider-flagd 0.5.0 ships proto gencode built with
    # protobuf 6.33.5; an older runtime fails the gencode/runtime guarantee (#843).
    "protobuf>=6.33.5",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"proto" = "."}
packages = ["proto"]

# ruff - Exclude generated protobuf files
[tool.ruff]
line-length = 120
exclude = ["*_pb2.py", "*_pb2_grpc.py"]
