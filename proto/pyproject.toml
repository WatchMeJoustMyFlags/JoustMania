[project]
name = "joustmania-proto"
version = "1.0.0"
description = "Shared protocol buffer contracts for JoustMania microservices"
requires-python = ">=3.11"
dependencies = [
    # >=1.85.0: the checked-in proto/*_pb2_grpc.py are generated with
    # grpcio-tools 1.85.0 and refuse an older grpcio at import (#1945). The
    # images install without uv.lock (#2266), so this floor is what they get.
    "grpcio>=1.85.0",
    "grpcio-tools>=1.85.0",
    # >=7.35.1: openfeature-provider-flagd 0.6.x requires protobuf>=7.35.1,<8
    # (#1945; was >=6.33.5 for 0.5.0, #843). The checked-in proto/*_pb2.py
    # gencode comes from the locked grpcio-tools (`make protos`); protobuf 7
    # rejects only a runtime older than the gencode.
    "protobuf>=7.35.1",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"proto" = "."}
packages = ["proto"]

# ruff - Exclude generated protobuf files
[tool.ruff]
line-length = 120
exclude = ["*_pb2.py", "*_pb2_grpc.py"]
