syntax = "proto3";

package controller_manager_mock;

option go_package = "github.com/joustmania/connect-proxy/gen/controller_manager_mock";

// Additional RPCs for mock controller control
service MockControllerService {
    // Simulate controller movement
    rpc SimulateMovement(MovementRequest) returns (MovementResponse);

    // Simulate death (high acceleration)
    rpc SimulateDeath(DeathRequest) returns (DeathResponse);

    // Simulate button press
    rpc SimulateButton(ButtonRequest) returns (ButtonResponse);

    // Set LED color
    rpc SetColor(ColorRequest) returns (ColorResponse);

    // Reset controller to idle
    rpc ResetController(ResetRequest) returns (ResetResponse);

    // Get list of mock controllers
    rpc ListMockControllers(ListRequest) returns (ListResponse);

    // Set auto game end - automatically kill players after duration to ensure game ends
    rpc SetAutoGameEnd(AutoGameEndRequest) returns (AutoGameEndResponse);

    // Get current LED color of a controller
    rpc GetColor(GetColorRequest) returns (GetColorResponse);

    // Stream observable events from mock controllers (LED changes, button presses, etc.)
    rpc StreamObservability(ObservabilityRequest) returns (stream ObservabilityEvent);

    // Add a single mock controller dynamically
    rpc AddController(AddControllerRequest) returns (AddControllerResponse);

    // Remove a mock controller
    rpc RemoveController(RemoveControllerRequest) returns (RemoveControllerResponse);

    // Add multiple mock controllers at once
    rpc AddControllers(AddControllersRequest) returns (AddControllersResponse);
}

message MovementRequest {
    string serial = 1;
    float accel_x = 2;
    float accel_y = 3;
    float accel_z = 4;
}

message MovementResponse {
    bool success = 1;
    string error = 2;
}

message DeathRequest {
    string serial = 1;
}

message DeathResponse {
    bool success = 1;
    float accel_magnitude = 2;  // Actual simulated magnitude
}

message ButtonRequest {
    string serial = 1;
    enum Button {
        TRIGGER = 0;
        MOVE = 1;
        SELECT = 2;
        START = 3;
    }
    Button button = 2;
    bool pressed = 3;
}

message ButtonResponse {
    bool success = 1;
    string error = 2;
}

message ColorRequest {
    string serial = 1;
    int32 r = 2;
    int32 g = 3;
    int32 b = 4;
}

message ColorResponse {
    bool success = 1;
    string error = 2;
}

message ResetRequest {
    string serial = 1;
}

message ResetResponse {
    bool success = 1;
    string error = 2;
}

message ListRequest {}

// Per-controller info for ListMockControllers. Lets tests/agents enumerate
// their reserved controllers and sweep orphans by tag.
message MockControllerInfo {
    string serial = 1;
    bool reserved = 2;
    string tag = 3;
}

message ListResponse {
    repeated string serials = 1;
    int32 count = 2;
    // Detailed per-controller info including reserved/tag.
    repeated MockControllerInfo controllers = 3;
}

message AutoGameEndRequest {
    float duration_seconds = 1;  // After this time, automatically kill all but one player
    bool enabled = 2;            // Enable/disable auto-end feature
}

message AutoGameEndResponse {
    bool success = 1;
    string error = 2;
}

// GetColor - retrieve current LED color
message GetColorRequest {
    string serial = 1;
}

message GetColorResponse {
    bool success = 1;
    string error = 2;
    int32 r = 3;
    int32 g = 4;
    int32 b = 5;
}

// StreamObservability - stream of observable events from mock controllers
message ObservabilityRequest {
    // Empty - streams all events
}

message ObservabilityEvent {
    int64 timestamp_ms = 1;
    string serial = 2;

    oneof event {
        LedChangeEvent led_change = 10;
        RumbleChangeEvent rumble_change = 11;
        ButtonChangeEvent button_change = 12;
        ConnectionEvent connection = 13;
    }
}

message LedChangeEvent {
    int32 r = 1;
    int32 g = 2;
    int32 b = 3;
    string source = 4;  // "base_color", "effect", "game_effect", etc.
}

message RumbleChangeEvent {
    int32 intensity = 1;
}

message ButtonChangeEvent {
    string button = 1;
    bool pressed = 2;
}

message ConnectionEvent {
    bool connected = 1;
}

// AddController - add a single mock controller dynamically
message AddControllerRequest {
    string serial = 1;  // Optional: auto-generated if empty
    // When true, the controller is hidden from button-stream consumers (the
    // menu): no connect/disconnect announcements, excluded from the
    // connected_serials roster. It stays fully usable via gameplay-data
    // streams and explicit-serial LED/feedback commands.
    bool reserved = 2;
    // Identifies the owning agent/game — aids orphan cleanup and debugging.
    string tag = 3;
}

message AddControllerResponse {
    bool success = 1;
    string error = 2;
    string serial = 3;  // The serial of the added controller
}

// RemoveController - remove a mock controller
message RemoveControllerRequest {
    string serial = 1;
}

message RemoveControllerResponse {
    bool success = 1;
    string error = 2;
}

// AddControllers - add multiple mock controllers at once
message AddControllersRequest {
    int32 count = 1;
    // When true, all added controllers are reserved (hidden from the menu).
    // See AddControllerRequest.reserved.
    bool reserved = 2;
    // Identifies the owning agent/game — applied to all added controllers.
    string tag = 3;
}

message AddControllersResponse {
    bool success = 1;
    string error = 2;
    repeated string serials = 3;
}
