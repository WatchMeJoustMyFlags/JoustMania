# docker-compose.ci-rust.yml — adds rust-hid to CI test stack
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml -f docker-compose.ci-rust.yml up
#
# Part of #611 (canary release architecture)
services:
  rust-hid:
    image: ${IMAGE_PREFIX:-ghcr.io/watchmejoustmyflags/joustmania}/rust-hid:${IMAGE_TAG:-latest}
    # No ports here: the base file already publishes 127.0.0.1:50058, and compose
    # merges port lists, so a second "50058:50058" would add a 0.0.0.0 binding
    # for the same host port (#1319).
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50058"]
      interval: 5s
      timeout: 3s
      retries: 5
