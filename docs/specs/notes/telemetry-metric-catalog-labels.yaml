# Bounded label-value lists, rendered next to the label in the Labels column.
# metric -> {label: values}. A label that is not on the metric fails generation.
game_flag_service_calls_total:
  call: register|end|reconcile
  result: ok|error|timeout
games_completed_total:
  outcome: winner|tie|completed|force_ended|error
operator_pad_previews_total:
  result: spoken|replaced|suppressed|limit|refused|unknown
