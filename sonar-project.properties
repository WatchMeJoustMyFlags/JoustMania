# SonarCloud configuration for JoustMania
# https://docs.sonarcloud.io/advanced-setup/analysis-parameters/

sonar.projectKey=WatchMeJoustMyFlags_JoustMania
sonar.organization=watchmejoustmyflags

# Project metadata
sonar.projectName=JoustMania
sonar.projectVersion=2.0.0

# Source code locations (relative to repo root)
sonar.sources=.
sonar.tests=services/controller_manager/tests,services/game_coordinator/tests,services/menu/tests,services/audio/tests,services/pairing_daemon/tests,lib/tests,tests/integration

# Python configuration
sonar.python.version=3.12

# Coverage report paths - passed dynamically via CI args
# sonar.python.coverage.reportPaths is set in GitHub Actions

# Exclude from analysis
sonar.exclusions=\
  **/proto/*_pb2*.py,\
  **/node_modules/**,\
  **/.venv/**,\
  **/__pycache__/**,\
  **/tests/**,\
  services/grafana/**,\
  services/prometheus/**,\
  services/jaeger/**,\
  services/loki/**,\
  services/otel-collector/**,\
  services/envoy/**,\
  services/victoria-metrics/**,\
  services/flagd/**,\
  services/connect-proxy/**,\
  services/dashboard/**,\
  services/grafana-live-publisher/**

# Exclude from coverage calculation (entry points, boilerplate, tools)
sonar.coverage.exclusions=\
  **/server.py,\
  **/__init__.py,\
  **/metrics.py,\
  tools/**

# Test file patterns
sonar.test.inclusions=**/tests/**/*.py,tests/**/*.py

# Encoding
sonar.sourceEncoding=UTF-8
