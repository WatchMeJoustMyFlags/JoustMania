# JoustMania Docker Compose Configuration
#
# Quick Start (pull from GHCR - no build needed), as the Pi runs it
# (scripts/setup/joustmania-start.sh):
#   ./scripts/setup/joustmania-compose.sh pull
#   ./scripts/setup/joustmania-compose.sh up -d
# (= docker compose -f docker-compose.yml --env-file .env [--env-file .env.local];
# a plain -f docker-compose.yml reads only .env: release tag, no API keys, #1488)
# A bare `docker compose up -d` also loads docker-compose.override.yml (dev
# ports on all interfaces); fine on a dev machine, never on the Pi (#1319).
#
# Local development (source mounts, dev ports): make dev
#
# Base config defaults to bluetooth mode (real hardware).
# For mock mode (testing): make up-mock
#
# Environment Variables (can be set in shell or .env file):
# - IMAGE_TAG: Image tag to use [default: latest, only when no .env sets it; the Pi pins a release or commit, C-040]
# - LOG_LEVEL: Logging level of the agent only (DEBUG, INFO, WARNING, ERROR) [default: INFO];
#   the Python services take their level from the "log_level" flag (flags.md)
# - JOUSTMANIA_HOST: Hostname for OTEL resource attributes (host.name) [default: joustmania]
#
# Controller backend: the "backend" flag in flagd (controller domain) selects which
# adapters load at startup; the default is "rust" (rust-hid, #1371). python-hid is
# opt-in only and needs all three of:
#   1. the "python-hid" compose profile:
#        ./scripts/setup/joustmania-compose.sh --profile python-hid up -d
#      (on the Pi: a systemd drop-in, see scripts/setup/joustmania.service)
#   2. backend=python_rust (controller.json defaultVariant, then restart
#      controller-manager), so the python adapter is loaded at all, AND
#   3. bluetooth_backend=python, so serials (and pairing) are routed to it;
#      its default "rust" keeps every controller on rust-hid otherwise.
#
# Operator pad (UC-015, #2050): opt-in with the "operator-pad" profile
# (COMPOSE_PROFILES=operator-pad in .env.local on the Pi; set the whole
# comma-separated list in one place, e.g. python-hid,operator-pad: a unit
# drop-in Environment= wins over .env.local). INPUT_GID sets the host's input group GID [default: 996,
# the stage Pi]; a stack without the profile behaves exactly as before.
#
# Host ports: only envoy's 80 is reachable from the network. flagd sync (8015),
# OTLP (4317) and rust-hid (50058) are bound to 127.0.0.1 for the host-networked
# pairing daemon. docker-compose.override.yml (auto-loaded by a bare
# `docker compose`) publishes the dev/test gRPC and mock control ports; the Pi
# start script never loads it (scripts/setup/joustmania-start.sh, #1319).
#
# Notes:
# - All images default to ghcr.io/watchmejoustmyflags/joustmania registry
# - Use IMAGE_TAG to specify version (e.g., IMAGE_TAG=main docker compose up)
# - Local builds tag images with GHCR names for consistency
#
# Resource Limits:
# - Total memory limits sum to about 4.2-4.3GB (NFR-020 notes the gap to the 4GB Pi); the limits are ceilings, not typical use
# - CPU limits: 1.0 for real-time app services, 0.5 for standard services, 0.25 for lightweight

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: "com.docker.compose.service,com.docker.compose.image"

services:
  # Flag service (epic #1407, UC-053, docs/specs/services.md §7): holds the
  # runtime flag state in memory and serves it to flagd as ONE flagd.sync.v1
  # gRPC sync source; every flag carries its metadata.flagSetId, so clients keep
  # their flagSetId selectors. It loads the flag files (all nine sets) read-only
  # at start and never writes them (C-030, C-033); flagd has no other source.
  # Writers: HTTP/JSON on 8070 (envoy /flags/ from the host, C-015). flagd: 50064.
  flag-service:
    image: ghcr.io/watchmejoustmyflags/joustmania/flag-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/flag-service/Dockerfile
    container_name: joustmania-flag-service
    expose:
      - "50064"  # flagd.sync.v1 gRPC (flagd only)
      - "8070"   # HTTP/JSON write/read API + /healthz
    environment:
      - FLAG_SERVICE_SETS=system,observability,interventions,rollout,agent,game,user,controller,operator
      - FLAG_SERVICE_BASELINE_DIR=/etc/flagd
      # The registry comes from the same checkout as the baseline (mounted below):
      # the image copy would reject a renamed flag (#1838).
      - FLAG_SERVICE_REGISTRY=/etc/flag-service/registry.yaml
      # Admin settings persisted on request (D10, re-review N4). One state file
      # per stack: the ci and dry-run stacks override the name.
      - FLAG_SERVICE_STATE_FILE=/var/lib/flag-service/admin.json
      # Go runtime soft limit under the 64 MiB container limit (NFR-051).
      - GOMEMLIMIT=48MiB
      - OTEL_SERVICE_NAME=flag-service
      - OTEL_SERVICE_NAMESPACE=infrastructure
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
      - SERVICE_VERSION=${IMAGE_TAG:-dev}
    volumes:
      # Read-only from the start: the service never writes the flag files.
      - ./services/flagd:/etc/flagd:ro
      - ./services/flag-service/registry.yaml:/etc/flag-service/registry.yaml:ro
      - flag-service-state:/var/lib/flag-service
    healthcheck:
      test: ["CMD", "/flag-service", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
    networks:
      - joustmania
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.25'
    logging: *default-logging

  # flagd for feature flag evaluation. Every flag set comes over ONE gRPC sync
  # source (grpc://flag-service:50064); flagd reads no flag file and has no
  # flag mount (C-033). flagd exits when a gRPC source is
  # unreachable at its own start, so it starts only once the flag service is
  # healthy, and restarts with it (restart: true; `scripts/flags.sh restart`).
  # No readyz health check: in v0.16.0 readyz never turns true with a gRPC
  # source (flagd #1985), so dependents keep condition: service_started.
  flagd:
    image: ghcr.io/open-feature/flagd:v0.16.0
    container_name: joustmania-flagd
    command:
      - "start"
      - "--uri"
      - "grpc://flag-service:50064"
      - "--metrics-exporter"
      - "otel"
      - "--otel-collector-uri"
      - "otel-collector:4317"
    environment:
      - OTEL_SERVICE_NAME=flagd
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
    depends_on:
      flag-service:
        condition: service_healthy
        restart: true
    ports:
      # Sync port for the host-networked pairing-daemon, which reaches it as
      # localhost:8015. Loopback only: the flag config must not be readable
      # from the venue network (#1319).
      - "127.0.0.1:8015:8015"
    expose:
      - "8013"  # flagd evaluation port (gRPC)
      - "8014"  # flagd management port (Prometheus metrics)
      - "8015"  # flagd sync port (for in-process evaluation)
    networks:
      - joustmania
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'
    logging: *default-logging

  # Jaeger for distributed tracing UI
  jaeger:
    image: jaegertracing/jaeger:2.19.0
    container_name: joustmania-jaeger
    user: "0"  # Run as root to avoid permission issues with badger volume (default UID 10001 can't write)
    # All ports exposed only within Docker network (envoy proxies to it)
    expose:
      - "16686"  # Jaeger UI
      - "4317"   # OTLP gRPC (used by otel-collector)
      - "4318"   # OTLP HTTP
    volumes:
      - ./services/jaeger/config.yaml:/etc/jaeger/config.yaml:ro
      - jaeger-data:/badger
    command: ["--config", "/etc/jaeger/config.yaml"]
    networks:
      - joustmania
    # #1191: self-heal from an OOM (exit 137) instead of staying DEAD with the
    # trace UI unreachable. With the prior RestartPolicy=no, a single OOM under
    # the agent experiment-loop span volume left /jaeger 503 for the rest of the
    # session. unless-stopped brings the trace store back automatically.
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:16686/jaeger/" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          # #1191: raised 384m -> 1024m. The trace-BACKEND analogue of the
          # collector OOM (#1173): the agent experiment loop + the #1178/#1188
          # span hierarchy produce a lot of spans, and Jaeger's badger storage
          # (compaction + value-log cache) outgrew 384m, getting OOM-killed
          # (exit 137). Jaeger is a dev/observability component (not a
          # Pi-gameplay service), so the budget is raised globally rather than
          # per-stack. Badger span TTL is bounded in services/jaeger/config.yaml
          # so the store can't creep unbounded over a long demo.
          memory: 1024m
          cpus: '0.5'
    logging: *default-logging

  # OpenTelemetry Collector (custom build: contrib components)
  otel-collector:
    image: ghcr.io/watchmejoustmyflags/joustmania/otel-collector:${OTEL_COLLECTOR_TAG:-${IMAGE_TAG:-latest}}
    build:
      context: images/otel-collector
      dockerfile: Dockerfile
    container_name: joustmania-otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
    volumes:
      - ./services/otel-collector/config.yaml:/etc/otel-collector-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Host filesystem mounts for hostmetrics receiver (replaces node-exporter)
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
      - /:/hostfs/root:ro
      # Host identity for resourcedetection processor (real hostname + machine-id)
      - /etc/hostname:/etc/hostname:ro
      - /etc/machine-id:/etc/machine-id:ro
    ports:
      # OTLP gRPC for host-network containers (pairing-daemon, localhost:4317).
      # Loopback only: the agent observes the game through this telemetry, so
      # nobody on the venue network may inject spans or metrics (#1319).
      - "127.0.0.1:4317:4317"
    # No depends_on on the backends (UC-060 BR-004, FR-181): the collector starts
    # at once and its exporters use the collector's default bounded retry (about
    # 5 min, in-memory queue) until Jaeger, Loki and VictoriaMetrics are up; a
    # backend that comes up later than that loses the early data (UC-035 A3, NFR-021).
    restart: unless-stopped
    networks:
      - joustmania
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          # #1155: raised 256m -> 768m. At 256m the kernel OOM-killed the
          # collector (exit 137) under sustained agent experiment-loop span
          # volume before the memory_limiter (limit_mib was 512, ABOVE this
          # ceiling) could ever shed load. The limiter is now aligned BELOW
          # this ceiling (limit_mib=600, spike_limit_mib=150) per OTEL guidance
          # (~80% / ~25%), so it backpressures at ~600m with ~168m headroom for
          # off-heap/GC spikes instead of being OOM-killed. Keeps the #1140
          # trace-correlation spans flowing. See services/otel-collector/config.yaml.
          memory: 768m
          cpus: '0.5'
    logging: *default-logging

  # Controller Manager Service
  controller-manager:
    image: ghcr.io/watchmejoustmyflags/joustmania/controller-manager-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/controller_manager/Dockerfile
    container_name: joustmania-controller-manager
    privileged: true
    # Required for controller hot-plug: run in host PID namespace to see new devices
    pid: "host"
    volumes:
      # D-Bus socket for BlueZ communication
      - /var/run/dbus:/var/run/dbus:ro
      # Bluetooth device info (read-only, pairing handled by host daemon)
      - /var/lib/bluetooth:/var/lib/bluetooth:ro
      # Mount devtmpfs with rslave for hot-plug device visibility
      - /dev:/dev:rslave
      # Persist controller names across restarts
      - controller-names:/app/data
    networks:
      - joustmania
    # Ports exposed only within Docker network (no host binding)
    expose:
      - "50052"  # gRPC service
    environment:
      - CONTROLLER_NAMES_FILE=/app/data/controller_names.txt
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/var/run/dbus/system_bus_socket
      - OTEL_SERVICE_NAME=controller-manager-service
      - OTEL_SERVICE_NAMESPACE=infrastructure
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
      - SERVICE_VERSION=${IMAGE_TAG:-dev}
      # Rust HID service for canary controller I/O backend
      - RUST_HID_HOST=rust-hid
      - RUST_HID_PORT=50058
      # Python HID service: opt-in backend (python-hid profile, #1371)
      - PYTHON_HID_HOST=python-hid
      - PYTHON_HID_PORT=50059
    depends_on:
      flagd:
        condition: service_started
      rust-hid:
        condition: service_healthy
      # Waited for only when the python-hid profile is active (#1371).
      python-hid:
        condition: service_healthy
        required: false
    restart: unless-stopped
    # Healthcheck defined in Dockerfile (uses grpc_health_probe)
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '3.0'
    logging: *default-logging

  # Pairing Daemon - USB controller pairing and Bluetooth monitoring
  pairing-daemon:
    image: ghcr.io/watchmejoustmyflags/joustmania/pairing-daemon-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/pairing_daemon/Dockerfile
    container_name: joustmania-pairing-daemon
    privileged: true
    pid: "host"
    # Host network required for AF_BLUETOOTH HCI sockets (hciconfig/hcitool).
    # D-Bus works in bridge mode, but raw HCI needs the host network namespace.
    network_mode: host
    volumes:
      # D-Bus socket for BlueZ communication (RW for adapter power-cycle)
      - /var/run/dbus:/var/run/dbus
      # Bluetooth device info (RW for pairing)
      - /var/lib/bluetooth:/var/lib/bluetooth
      # USB device access
      - /dev:/dev:rslave
    # Port 8002 (health + UC-005 unpair) binds on the host via network_mode: host,
    # only on loopback and the docker0 gateway (what host.docker.internal resolves
    # to), so the connect-proxy reaches it but the LAN does not (UC-005 BR-003).
    environment:
      - METRICS_PORT=8002
      - CONTROL_BIND=${PAIRING_CONTROL_BIND:-127.0.0.1,172.17.0.1}
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/var/run/dbus/system_bus_socket
      - OTEL_SERVICE_NAME=pairing-daemon
      - OTEL_SERVICE_NAMESPACE=infrastructure
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
      - SERVICE_VERSION=${IMAGE_TAG:-dev}
      # Loopback because network_mode:host can't use Docker DNS. 127.0.0.1, not
      # localhost: 4317, 8015 and 50058 are published on 127.0.0.1 only (#1319),
      # and localhost may resolve to ::1 first.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4317
      # flagd for runtime-tunable intervals
      - FLAGD_HOST=127.0.0.1
      - FLAGD_PORT=8015
      # Rust HID service through its loopback-published port
      - RUST_HID_HOST=127.0.0.1
      - RUST_HID_PORT=50058
      # Primary game state for pairing.bluez_restart_mode=when_idle (UC-001 BR-005),
      # through envoy's published port 80 (the coordinator has no host port)
      - GAME_STATE_URL=http://localhost/joustmania.game_coordinator.GameCoordinatorService/GetGameState
    depends_on:
      rust-hid:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    # Healthcheck defined in Dockerfile (uses HTTP /healthz)

  # Rust HID Service - PS Move HID operations via gRPC. The default Bluetooth
  # backend (#1371): the controller manager reads real controllers through it and
  # the pairing daemon pairs through its PairingService.
  rust-hid:
    image: ghcr.io/watchmejoustmyflags/joustmania/rust-hid:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/rust-hid/Dockerfile
    container_name: joustmania-rust-hid
    privileged: true
    pid: "host"
    volumes:
      - /dev:/dev:rslave
    networks:
      - joustmania
    ports:
      # For the host-networked pairing-daemon (localhost:50058). Loopback only:
      # the HID gRPC API must not be reachable from the venue network (#1319).
      - "127.0.0.1:50058:50058"
    environment:
      - OTEL_SERVICE_NAME=rust-hid
      - OTEL_SERVICE_NAMESPACE=infrastructure
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
      - SERVICE_VERSION=${IMAGE_TAG:-dev}
      - RUST_LOG=info
    restart: unless-stopped
    # Healthcheck defined in Dockerfile (uses grpc_health_probe)
    deploy:
      resources:
        limits:
          memory: 64m
          # 1.0, not 0.25 (#2125): with 3 controllers on the stage Pi rust-hid used
          # 14.7 % of a core (mostly syscalls of the 1 kHz poll) and was CFS-throttled
          # in 117 periods; about 9 controllers exceed 0.25, and every throttled 100 ms
          # period stalls input, output and gRPC for up to 75 ms.
          cpus: '1.0'
    logging: *default-logging

  # Python HID Service - PS Move HID operations via gRPC (Python implementation)
  # OPT-IN ONLY (#1371): rust-hid is the default Bluetooth backend. Starts only
  # with `--profile python-hid`; slated for removal after the talk.
  python-hid:
    profiles:
      - python-hid
    image: ghcr.io/watchmejoustmyflags/joustmania/python-hid:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/python_hid/Dockerfile
    container_name: joustmania-python-hid
    privileged: true
    pid: "host"
    volumes:
      - /dev:/dev:rslave
    networks:
      - joustmania
    expose:
      - "50059"  # gRPC service
    environment:
      - OTEL_SERVICE_NAME=python-hid
      - OTEL_SERVICE_NAMESPACE=infrastructure
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
      - SERVICE_VERSION=${IMAGE_TAG:-dev}
    restart: unless-stopped
    # Healthcheck defined in Dockerfile (uses grpc_health_probe)
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.5'
    logging: *default-logging

  # Game Coordinator Service
  game-coordinator:
    image: ghcr.io/watchmejoustmyflags/joustmania/game-coordinator-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/game_coordinator/Dockerfile
    container_name: joustmania-game-coordinator
    # Ports exposed only within Docker network (no host binding)
    expose:
      - "50053"  # gRPC service
    environment:
      - OTEL_SERVICE_NAME=game-coordinator-service
      - OTEL_SERVICE_NAMESPACE=joustmania
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
      - SERVICE_VERSION=${IMAGE_TAG:-dev}
      # Game lifecycle reported to the flag service (FR-135, #1410)
      - FLAG_SERVICE_URL=http://flag-service:8070
      - FLAG_SERVICE_INSTANCE=game-coordinator  # stable across recreate (the hostname is the container id), UC-053 A10
    depends_on:
      flagd:
        condition: service_started
    networks:
      - joustmania
    restart: unless-stopped
    stop_grace_period: 10s
    # Healthcheck defined in Dockerfile (uses grpc_health_probe)
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '1.0'
    logging: *default-logging

  # Menu Service
  menu:
    image: ghcr.io/watchmejoustmyflags/joustmania/menu-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/menu/Dockerfile
    container_name: joustmania-menu
    # Ports exposed only within Docker network (no host binding)
    expose:
      - "50054"  # gRPC service
    environment:
      - OTEL_SERVICE_NAME=menu-service
      - OTEL_SERVICE_NAMESPACE=joustmania
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
      - SERVICE_VERSION=${IMAGE_TAG:-dev}
      # Phase 60: Audio service connection
      - AUDIO_HOST=audio
      - AUDIO_PORT=50056
      - FLAGD_HOST=flagd
      - FLAGD_PORT=8015
      # Admin settings, the game selection and the kill switch are persisted
      # admin values on the flag service (UC-053 A2); the menu mounts no flag file.
      - FLAG_SERVICE_URL=http://flag-service:8070
    depends_on:
      flagd:
        condition: service_started
    networks:
      - joustmania
    restart: unless-stopped
    # Healthcheck defined in Dockerfile (uses grpc_health_probe)
    deploy:
      resources:
        limits:
          memory: 192m
          cpus: '0.5'
    logging: *default-logging

  # Audio Service
  audio:
    image: ghcr.io/watchmejoustmyflags/joustmania/audio-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/audio/Dockerfile
    container_name: joustmania-audio
    # Sound device access for real audio output
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - "29"  # host 'audio' group GID — required for ALSA device access
    volumes:
      - ./services/audio/assets:/app/services/audio/assets:ro  # Audio files (read-only)
    # Ports exposed only within Docker network (no host binding)
    expose:
      - "50056"  # gRPC service
    environment:
      - OTEL_SERVICE_NAME=audio-service
      - OTEL_SERVICE_NAMESPACE=joustmania
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
      - SERVICE_VERSION=${IMAGE_TAG:-dev}
      - FLAGD_HOST=flagd
      - FLAGD_PORT=8015
      - ALSA_CARD=auto  # Auto-detect sound card; set to card number (e.g. "1") to override
    depends_on:
      flagd:
        condition: service_started
    networks:
      - joustmania
    restart: unless-stopped
    # Healthcheck defined in Dockerfile (uses grpc_health_probe)
    # Memory: largest OGG (classical.ogg 5.7MB) decodes to ~60MB PCM + resampler
    # buffers (~20MB) + Python/gRPC/OTEL baseline (~60MB) + headroom for
    # concurrent track transitions = ~320MB peak
    deploy:
      resources:
        limits:
          memory: 320m
          cpus: '0.5'
    logging: *default-logging

  # Operator pad (UC-015, #2050): a USB macro pad as a lobby and agent remote.
  # OPT-IN ONLY: starts with the `operator-pad` profile (COMPOSE_PROFILES in
  # .env.local on the Pi, UC-060). Not privileged: it reads only /dev/input
  # (read-only bind mount: it guards the directory only, the nodes stay
  # writable, which EVIOCGRAB and the keyboard LEDs need), the cgroup rule
  # allows read/write (no mknod) on the evdev char devices (major 13),
  # including ones plugged in later, and group_add gives the nonroot user the host's input
  # group. INPUT_GID is host identity (C-035): the input group's GID differs
  # per host (996 on the stage Pi; `getent group input` shows it). No
  # /run/udev: evdev does not need it. Serves no port, so no healthcheck.
  operator-pad:
    profiles:
      - operator-pad
    image: ghcr.io/watchmejoustmyflags/joustmania/operator-pad:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/operator_pad/Dockerfile
    container_name: joustmania-operator-pad
    volumes:
      - /dev/input:/dev/input:ro
    device_cgroup_rules:
      - "c 13:* rw"
    group_add:
      - "${INPUT_GID:-996}"
    environment:
      - OTEL_SERVICE_NAME=operator-pad
      - OTEL_SERVICE_NAMESPACE=joustmania
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
      - SERVICE_VERSION=${IMAGE_TAG:-dev}
      - FLAGD_HOST=flagd
      - FLAGD_PORT=8015
      - MENU_HOST=menu
      - MENU_PORT=50054
      - GAME_COORDINATOR_HOST=game-coordinator
      - GAME_COORDINATOR_PORT=50053
      - AUDIO_HOST=audio
      - AUDIO_PORT=50056
    depends_on:
      flagd:
        condition: service_started
    networks:
      - joustmania
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'
    logging: *default-logging

  # VictoriaMetrics: the only metrics store (the Prometheus container was removed
  # in #1449). Receives metrics via Prometheus remote write from the OTEL Collector
  # and serves the Prometheus query API to Grafana, the dashboard and the tools.
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.144.0
    container_name: joustmania-victoria-metrics
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=7d"
      - "-httpListenAddr=:8428"
    # Port exposed only within Docker network (envoy proxies to it)
    expose:
      - "8428"
    volumes:
      - victoria-metrics-data:/victoria-metrics-data
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8428/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Note: VictoriaMetrics image is scratch-based, no shell/wget for healthcheck
    # Service starts quickly and exposes /health endpoint for manual verification
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    logging: *default-logging

  # Grafana for metrics visualization (Phase 38)
  grafana:
    image: grafana/grafana:13.0.2
    container_name: joustmania-grafana
    # Port exposed only within Docker network (envoy proxies to it)
    expose:
      - "3000"
    environment: []
    volumes:
      - ./services/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      victoria-metrics:
        condition: service_healthy
      loki:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    logging: *default-logging

  # Loki for log aggregation with 24h retention
  loki:
    image: grafana/loki:3.7.2
    container_name: joustmania-loki
    user: "0"  # Run as root to avoid permission issues with volume
    # Port exposed only within Docker network (envoy proxies to it)
    expose:
      - "3100"
    volumes:
      - ./services/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/tmp/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      # Loki 3.6+ images are distroless (no wget/shell); use the built-in health subcommand
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 192m
          cpus: '0.5'
    logging: *default-logging

  # Connect-Web Proxy (gRPC to Connect protocol translation)
  # No dependencies - proxy handles connection failures gracefully
  connect-proxy:
    image: ghcr.io/watchmejoustmyflags/joustmania/connect-proxy:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/connect-proxy/Dockerfile
    container_name: joustmania-connect-proxy
    # Port exposed only within Docker network (envoy proxies to it)
    expose:
      - "8080"
    environment:
      - CONTROLLER_MANAGER_SERVICE=controller-manager:50052
      - GAME_COORDINATOR_SERVICE=game-coordinator:50053
      - MENU_SERVICE=menu:50054
      # Canary endpoints write the controller set through the flag
      # service (#1420); the proxy mounts no flag file.
      - FLAG_SERVICE_URL=http://flag-service:8070
      # Pairing daemon control API (UC-005 unpair); the daemon runs on the host network
      - PAIRING_DAEMON_URL=http://host.docker.internal:8002
      # Extra host names the dashboard is reached by (comma-separated), besides IP
      # literals, localhost and the host's own <hostname> / <hostname>.local (read
      # from the mount below); /pairing/unpair answers 403 for any other Host
      # (UC-005 BR-003, DNS rebinding)
      - JOUSTMANIA_HOSTNAMES=${JOUSTMANIA_HOSTNAMES:-}
      - OTEL_SERVICE_NAME=connect-proxy
      - OTEL_SERVICE_NAMESPACE=infrastructure
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
      - SERVICE_VERSION=${IMAGE_TAG:-dev}
    volumes:
      # The Pi's host name for the unpair Host allow-list (UC-005 BR-003)
      - /etc/hostname:/etc/joustmania/host-hostname:ro
    extra_hosts:
      # Reach the host-networked pairing daemon (:8002) for UC-005 unpair
      - "host.docker.internal:host-gateway"
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 1s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.5'
    logging: *default-logging

  # Agent (OTLP fan-out target — receives traces/metrics pushed by the collector)
  # No dependencies and no depends_on FROM the collector: the collector must run
  # standalone even when the agent is down (best-effort delivery).
  agent:
    image: ghcr.io/watchmejoustmyflags/joustmania/agent:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    container_name: joustmania-agent
    # Port exposed only within Docker network (the collector pushes OTLP to it)
    expose:
      - "4317"
    environment:
      - AGENT_LISTEN_ADDR=:4317
      - AGENT_HEALTH_ADDR=:13134
      # OpenFeature control layer. FLAGD_PORT is left to the binary's default on
      # purpose: since #1713 the agent uses the flagd in-process resolver on the sync
      # port 8015 (selectors flagSetId=agent / rollout); an older pinned image
      # (IMAGE_TAG in .env) still defaults to its RPC port 8013.
      - FLAGD_HOST=flagd
      # Action sink (#730/#1213, #1411): when the LIVE `interventions_enabled` flag
      # (agent.json) is on, the agent applies each decision as ONE game-scoped write
      # to the flag service (PUT/POST /interventions/<flag>). The gate is read per
      # Apply, fail-closed off, so a flagd outage never writes. No restart needed.
      - FLAG_SERVICE_URL=http://flag-service:8070
      # Progressive rollout expansion (#734/#1213): when the LIVE `rollout_enabled`
      # flag (agent.json) is on the agent advances the Bluetooth backend rollout
      # controller-by-controller with PUT /rollout/current_controller_count on the
      # flag service (#1411). The gate is read per SetControllerCount, fail-closed
      # off → the loop decides and spans expansions but does not apply them
      # (dry-run), and a flagd outage stays dry-run. Flip the flag, no restart.
      # Auto-remediation / rollback (#736): on fitness failure during an active
      # rollout the agent rolls current_controller_count back to "none", gated on
      # the remediation_allowed flag (rollout set, evaluated through flagd).
      # After a rollback, re-expansion is suppressed for the cooldown below.
      - AGENT_ROLLOUT_COOLDOWN_SECONDS=${AGENT_ROLLOUT_COOLDOWN_SECONDS:-30}
      # ---- Proposer / retro text backend (#1234) ----
      # The OFFLINE LLM seams (shadow-experiment proposer, post-game retro), NOT
      # in-game decisions (those are the decision.backend flag below). Default =
      # stub: the proposer proposes nothing and the retro is capture-only, so a
      # plain `up` needs no key. The inference.backend flag (#1810) selects claude, which
      # calls the Anthropic API directly with ANTHROPIC_API_KEY (no gateway); without
      # a key it stays on the stub; with flagd unresolved it is the stub. Model, effort
      # and timeout are the inference.model / inference.effort / inference.timeout_seconds
      # flags (#1907: the env fallbacks are removed).
      # ---- Decision backends (#1244, epic #1225) ----
      # API keys for the remote in-game decision backends selected by the
      # decision.backend flag (claude / openai / jev; flip with
      # ./scripts/agent-backend.sh). ANTHROPIC_API_KEY also serves the
      # proposer/retro backend above. Keys go straight to the agent, which calls
      # the vendor directly: there is no gateway. Read once at agent startup;
      # an empty key makes that backend unavailable and the decision falls
      # back to rules. Never put keys in a flag file or the tracked .env: export
      # them in the shell or use the git-ignored .env.local (on the Pi
      # scripts/setup/joustmania-compose.sh, used by the systemd autostart,
      # passes --env-file .env --env-file .env.local to every call, #1488).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DECISION_OPENAI_API_KEY=${DECISION_OPENAI_API_KEY:-}
      - JEV_API_KEY=${JEV_API_KEY:-}
      # LIVE per-minute LLM request budget override (#964/#1071) for remote decide
      # calls. Read in main.go via SetLLMBudgetOverride; empty default = ignored
      # (the llm.max_requests_per_minute flag governs),
      # matching the Go "non-positive = ignore" semantics. Declared here so a host
      # `export` or `.env` value actually reaches the container (#1078).
      - AGENT_LLM_MAX_REQUESTS_PER_MINUTE=${AGENT_LLM_MAX_REQUESTS_PER_MINUTE:-}
      # UC-042 / FR-058: operator ceiling of the proposer gate (unset = closed). Both
      # proposers (retro-seeded theses and M7-4) run only when this is true AND the
      # experiment_proposer_enabled flag is on (#1810, C-034).
      - AGENT_EXPERIMENT_PROPOSER_ENABLED=${AGENT_EXPERIMENT_PROPOSER_ENABLED:-}
      # Heuristic dynamic declarer (#995): the agent autonomously picks which
      # game.json flag to experiment on. Gated by the experiment_dynamic_enabled flag
      # (default off), under experiments_enabled + the kill-switch (#1907). Its
      # candidates, denylist additions, objective and target N are the
      # experiment_dynamic_* flags (#1907, flags.md §15).
      # Operator ceiling on experiment_dynamic_max_concurrent (#1810, C-034): empty = no ceiling.
      - AGENT_EXPERIMENT_DYNAMIC_MAX_CONCURRENT=${AGENT_EXPERIMENT_DYNAMIC_MAX_CONCURRENT:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OTEL_SERVICE_NAME=agent
      - OTEL_SERVICE_NAMESPACE=infrastructure
      # Self-telemetry (#724): the agent's own decision-audit spans flow to Jaeger.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
      - SERVICE_VERSION=${IMAGE_TAG:-dev}
    volumes:
      # The agent writes flags only through the flag service (FLAG_SERVICE_URL);
      # it mounts no flag file (epic #1407, C-033).
      # Durable experiment journal (#1023, completes #831). The agent writes the
      # per-experiment intent/events.jsonl/summary.json under AGENT_EXPERIMENT_DIR
      # (default /var/lib/joustmania/agent/experiments; see
      # services/agent/experiment/journal/store.go). #831 made the journal survive
      # a process restart; this named volume makes it survive container recreation
      # (`docker compose down`, image upgrade) too, so a long-running cohort's
      # accumulated per-arm samples + verdict state are not silently wiped.
      - agent-experiments:/var/lib/joustmania/agent/experiments
    depends_on:
      flagd:
        condition: service_started
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:13134/healthz"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 1s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.5'
    logging: *default-logging

  # Dashboard (Real-time controller visualization SPA)
  dashboard:
    image: ghcr.io/watchmejoustmyflags/joustmania/dashboard:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    container_name: joustmania-dashboard
    # Port exposed only within Docker network (envoy proxies to it)
    expose:
      - "8080"
    networks:
      - joustmania
    restart: unless-stopped
    # Healthcheck defined in Dockerfile
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.25'
    logging: *default-logging

  # Envoy - Main entry point (reverse proxy)
  # No dependencies - envoy uses STRICT_DNS and handles unavailable backends with 503
  envoy:
    image: envoyproxy/envoy:v1.38.1
    container_name: joustmania-envoy
    ports:
      # UC-035 BR-001: the only host entry for the UIs and HTTP APIs.
      - "80:80"  # Main entry point (all services proxied through envoy)
    volumes:
      - ./services/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      - joustmania
    restart: unless-stopped
    # No healthcheck - distroless image has no shell utilities
    # Envoy starts quickly and handles backend unavailability gracefully
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.5'
    logging: *default-logging

networks:
  joustmania:
    driver: bridge
    name: joustmania-network

volumes:
  # Flag service admin state (D10): only admin values written with persist.
  flag-service-state:
  victoria-metrics-data:
  grafana-data:
  loki-data:
  jaeger-data:
  controller-names:
  # Durable experiment journal for the agent (#1023). See the agent service's
  # volumes block for the rationale and the matching AGENT_EXPERIMENT_DIR path.
  agent-experiments:
