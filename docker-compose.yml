# JoustMania Docker Compose Configuration
#
# Quick Start (pull from GHCR - no build needed):
#   docker compose pull  # Pull all images from GHCR
#   docker compose up -d # Start all services
#   # Or: make up-pull
#
# Quick Start (local build):
#   make up              # Build and start all services
#
# Base config defaults to bluetooth mode (real hardware).
# For mock mode (testing): make up-mock
#
# Environment Variables (can be set in shell or .env file):
# - IMAGE_TAG: Image tag to use [default: latest]
# - LOG_LEVEL: Logging level for all services (DEBUG, INFO, WARNING, ERROR) [default: INFO]
# - JOUSTMANIA_HOST: Hostname for OTEL resource attributes (Dynatrace Smartscape) [default: joustmania]
#
# Controller backend is configured via the "backend" flag in flagd (controller domain).
#
# Notes:
# - All images default to ghcr.io/watchmejoustmyflags/joustmania registry
# - Use IMAGE_TAG to specify version (e.g., IMAGE_TAG=main docker compose up)
# - Local builds tag images with GHCR names for consistency
#
# Resource Limits:
# - Total memory budget ~3.2GB, designed for 4GB Raspberry Pi (leaving ~800MB for OS)
# - CPU limits: 1.0 for real-time app services, 0.5 for standard services, 0.25 for lightweight

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: "com.docker.compose.service,com.docker.compose.image"

services:
  # Flag-dir permission init (#1031). The menu persists admin settings — game.json
  # / user.json and the #819 kill-switch (agent.json interventions_allowed) — by
  # writing the bind-mounted flag dir via lib/flag_config_writer.py. The menu image
  # runs nonroot (uid 65532, chainguard); the host flag files are owned by the
  # checkout/deploy user (mode 644), so a nonroot write fails with PermissionError
  # and the change is silently lost. This one-shot root sidecar makes the shared
  # flag dir group-owned by the menu's nonroot gid (65532) and group-writable, so
  # the nonroot menu can persist writes WITHOUT the menu itself running as root.
  #
  # Why this and not a named volume: flagd, the agent and the menu all bind-mount
  # the SAME host ./services/flagd dir (single source of truth, #959). A named
  # volume would diverge from the host repo files. Why group, not chown owner:
  # leaves the host user as file OWNER (still editable on a dev checkout), only the
  # group is reassigned. flagd and the agent run as root, so this is invisible to
  # them; it does not touch the agent's mount or relax the agent.json invariant
  # (that rests on code-level path guards, not filesystem perms — see
  # docs/OWNERSHIP_MODEL.md §2).
  #
  # Only the menu `depends_on` this step — intentionally NOT flagd or the agent.
  # flagd only READS the flag files, and the agent runs as root and writes in
  # place (O_TRUNC), so group perms are irrelevant to both. Adding a dependency
  # there would needlessly serialize their startup behind this chmod for no gain.
  # No `networks:` — this only chmods a local bind mount and needs no network.
  flag-dir-init:
    image: busybox:1.37.0
    container_name: joustmania-flag-dir-init
    user: "0"  # must be root to chgrp/chmod the bind-mounted host files
    command:
      - "sh"
      - "-c"
      - "chgrp -R 65532 /etc/flagd && chmod -R g+w /etc/flagd && find /etc/flagd -type d -exec chmod g+s {} +"
    volumes:
      - ./services/flagd:/etc/flagd
    restart: "no"
    logging: *default-logging

  # flagd for feature flag evaluation
  flagd:
    image: ghcr.io/open-feature/flagd:v0.16.0
    container_name: joustmania-flagd
    command:
      - "start"
      - "--uri"
      - "file:/etc/flagd/system.json"
      - "--uri"
      - "file:/etc/flagd/controller.json"
      - "--uri"
      - "file:/etc/flagd/observability.json"
      - "--uri"
      - "file:/etc/flagd/game.json"
      - "--uri"
      - "file:/etc/flagd/user.json"
      - "--uri"
      - "file:/etc/flagd/agent.json"
      - "--uri"
      - "file:/etc/flagd/interventions.json"
      - "--uri"
      - "file:/etc/flagd/rollout.json"
      - "--metrics-exporter"
      - "otel"
      - "--otel-collector-uri"
      - "otel-collector:4317"
    environment:
      - OTEL_SERVICE_NAME=flagd
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
    volumes:
      # Mount directory (not individual files) so inotify detects edits
      # (editors do atomic save via temp+rename, which changes the inode)
      - ./services/flagd:/etc/flagd
    ports:
      # Sync port exposed on host for pairing-daemon (network_mode: host)
      - "8015:8015"
    expose:
      - "8013"  # flagd evaluation port (gRPC)
      - "8014"  # flagd management port (Prometheus metrics)
      - "8015"  # flagd sync port (for in-process evaluation)
    networks:
      - joustmania
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'
    logging: *default-logging

  # Jaeger for distributed tracing UI
  jaeger:
    image: jaegertracing/jaeger:2.19.0
    container_name: joustmania-jaeger
    user: "0"  # Run as root to avoid permission issues with badger volume (default UID 10001 can't write)
    # All ports exposed only within Docker network (envoy proxies to it)
    expose:
      - "16686"  # Jaeger UI
      - "4317"   # OTLP gRPC (used by otel-collector)
      - "4318"   # OTLP HTTP
    volumes:
      - ./services/jaeger/config.yaml:/etc/jaeger/config.yaml:ro
      - jaeger-data:/badger
    command: ["--config", "/etc/jaeger/config.yaml"]
    networks:
      - joustmania
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:16686/jaeger/" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: '0.5'
    logging: *default-logging

  # OpenTelemetry Collector (custom build: contrib + dtbizevents exporter)
  otel-collector:
    image: ghcr.io/watchmejoustmyflags/joustmania/otel-collector:${IMAGE_TAG:-latest}
    build:
      context: images/otel-collector
      dockerfile: Dockerfile
    container_name: joustmania-otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
    volumes:
      - ./services/otel-collector/config.yaml:/etc/otel-collector-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Host filesystem mounts for hostmetrics receiver (replaces node-exporter)
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
      - /:/hostfs/root:ro
      # Host identity for resourcedetection processor (real hostname + machine-id)
      - /etc/hostname:/etc/hostname:ro
      - /etc/machine-id:/etc/machine-id:ro
    ports:
      # OTLP gRPC - exposed for host-network containers (pairing-daemon)
      - "4317:4317"
      # Only expose Prometheus metrics for external monitoring
      - "8889:8889"   # Prometheus metrics (Jaeger uses 8888)
    depends_on:
      jaeger:
        condition: service_healthy
      loki:
        condition: service_healthy
      victoria-metrics:
        condition: service_healthy
    networks:
      - joustmania
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    logging: *default-logging

  # Controller Manager Service
  controller-manager:
    image: ghcr.io/watchmejoustmyflags/joustmania/controller-manager-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/controller_manager/Dockerfile
    container_name: joustmania-controller-manager
    privileged: true
    # Required for controller hot-plug: run in host PID namespace to see new devices
    pid: "host"
    volumes:
      # D-Bus socket for BlueZ communication
      - /var/run/dbus:/var/run/dbus:ro
      # Bluetooth device info (read-only, pairing handled by host daemon)
      - /var/lib/bluetooth:/var/lib/bluetooth:ro
      # Mount devtmpfs with rslave for hot-plug device visibility
      - /dev:/dev:rslave
      # Persist controller names across restarts
      - controller-names:/app/data
    networks:
      - joustmania
    # Ports exposed only within Docker network (no host binding)
    expose:
      - "50052"  # gRPC service
      - "8000"   # Prometheus metrics
    environment:
      - CONTROLLER_NAMES_FILE=/app/data/controller_names.txt
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/var/run/dbus/system_bus_socket
      - OTEL_SERVICE_NAME=controller-manager-service
      - OTEL_SERVICE_NAMESPACE=infrastructure
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
      - SERVICE_VERSION=${IMAGE_TAG:-dev}
      # Rust HID service for canary controller I/O backend
      - RUST_HID_HOST=rust-hid
      - RUST_HID_PORT=50058
      # Python HID service for canary controller I/O backend
      - PYTHON_HID_HOST=python-hid
      - PYTHON_HID_PORT=50059
    depends_on:
      flagd:
        condition: service_started
      rust-hid:
        condition: service_healthy
      python-hid:
        condition: service_healthy
    restart: unless-stopped
    # Healthcheck defined in Dockerfile (uses grpc_health_probe)
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '3.0'
    logging: *default-logging

  # Pairing Daemon - USB controller pairing and Bluetooth monitoring
  pairing-daemon:
    image: ghcr.io/watchmejoustmyflags/joustmania/pairing-daemon-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/pairing_daemon/Dockerfile
    container_name: joustmania-pairing-daemon
    privileged: true
    pid: "host"
    # Host network required for AF_BLUETOOTH HCI sockets (hciconfig/hcitool).
    # D-Bus works in bridge mode, but raw HCI needs the host network namespace.
    network_mode: host
    volumes:
      # D-Bus socket for BlueZ communication (RW for adapter power-cycle)
      - /var/run/dbus:/var/run/dbus
      # Bluetooth device info (RW for pairing)
      - /var/lib/bluetooth:/var/lib/bluetooth
      # USB device access
      - /dev:/dev:rslave
    # Port 8002 (health) binds directly on host via network_mode: host
    environment:
      - METRICS_PORT=8002
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/var/run/dbus/system_bus_socket
      - OTEL_SERVICE_NAME=pairing-daemon
      - OTEL_SERVICE_NAMESPACE=infrastructure
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
      - SERVICE_VERSION=${IMAGE_TAG:-dev}
      # localhost because network_mode:host can't use Docker DNS
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317
      # flagd for runtime-tunable intervals (localhost because network_mode:host)
      - FLAGD_HOST=localhost
      - FLAGD_PORT=8015
      # Rust HID service (localhost because network_mode:host connects via exposed port)
      - RUST_HID_HOST=localhost
      - RUST_HID_PORT=50058
    depends_on:
      rust-hid:
        condition: service_healthy
    restart: unless-stopped
    # Healthcheck defined in Dockerfile (uses HTTP /healthz)

  # Rust HID Service - PS Move HID operations via gRPC
  rust-hid:
    image: ghcr.io/watchmejoustmyflags/joustmania/rust-hid:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/rust-hid/Dockerfile
    container_name: joustmania-rust-hid
    privileged: true
    pid: "host"
    volumes:
      - /dev:/dev:rslave
    networks:
      - joustmania
    ports:
      # Exposed to host for pairing-daemon (network_mode: host)
      - "50058:50058"
    environment:
      - OTEL_SERVICE_NAME=rust-hid
      - OTEL_SERVICE_NAMESPACE=infrastructure
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
      - SERVICE_VERSION=${IMAGE_TAG:-dev}
      - RUST_LOG=info
    restart: unless-stopped
    # Healthcheck defined in Dockerfile (uses grpc_health_probe)
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.25'
    logging: *default-logging

  # Python HID Service - PS Move HID operations via gRPC (Python implementation)
  python-hid:
    image: ghcr.io/watchmejoustmyflags/joustmania/python-hid:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/python_hid/Dockerfile
    container_name: joustmania-python-hid
    privileged: true
    pid: "host"
    volumes:
      - /dev:/dev:rslave
    networks:
      - joustmania
    expose:
      - "50059"  # gRPC service
    environment:
      - OTEL_SERVICE_NAME=python-hid
      - OTEL_SERVICE_NAMESPACE=infrastructure
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
      - SERVICE_VERSION=${IMAGE_TAG:-dev}
    restart: unless-stopped
    # Healthcheck defined in Dockerfile (uses grpc_health_probe)
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.5'
    logging: *default-logging

  # Game Coordinator Service
  game-coordinator:
    image: ghcr.io/watchmejoustmyflags/joustmania/game-coordinator-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/game_coordinator/Dockerfile
    container_name: joustmania-game-coordinator
    # Ports exposed only within Docker network (no host binding)
    expose:
      - "50053"  # gRPC service
      - "8000"   # Prometheus metrics (Phase 38)
    environment:
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME_GAME_COORDINATOR:-game-coordinator-service}
      - OTEL_SERVICE_NAMESPACE=joustmania
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
      - SERVICE_VERSION=${IMAGE_TAG:-dev}
    depends_on:
      flagd:
        condition: service_started
    networks:
      - joustmania
    restart: unless-stopped
    stop_grace_period: 10s
    # Healthcheck defined in Dockerfile (uses grpc_health_probe)
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '1.0'
    logging: *default-logging

  # Menu Service
  menu:
    image: ghcr.io/watchmejoustmyflags/joustmania/menu-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/menu/Dockerfile
    container_name: joustmania-menu
    # Ports exposed only within Docker network (no host binding)
    expose:
      - "50054"  # gRPC service
    environment:
      - OTEL_SERVICE_NAME=menu-service
      - OTEL_SERVICE_NAMESPACE=joustmania
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
      - SERVICE_VERSION=${IMAGE_TAG:-dev}
      # Phase 60: Audio service connection
      - AUDIO_HOST=audio
      - AUDIO_PORT=50056
      - FLAGD_HOST=flagd
      - FLAGD_PORT=8015
      # Single source of truth for the active flag directory (#959/#966). The
      # menu resolves which host flag file to write as $FLAGD_FLAG_DIR/<domain>.json
      # (lib/flagd_paths.py) — the same plain join flagd, the agent writers, and
      # the integration tests use, so writers and the served files never desync.
      - FLAGD_FLAG_DIR=/etc/flagd
    volumes:
      - ./services/flagd:/etc/flagd
    depends_on:
      flagd:
        condition: service_started
      # Wait for the flag dir to be made group-writable so the nonroot menu can
      # persist admin settings on first start (#1031).
      flag-dir-init:
        condition: service_completed_successfully
    networks:
      - joustmania
    restart: unless-stopped
    # Healthcheck defined in Dockerfile (uses grpc_health_probe)
    deploy:
      resources:
        limits:
          memory: 192m
          cpus: '0.5'
    logging: *default-logging

  # Audio Service
  audio:
    image: ghcr.io/watchmejoustmyflags/joustmania/audio-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/audio/Dockerfile
    container_name: joustmania-audio
    # Sound device access for real audio output
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - "29"  # host 'audio' group GID — required for ALSA device access
    volumes:
      - ./services/audio/assets:/app/services/audio/assets:ro  # Audio files (read-only)
    # Ports exposed only within Docker network (no host binding)
    expose:
      - "50056"  # gRPC service
    environment:
      - OTEL_SERVICE_NAME=audio-service
      - OTEL_SERVICE_NAMESPACE=joustmania
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
      - SERVICE_VERSION=${IMAGE_TAG:-dev}
      - FLAGD_HOST=flagd
      - FLAGD_PORT=8015
      - ALSA_CARD=auto  # Auto-detect sound card; set to card number (e.g. "1") to override
    depends_on:
      flagd:
        condition: service_started
    networks:
      - joustmania
    restart: unless-stopped
    # Healthcheck defined in Dockerfile (uses grpc_health_probe)
    # Memory: largest OGG (classical.ogg 5.7MB) decodes to ~60MB PCM + resampler
    # buffers (~20MB) + Python/gRPC/OTEL baseline (~60MB) + headroom for
    # concurrent track transitions = ~320MB peak
    deploy:
      resources:
        limits:
          memory: 320m
          cpus: '0.5'
    logging: *default-logging

  # VictoriaMetrics for high-frequency metrics storage (replaces Prometheus for storage)
  # Receives metrics via Prometheus remote write protocol from OTEL Collector
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.144.0
    container_name: joustmania-victoria-metrics
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=7d"
      - "-httpListenAddr=:8428"
    # Port exposed only within Docker network (envoy proxies to it)
    expose:
      - "8428"
    volumes:
      - victoria-metrics-data:/victoria-metrics-data
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8428/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Note: VictoriaMetrics image is scratch-based, no shell/wget for healthcheck
    # Service starts quickly and exposes /health endpoint for manual verification
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    logging: *default-logging

  # Prometheus for metrics collection (Phase 38) - kept for alerting rules
  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: joustmania-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.external-url=/prometheus/'
      - '--web.route-prefix=/'
    # Port exposed only within Docker network (envoy proxies to it)
    expose:
      - "9090"
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./services/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: '0.5'
    logging: *default-logging

  # Grafana for metrics visualization (Phase 38)
  grafana:
    image: grafana/grafana:13.0.2
    container_name: joustmania-grafana
    # Port exposed only within Docker network (envoy proxies to it)
    expose:
      - "3000"
    environment: []
    volumes:
      - ./services/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      victoria-metrics:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    logging: *default-logging

  # Loki for log aggregation with 24h retention
  loki:
    image: grafana/loki:3.7.2
    container_name: joustmania-loki
    user: "0"  # Run as root to avoid permission issues with volume
    # Port exposed only within Docker network (envoy proxies to it)
    expose:
      - "3100"
    volumes:
      - ./services/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/tmp/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      # Loki 3.6+ images are distroless (no wget/shell); use the built-in health subcommand
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 192m
          cpus: '0.5'
    logging: *default-logging

  # Connect-Web Proxy (gRPC to Connect protocol translation)
  # No dependencies - proxy handles connection failures gracefully
  connect-proxy:
    image: ghcr.io/watchmejoustmyflags/joustmania/connect-proxy:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/connect-proxy/Dockerfile
    container_name: joustmania-connect-proxy
    # Port exposed only within Docker network (envoy proxies to it)
    expose:
      - "8080"
    environment:
      - CONTROLLER_MANAGER_SERVICE=controller-manager:50052
      - GAME_COORDINATOR_SERVICE=game-coordinator:50053
      - MENU_SERVICE=menu:50054
      - FLAGD_CONFIG_PATH=/etc/flagd/flags/controller.json
      - OTEL_SERVICE_NAME=connect-proxy
      - OTEL_SERVICE_NAMESPACE=infrastructure
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
      - SERVICE_VERSION=${IMAGE_TAG:-dev}
    volumes:
      - ./services/flagd:/etc/flagd/flags
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 1s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.5'
    logging: *default-logging

  # Agent (OTLP fan-out target — receives traces/metrics pushed by the collector)
  # No dependencies and no depends_on FROM the collector: the collector must run
  # standalone even when the agent is down (best-effort delivery).
  agent:
    image: ghcr.io/watchmejoustmyflags/joustmania/agent:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    container_name: joustmania-agent
    # Port exposed only within Docker network (the collector pushes OTLP to it)
    expose:
      - "4317"
    environment:
      - AGENT_LISTEN_ADDR=:4317
      - AGENT_HEALTH_ADDR=:13134
      # OpenFeature control layer. The Go agent uses the flagd RPC resolver
      # (gRPC evaluation port 8013), not the in-process sync port 8015.
      - FLAGD_HOST=flagd
      - FLAGD_PORT=8013
      # Single source of truth for the active flag directory (#959). The agent
      # resolves which host flag file to write as $FLAGD_FLAG_DIR/<domain>.json
      # (services/agent/flagset) — the same plain join flagd and the integration
      # tests use, so writers and the served files never desync. The per-domain
      # *_FLAG_PATH overrides below still win when set (explicit escape hatch).
      - FLAGD_FLAG_DIR=/etc/flagd
      # Action sink (#730): when enabled the agent applies decisions by rewriting
      # the flagd interventions file in place (bind-mounted below). Default off so
      # the scaffold stays inert.
      - AGENT_INTERVENTIONS_ENABLED=${AGENT_INTERVENTIONS_ENABLED:-false}
      - INTERVENTIONS_FLAG_PATH=/etc/flagd/interventions.json
      # Demo/verification only: emit a synthetic `noop` decision (full audit
      # trace) every ~5s. Off by default; never for production sessions. With the
      # default interventions_allowed variant probe decisions are blocked
      # (not_allowed) — flip that flag to the `probe` variant to dispatch. See
      # docs/agent-act-runbook.md.
      - AGENT_PROBE_DECISIONS=${AGENT_PROBE_DECISIONS:-}
      # Progressive rollout expansion (#734): when enabled the agent advances the
      # Bluetooth backend rollout controller-by-controller by rewriting the flagd
      # rollout file in place (current_controller_count). Default off → the loop
      # decides and spans expansions but does not apply them (dry-run).
      - AGENT_ROLLOUT_ENABLED=${AGENT_ROLLOUT_ENABLED:-false}
      - ROLLOUT_FLAG_PATH=/etc/flagd/rollout.json
      # Auto-remediation / rollback (#736): on fitness failure during an active
      # rollout the agent rolls current_controller_count back to "none", gated on
      # the remediation_allowed flag (rollout flagd domain, read from rollout.json).
      # After a rollback, re-expansion is suppressed for the cooldown below.
      - AGENT_ROLLOUT_COOLDOWN_SECONDS=${AGENT_ROLLOUT_COOLDOWN_SECONDS:-30}
      # Experiment cohort loop (#982/#991). Opt-in master switch + the optional
      # env-seeded single experiment. Declared here (with default-off / empty
      # defaults) so a host `export` or `.env` value reaches the container — a
      # plain `up` keeps the framework inert (the M8 dry-run finding, #999). The
      # promotion path stays gated by the `code_improvement` flags + kill-switch.
      - AGENT_EXPERIMENTS_ENABLED=${AGENT_EXPERIMENTS_ENABLED:-false}
      - AGENT_EXPERIMENT_TICK_SECONDS=${AGENT_EXPERIMENT_TICK_SECONDS:-30}
      - AGENT_EXPERIMENT_SEED_FLAG=${AGENT_EXPERIMENT_SEED_FLAG:-}
      - AGENT_EXPERIMENT_SEED_VALUE=${AGENT_EXPERIMENT_SEED_VALUE:-}
      - AGENT_EXPERIMENT_SEED_OBJECTIVE=${AGENT_EXPERIMENT_SEED_OBJECTIVE:-}
      - AGENT_EXPERIMENT_SEED_TARGET_N=${AGENT_EXPERIMENT_SEED_TARGET_N:-}
      - AGENT_EXPERIMENT_SEED_HYPOTHESIS=${AGENT_EXPERIMENT_SEED_HYPOTHESIS:-}
      # Heuristic dynamic declarer (#995): the agent autonomously picks which
      # game.json flag to experiment on. Default-OFF; subordinate to
      # AGENT_EXPERIMENTS_ENABLED + the agent.json kill-switch. Passthrough so the
      # feature is reachable in the deployed stack (#1041).
      - AGENT_EXPERIMENT_DYNAMIC_ENABLED=${AGENT_EXPERIMENT_DYNAMIC_ENABLED:-false}
      - AGENT_EXPERIMENT_DYNAMIC_MAX_CONCURRENT=${AGENT_EXPERIMENT_DYNAMIC_MAX_CONCURRENT:-}
      - AGENT_EXPERIMENT_DYNAMIC_CANDIDATES=${AGENT_EXPERIMENT_DYNAMIC_CANDIDATES:-}
      - AGENT_EXPERIMENT_DYNAMIC_DENYLIST=${AGENT_EXPERIMENT_DYNAMIC_DENYLIST:-}
      - AGENT_EXPERIMENT_DYNAMIC_TARGET_N=${AGENT_EXPERIMENT_DYNAMIC_TARGET_N:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OTEL_SERVICE_NAME=agent
      - OTEL_SERVICE_NAMESPACE=infrastructure
      # Self-telemetry (#724): the agent's own decision-audit spans flow to Jaeger.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=host.name=${JOUSTMANIA_HOST:-joustmania}
      - SERVICE_VERSION=${IMAGE_TAG:-dev}
    volumes:
      # The agent is the sole writer of the interventions flag file; flagd watches
      # it and the game coordinator converges on its contents (#730). In-place
      # rewrite (no temp+rename) avoids EBUSY on this bind mount.
      - ./services/flagd:/etc/flagd
      # Durable experiment journal (#1023, completes #831). The agent writes the
      # per-experiment intent/events.jsonl/summary.json under AGENT_EXPERIMENT_DIR
      # (default /var/lib/joustmania/agent/experiments; see
      # services/agent/experiment/journal/store.go). #831 made the journal survive
      # a process restart; this named volume makes it survive container recreation
      # (`docker compose down`, image upgrade) too, so a long-running cohort's
      # accumulated per-arm samples + verdict state are not silently wiped.
      - agent-experiments:/var/lib/joustmania/agent/experiments
    depends_on:
      flagd:
        condition: service_started
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:13134/healthz"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 1s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.5'
    logging: *default-logging

  # Dashboard (Real-time controller visualization SPA)
  dashboard:
    image: ghcr.io/watchmejoustmyflags/joustmania/dashboard:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    container_name: joustmania-dashboard
    # Port exposed only within Docker network (envoy proxies to it)
    expose:
      - "8080"
    networks:
      - joustmania
    restart: unless-stopped
    # Healthcheck defined in Dockerfile
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.25'
    logging: *default-logging

  # Envoy - Main entry point (reverse proxy)
  # No dependencies - envoy uses STRICT_DNS and handles unavailable backends with 503
  envoy:
    image: envoyproxy/envoy:v1.38.1
    container_name: joustmania-envoy
    ports:
      - "80:80"  # Main entry point (all services proxied through envoy)
    volumes:
      - ./services/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      - joustmania
    restart: unless-stopped
    # No healthcheck - distroless image has no shell utilities
    # Envoy starts quickly and handles backend unavailability gracefully
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.5'
    logging: *default-logging

networks:
  joustmania:
    driver: bridge
    name: joustmania-network

volumes:
  prometheus-data:
  victoria-metrics-data:
  grafana-data:
  loki-data:
  jaeger-data:
  controller-names:
  # Durable experiment journal for the agent (#1023). See the agent service's
  # volumes block for the rationale and the matching AGENT_EXPERIMENT_DIR path.
  agent-experiments:
