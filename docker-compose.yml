# JoustMania Docker Compose Configuration
#
# Quick Start (pull from GHCR - no build needed):
#   docker compose pull  # Pull all images from GHCR
#   docker compose up -d # Start all services
#   # Or: make up-pull
#
# Quick Start (local build):
#   make builders        # Build base images once (~15min on Pi)
#   make up              # Build and start all services
#
# Base config defaults to bluetooth mode (real hardware).
# For mock mode (testing): make up-mock
#
# Environment Variables (can be set in shell or .env file):
# - IMAGE_TAG: Image tag to use [default: latest]
# - LOG_LEVEL: Logging level for all services (DEBUG, INFO, WARNING, ERROR) [default: INFO]
#
# Controller backend is configured via the "controller_backend" flag in flagd (performance domain).
#
# Notes:
# - All images default to ghcr.io/watchmejoustmyflags/joustmania registry
# - Use IMAGE_TAG to specify version (e.g., IMAGE_TAG=main docker compose up)
# - Local builds tag images with GHCR names for consistency
#
# Resource Limits:
# - Total memory budget ~3.2GB, designed for 4GB Raspberry Pi (leaving ~800MB for OS)
# - CPU limits: 1.0 for real-time app services, 0.5 for standard services, 0.25 for lightweight

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Redis for pub/sub messaging
  redis:
    image: redis:7.4-alpine
    container_name: joustmania-redis
    # Port 6379 exposed only within Docker network (no host binding)
    expose:
      - "6379"
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 1s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'
    logging: *default-logging

  # flagd for feature flag evaluation
  flagd:
    image: ghcr.io/open-feature/flagd:v0.13.2
    container_name: joustmania-flagd
    command:
      - "start"
      - "--uri"
      - "file:/etc/flagd/performance.json"
      - "--uri"
      - "file:/etc/flagd/game_settings.json"
      - "--uri"
      - "file:/etc/flagd/user_preferences.json"
      - "--metrics-exporter"
      - "otel"
      - "--otel-collector-uri"
      - "otel-collector:4317"
    environment:
      - OTEL_SERVICE_NAME=flagd
    volumes:
      # Mount directory (not individual files) so inotify detects edits
      # (editors do atomic save via temp+rename, which changes the inode)
      - ./services/flagd:/etc/flagd
    ports:
      # Sync port exposed on host for pairing-daemon (network_mode: host)
      - "8015:8015"
    expose:
      - "8013"  # flagd evaluation port (gRPC)
      - "8014"  # flagd management port (Prometheus metrics)
      - "8015"  # flagd sync port (for in-process evaluation)
    networks:
      - joustmania
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'
    logging: *default-logging

  # flagd-ui for read-only feature flag browsing
  flagd-ui:
    image: ghcr.io/justinabrahms/flagd-ui:latest
    container_name: joustmania-flagd-ui
    environment:
      - FLAGD_HOST=flagd
      - FLAGD_PORT=8015
    # Port exposed only within Docker network (envoy proxies to it)
    expose:
      - "3000"
    depends_on:
      flagd:
        condition: service_started
    networks:
      - joustmania
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'
    logging: *default-logging

  # Jaeger for distributed tracing UI
  jaeger:
    image: jaegertracing/jaeger:2.14.1
    container_name: joustmania-jaeger
    user: "0"  # Run as root to avoid permission issues with badger volume (default UID 10001 can't write)
    # All ports exposed only within Docker network (envoy proxies to it)
    expose:
      - "16686"  # Jaeger UI
      - "4317"   # OTLP gRPC (used by otel-collector)
      - "4318"   # OTLP HTTP
    volumes:
      - ./services/jaeger/config.yaml:/etc/jaeger/config.yaml:ro
      - jaeger-data:/badger
    command: ["--config", "/etc/jaeger/config.yaml"]
    networks:
      - joustmania
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:16686" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: '0.5'
    logging: *default-logging

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.147.0
    container_name: joustmania-otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./services/otel-collector/config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      # OTLP gRPC - exposed for host-network containers (pairing-daemon)
      - "4317:4317"
      # Only expose Prometheus metrics for external monitoring
      - "8889:8889"   # Prometheus metrics (Jaeger uses 8888)
    depends_on:
      jaeger:
        condition: service_healthy
      loki:
        condition: service_healthy
      victoria-metrics:
        condition: service_healthy
      grafana-live-publisher:
        condition: service_healthy
    networks:
      - joustmania
    # No healthcheck: otel-collector-contrib is a scratch image with no shell/wget/curl.
    # The health_check extension exposes :13133 but we can't probe it from within the container.
    # No healthcheck: distroless image has no shell/wget/curl
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    logging: *default-logging
  # Pyroscope for continuous profiling (CPU flame graphs)
  # Only starts with: docker compose --profile profiling up
  pyroscope:
    image: grafana/pyroscope:latest
    container_name: joustmania-pyroscope
    profiles:
      - profiling
    expose:
      - "4040"
    networks:
      - joustmania
    volumes:
      - pyroscope-data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    logging: *default-logging

  # Controller Manager Service
  controller-manager:
    image: ghcr.io/watchmejoustmyflags/joustmania/controller-manager-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/controller_manager/Dockerfile
      args:
        BUILDER_IMAGE: ${BUILDER_IMAGE:-ghcr.io/watchmejoustmyflags/joustmania/builder:latest}
    container_name: joustmania-controller-manager
    privileged: true
    # Required for controller hot-plug: run in host PID namespace to see new devices
    pid: "host"
    volumes:
      # D-Bus socket for BlueZ communication
      - /var/run/dbus:/var/run/dbus:ro
      # Bluetooth device info (read-only, pairing handled by host daemon)
      - /var/lib/bluetooth:/var/lib/bluetooth:ro
      # Mount devtmpfs with rslave for hot-plug device visibility
      - /dev:/dev:rslave
      # Persist controller names across restarts
      - controller-names:/app/data
    networks:
      - joustmania
    # Ports exposed only within Docker network (no host binding)
    expose:
      - "50052"  # gRPC service
      - "8000"   # Prometheus metrics
    environment:
      - CONTROLLER_NAMES_FILE=/app/data/controller_names.txt
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/var/run/dbus/system_bus_socket
      - OTEL_SERVICE_NAME=controller-manager-service
      - OTEL_SERVICE_NAMESPACE=infrastructure
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
      # Rust HID service for canary controller I/O backend
      - RUST_HID_HOST=rust-hid
      - RUST_HID_PORT=50058
    depends_on:
      redis:
        condition: service_healthy
      flagd:
        condition: service_started
      rust-hid:
        condition: service_healthy
    restart: unless-stopped
    # Healthcheck defined in Dockerfile (uses grpc_health_probe)
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '3.0'
    logging: *default-logging

  # Pairing Daemon - USB controller pairing and Bluetooth monitoring
  pairing-daemon:
    image: ghcr.io/watchmejoustmyflags/joustmania/pairing-daemon-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/pairing_daemon/Dockerfile
      args:
        BUILDER_IMAGE: ${BUILDER_IMAGE:-ghcr.io/watchmejoustmyflags/joustmania/builder:latest}
    container_name: joustmania-pairing-daemon
    privileged: true
    pid: "host"
    # Host network required for AF_BLUETOOTH HCI sockets (hciconfig/hcitool).
    # D-Bus works in bridge mode, but raw HCI needs the host network namespace.
    network_mode: host
    volumes:
      # D-Bus socket for BlueZ communication (RW for adapter power-cycle)
      - /var/run/dbus:/var/run/dbus
      # Bluetooth device info (RW for pairing)
      - /var/lib/bluetooth:/var/lib/bluetooth
      # USB device access
      - /dev:/dev:rslave
    # Port 8002 (health) binds directly on host via network_mode: host
    environment:
      - METRICS_PORT=8002
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/var/run/dbus/system_bus_socket
      - OTEL_SERVICE_NAME=pairing-daemon
      - OTEL_SERVICE_NAMESPACE=infrastructure
      # localhost because network_mode:host can't use Docker DNS
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317
      # flagd for runtime-tunable intervals (localhost because network_mode:host)
      - FLAGD_HOST=localhost
      - FLAGD_PORT=8015
      # Rust HID service (localhost because network_mode:host connects via exposed port)
      - RUST_HID_HOST=localhost
      - RUST_HID_PORT=50058
    depends_on:
      rust-hid:
        condition: service_healthy
    restart: unless-stopped
    # Healthcheck defined in Dockerfile (uses HTTP /healthz)

  # Rust HID Service - PS Move HID operations via gRPC
  rust-hid:
    image: ghcr.io/watchmejoustmyflags/joustmania/rust-hid:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/rust-hid/Dockerfile
    container_name: joustmania-rust-hid
    privileged: true
    pid: "host"
    volumes:
      - /dev:/dev:rslave
    networks:
      - joustmania
    ports:
      # Exposed to host for pairing-daemon (network_mode: host)
      - "50058:50058"
    environment:
      - OTEL_SERVICE_NAME=rust-hid
      - OTEL_SERVICE_NAMESPACE=infrastructure
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - RUST_LOG=info
    restart: unless-stopped
    # Healthcheck defined in Dockerfile (uses grpc_health_probe)
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.25'
    logging: *default-logging

  # Game Coordinator Service
  game-coordinator:
    image: ghcr.io/watchmejoustmyflags/joustmania/game-coordinator-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/game_coordinator/Dockerfile
      args:
        BUILDER_IMAGE: ${BUILDER_IMAGE:-ghcr.io/watchmejoustmyflags/joustmania/builder:latest}
    container_name: joustmania-game-coordinator
    # Ports exposed only within Docker network (no host binding)
    expose:
      - "50053"  # gRPC service
      - "8000"   # Prometheus metrics (Phase 38)
    environment:
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME_GAME_COORDINATOR:-game-coordinator-service}
      - OTEL_SERVICE_NAMESPACE=joustmania
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
    depends_on:
      redis:
        condition: service_healthy
      flagd:
        condition: service_started
    networks:
      - joustmania
    restart: unless-stopped
    stop_grace_period: 10s
    # Healthcheck defined in Dockerfile (uses grpc_health_probe)
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '1.0'
    logging: *default-logging

  # Menu Service
  menu:
    image: ghcr.io/watchmejoustmyflags/joustmania/menu-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/menu/Dockerfile
      args:
        BUILDER_IMAGE: ${BUILDER_IMAGE:-ghcr.io/watchmejoustmyflags/joustmania/builder:latest}
    container_name: joustmania-menu
    # Ports exposed only within Docker network (no host binding)
    expose:
      - "50054"  # gRPC service
    environment:
      - OTEL_SERVICE_NAME=menu-service
      - OTEL_SERVICE_NAMESPACE=joustmania
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
      # Phase 60: Audio service connection
      - AUDIO_HOST=audio
      - AUDIO_PORT=50056
      - FLAGD_HOST=flagd
      - FLAGD_PORT=8015
      - FLAGD_DIR=/etc/flagd
    volumes:
      - ./services/flagd:/etc/flagd
    depends_on:
      redis:
        condition: service_healthy
      flagd:
        condition: service_started
    networks:
      - joustmania
    restart: unless-stopped
    # Healthcheck defined in Dockerfile (uses grpc_health_probe)
    deploy:
      resources:
        limits:
          memory: 192m
          cpus: '0.5'
    logging: *default-logging

  # Audio Service
  audio:
    image: ghcr.io/watchmejoustmyflags/joustmania/audio-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/audio/Dockerfile
      args:
        BUILDER_IMAGE: ${BUILDER_IMAGE:-ghcr.io/watchmejoustmyflags/joustmania/builder:latest}
    container_name: joustmania-audio
    # Sound device access for real audio output
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - "29"  # host 'audio' group GID — required for ALSA device access
    volumes:
      - ./services/audio/assets:/app/services/audio/assets:ro  # Audio files (read-only)
    # Ports exposed only within Docker network (no host binding)
    expose:
      - "50056"  # gRPC service
    environment:
      - OTEL_SERVICE_NAME=audio-service
      - OTEL_SERVICE_NAMESPACE=joustmania
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
      - FLAGD_HOST=flagd
      - FLAGD_PORT=8015
      - ALSA_CARD=auto  # Auto-detect sound card; set to card number (e.g. "1") to override
    depends_on:
      redis:
        condition: service_healthy
      flagd:
        condition: service_started
    networks:
      - joustmania
    restart: unless-stopped
    # Healthcheck defined in Dockerfile (uses grpc_health_probe)
    deploy:
      resources:
        limits:
          memory: 192m
          cpus: '0.5'
    logging: *default-logging

  # VictoriaMetrics for high-frequency metrics storage (replaces Prometheus for storage)
  # Receives metrics via Prometheus remote write protocol from OTEL Collector
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.96.0
    container_name: joustmania-victoria-metrics
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=7d"
      - "-httpListenAddr=:8428"
    # Port exposed only within Docker network (envoy proxies to it)
    expose:
      - "8428"
    volumes:
      - victoria-metrics-data:/victoria-metrics-data
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8428/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Note: VictoriaMetrics image is scratch-based, no shell/wget for healthcheck
    # Service starts quickly and exposes /health endpoint for manual verification
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    logging: *default-logging

  # Prometheus for metrics collection (Phase 38) - kept for alerting rules
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: joustmania-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.external-url=/prometheus/'
      - '--web.route-prefix=/'
    # Port exposed only within Docker network (envoy proxies to it)
    expose:
      - "9090"
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./services/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: '0.5'
    logging: *default-logging

  # Node Exporter for host metrics (CPU, memory, disk, temperature)
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: joustmania-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      # Disable slow/unnecessary collectors for Raspberry Pi
      - '--no-collector.arp'
      - '--no-collector.bcache'
      - '--no-collector.bonding'
      - '--no-collector.btrfs'
      - '--no-collector.conntrack'
      - '--no-collector.edac'
      - '--no-collector.entropy'
      - '--no-collector.fibrechannel'
      - '--no-collector.infiniband'
      - '--no-collector.ipvs'
      - '--no-collector.mdadm'
      - '--no-collector.nfs'
      - '--no-collector.nfsd'
      - '--no-collector.nvme'
      - '--no-collector.powersupplyclass'
      - '--no-collector.pressure'
      - '--no-collector.rapl'
      - '--no-collector.schedstat'
      - '--no-collector.softnet'
      - '--no-collector.tapestats'
      - '--no-collector.textfile'
      - '--no-collector.timex'
      - '--no-collector.xfs'
      - '--no-collector.zfs'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9100/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.25'
    logging: *default-logging

  # Grafana for metrics visualization (Phase 38)
  grafana:
    image: grafana/grafana:10.2.3
    container_name: joustmania-grafana
    # Port exposed only within Docker network (envoy proxies to it)
    expose:
      - "3000"
    environment: []
    volumes:
      - ./services/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      victoria-metrics:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    logging: *default-logging

  # Loki for log aggregation with 24h retention
  loki:
    image: grafana/loki:3.4.3
    container_name: joustmania-loki
    user: "0"  # Run as root to avoid permission issues with volume
    # Port exposed only within Docker network (envoy proxies to it)
    expose:
      - "3100"
    volumes:
      - ./services/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/tmp/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      test:  ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 192m
          cpus: '0.5'
    logging: *default-logging

  # Grafana Live Publisher - OTLP to Grafana Live WebSocket bridge
  # Receives OTLP metrics from OTEL Collector and pushes to Grafana Live for real-time streaming
  grafana-live-publisher:
    image: ghcr.io/watchmejoustmyflags/joustmania/grafana-live-publisher:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/grafana-live-publisher/Dockerfile
    container_name: joustmania-grafana-live-publisher
    # Port exposed only within Docker network
    expose:
      - "4318"  # OTLP HTTP receiver
    environment:
      - GRAFANA_URL=http://grafana:3000/grafana
      - GRAFANA_PUSH_PATH=joustmania-accel
      - GRAFANA_USER=admin
      - GRAFANA_PASSWORD=admin
    depends_on:
      grafana:
        condition: service_healthy
    networks:
      - joustmania
    restart: unless-stopped
    # Healthcheck defined in Dockerfile
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'
    logging: *default-logging

  # Connect-Web Proxy (gRPC to Connect protocol translation)
  # No dependencies - proxy handles connection failures gracefully
  connect-proxy:
    image: ghcr.io/watchmejoustmyflags/joustmania/connect-proxy:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/connect-proxy/Dockerfile
    container_name: joustmania-connect-proxy
    # Port exposed only within Docker network (envoy proxies to it)
    expose:
      - "8080"
    environment:
      - CONTROLLER_MANAGER_SERVICE=controller-manager:50052
      - GAME_COORDINATOR_SERVICE=game-coordinator:50053
      - MENU_SERVICE=menu:50054
      - FLAGD_CONFIG_PATH=/etc/flagd/flags/performance.json
    volumes:
      - ./services/flagd:/etc/flagd/flags
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 1s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.5'
    logging: *default-logging

  # Dashboard (Real-time controller visualization SPA)
  dashboard:
    image: ghcr.io/watchmejoustmyflags/joustmania/dashboard:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    container_name: joustmania-dashboard
    # Port exposed only within Docker network (envoy proxies to it)
    expose:
      - "8080"
    networks:
      - joustmania
    restart: unless-stopped
    # Healthcheck defined in Dockerfile
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.25'
    logging: *default-logging

  # Envoy - Main entry point (reverse proxy)
  # No dependencies - envoy uses STRICT_DNS and handles unavailable backends with 503
  envoy:
    image: envoyproxy/envoy:v1.31.10
    container_name: joustmania-envoy
    ports:
      - "80:80"  # Main entry point (all services proxied through envoy)
    volumes:
      - ./services/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      - joustmania
    restart: unless-stopped
    # No healthcheck - distroless image has no shell utilities
    # Envoy starts quickly and handles backend unavailability gracefully
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.5'
    logging: *default-logging

networks:
  joustmania:
    driver: bridge
    name: joustmania-network

volumes:
  redis-data:
  prometheus-data:
  victoria-metrics-data:
  grafana-data:
  loki-data:
  jaeger-data:
  controller-names:
  pyroscope-data:
