# CI Override - No hardware dependencies
#
# Use this for CI/testing environments without sound hardware:
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up
#
# Or with the override file for port exposures:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.ci.yml up
#
# Profiles: compose MERGES a service's `profiles` list with the base one, it
# does not replace it. The hardware services below therefore start only under
# the profiles listed here plus any profile the base file already gives them
# (python-hid keeps its base `python-hid` profile). With no profile active,
# none of them, nor the agent, dashboard, connect-proxy or envoy, starts.
#
# Note: We must fully redefine services to clear device/volume lists
# (docker-compose merges arrays, doesn't replace them)

services:
  # Audio Service - No sound device required (play_audio=off via CI flagd override)
  # Fully redefined to remove devices list
  audio:
    # Clear devices list from base compose (requires docker compose v2.24.0+)
    devices: !reset []
    volumes:
      - ./services/audio/assets:/app/services/audio/assets:ro
    environment: !override
      OTEL_SERVICE_NAME: audio-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      FLAGD_HOST: flagd
      FLAGD_PORT: "8015"

  # Flag service: load the CI flag directory (play_audio=off, backend=mock) as
  # the read-only baseline flagd serves through it (#959: one directory), and
  # keep its admin state in a CI-only state file (re-review N4: one state file
  # per stack, so a test or demo stack never reads the production admin values).
  # !override replaces the base mount list, so the registry mount (#1838) is repeated here.
  flag-service:
    volumes: !override
      - ./services/flagd/ci:/etc/flagd:ro
      - ./services/flag-service/registry.yaml:/etc/flag-service/registry.yaml:ro
      - flag-service-state:/var/lib/flag-service
    environment:
      - FLAG_SERVICE_STATE_FILE=/var/lib/flag-service/admin-ci.json

  # Controller Manager - Mock mode via flagd (backend=mock in ci/controller.json)
  controller-manager:
    # Clear devices and volumes from base compose (requires docker compose v2.24.0+)
    devices: !reset []
    volumes: !reset []
    privileged: false
    # Override depends_on to drop rust-hid and python-hid: they are profile-gated
    # below (no HID hardware in CI) and the mock backend needs neither
    depends_on: !override
      flagd:
        condition: service_started
    environment: !override
      OTEL_SERVICE_NAME: controller-manager-service
      OTEL_SERVICE_NAMESPACE: infrastructure
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

  # Game Coordinator - Countdown and rainbow timing now controlled via flagd game domain (Issue #464)
  game-coordinator:
    environment: !override
      OTEL_SERVICE_NAME: game-coordinator-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # Game lifecycle reported to the flag service (FR-135, #1410)
      FLAG_SERVICE_URL: http://flag-service:8070
      FLAG_SERVICE_INSTANCE: game-coordinator  # the !override above drops the base env
      # The total concurrent-games ceiling is pinned for the integration suite
      # (#779) via the `max_concurrent_games` game flag (defaultVariant "four" in
      # services/flagd/ci/game.json), NOT an env var (#1215). Since #1018 (option
      # b) the coordinator runs shadow games CONCURRENTLY: the single-game guard
      # is REAL-only and shadows run up to `max_shadow_games` (default 4), bounded
      # by this total ceiling. The CI flag pins 4 to keep multiple live sessions on
      # one stack deterministic for the concurrent/shadow-isolation tests.

  # Pairing Daemon - Requires hardware, excluded from CI
  pairing-daemon:
    profiles:
      - hardware  # Only starts when 'hardware' profile is active

  # Rust HID Service - Requires hardware, excluded from CI
  rust-hid:
    profiles:
      - hardware  # Only starts when 'hardware' profile is active

  # Python HID Service - Requires hardware, excluded from CI
  python-hid:
    profiles:
      # Merged with the base `python-hid` profile: starts under 'hardware' OR
      # 'python-hid' (opt-in since #1371), never with no profile active
      - hardware

  # Agent - OTLP fan-out target, not required for integration tests
  agent:
    profiles:
      - agent  # Only starts when 'agent' profile is active

  # Connect-proxy - Not required for integration tests
  connect-proxy:
    profiles:
      - dashboard  # Only starts when 'dashboard' profile is active

  # Dashboard - Not required for integration tests
  dashboard:
    profiles:
      - dashboard  # Only starts when 'dashboard' profile is active

  # Envoy - Not required for integration tests (its default route is the dashboard)
  envoy:
    profiles:
      - dashboard  # Only starts when 'dashboard' profile is active
