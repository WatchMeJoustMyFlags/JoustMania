# JoustMania Observability Stack
#
# Independent compose project for monitoring, tracing, and logging.
# Runs alongside the game stack on a shared Docker network.
#
# Usage:
#   docker compose -f docker-compose.observability.yml up -d
#
# Requires the shared network to exist:
#   docker network inspect joustmania-network >/dev/null 2>&1 || docker network create joustmania-network
#
# Project name is set to 'joustmania-obs' to avoid conflicts with the game stack.

name: joustmania-obs

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Jaeger for distributed tracing UI
  jaeger:
    image: jaegertracing/jaeger:2.14.1
    container_name: joustmania-jaeger
    user: "0"  # Run as root to avoid permission issues with badger volume (default UID 10001 can't write)
    # All ports exposed only within Docker network (envoy proxies to it)
    expose:
      - "16686"  # Jaeger UI
      - "4317"   # OTLP gRPC (used by otel-collector)
      - "4318"   # OTLP HTTP
    volumes:
      - ./services/jaeger/config.yaml:/etc/jaeger/config.yaml:ro
      - jaeger-data:/badger
    command: ["--config", "/etc/jaeger/config.yaml"]
    networks:
      - joustmania
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:16686" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: '0.5'
    logging: *default-logging

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: joustmania-otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./services/otel-collector/config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      # OTLP gRPC - exposed for host-network containers (pairing-daemon)
      - "4317:4317"
      # Only expose Prometheus metrics for external monitoring
      - "8889:8889"   # Prometheus metrics (Jaeger uses 8888)
    depends_on:
      jaeger:
        condition: service_healthy
      loki:
        condition: service_healthy
      victoria-metrics:
        condition: service_healthy
      grafana-live-publisher:
        condition: service_healthy
    networks:
      - joustmania
    # No healthcheck: distroless image has no shell/wget/curl
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    logging: *default-logging

  # Pyroscope for continuous profiling (CPU flame graphs)
  # Only starts with: docker compose -f docker-compose.observability.yml --profile profiling up
  pyroscope:
    image: grafana/pyroscope:latest
    container_name: joustmania-pyroscope
    profiles:
      - profiling
    expose:
      - "4040"
    networks:
      - joustmania
    volumes:
      - pyroscope-data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    logging: *default-logging

  # VictoriaMetrics for high-frequency metrics storage (replaces Prometheus for storage)
  # Receives metrics via Prometheus remote write protocol from OTEL Collector
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.96.0
    container_name: joustmania-victoria-metrics
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=7d"
      - "-httpListenAddr=:8428"
    # Port exposed only within Docker network (envoy proxies to it)
    expose:
      - "8428"
    volumes:
      - victoria-metrics-data:/victoria-metrics-data
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8428/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    logging: *default-logging

  # Prometheus for metrics collection - kept for alerting rules
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: joustmania-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.external-url=/prometheus/'
      - '--web.route-prefix=/'
    # Port exposed only within Docker network (envoy proxies to it)
    expose:
      - "9090"
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./services/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: '0.5'
    logging: *default-logging

  # Node Exporter for host metrics (CPU, memory, disk, temperature)
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: joustmania-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      # Disable slow/unnecessary collectors for Raspberry Pi
      - '--no-collector.arp'
      - '--no-collector.bcache'
      - '--no-collector.bonding'
      - '--no-collector.btrfs'
      - '--no-collector.conntrack'
      - '--no-collector.edac'
      - '--no-collector.entropy'
      - '--no-collector.fibrechannel'
      - '--no-collector.infiniband'
      - '--no-collector.ipvs'
      - '--no-collector.mdadm'
      - '--no-collector.nfs'
      - '--no-collector.nfsd'
      - '--no-collector.nvme'
      - '--no-collector.powersupplyclass'
      - '--no-collector.pressure'
      - '--no-collector.rapl'
      - '--no-collector.schedstat'
      - '--no-collector.softnet'
      - '--no-collector.tapestats'
      - '--no-collector.textfile'
      - '--no-collector.timex'
      - '--no-collector.xfs'
      - '--no-collector.zfs'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9100/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.25'
    logging: *default-logging

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:10.2.3
    container_name: joustmania-grafana
    # Port exposed only within Docker network (envoy proxies to it)
    expose:
      - "3000"
    environment: []
    volumes:
      - ./services/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      victoria-metrics:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    logging: *default-logging

  # Loki for log aggregation with 24h retention
  loki:
    image: grafana/loki:2.9.3
    container_name: joustmania-loki
    user: "0"  # Run as root to avoid permission issues with volume
    # Port exposed only within Docker network (envoy proxies to it)
    expose:
      - "3100"
    volumes:
      - ./services/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/tmp/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      test:  ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 192m
          cpus: '0.5'
    logging: *default-logging

  # Grafana Live Publisher - OTLP to Grafana Live WebSocket bridge
  # Receives OTLP metrics from OTEL Collector and pushes to Grafana Live for real-time streaming
  grafana-live-publisher:
    image: ghcr.io/watchmejoustmyflags/joustmania/grafana-live-publisher:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/grafana-live-publisher/Dockerfile
    container_name: joustmania-grafana-live-publisher
    # Port exposed only within Docker network
    expose:
      - "4318"  # OTLP HTTP receiver
    environment:
      - GRAFANA_URL=http://grafana:3000/grafana
      - GRAFANA_PUSH_PATH=joustmania-accel
      - GRAFANA_USER=admin
      - GRAFANA_PASSWORD=admin
    depends_on:
      grafana:
        condition: service_healthy
    networks:
      - joustmania
    restart: unless-stopped
    # Healthcheck defined in Dockerfile
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'
    logging: *default-logging

networks:
  joustmania:
    external: true
    name: joustmania-network

volumes:
  prometheus-data:
  victoria-metrics-data:
  grafana-data:
  loki-data:
  jaeger-data:
  pyroscope-data:
