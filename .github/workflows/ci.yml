name: CI

# Path-filtered, change-aware pipeline (#902).
#
# A single `changes` job runs dorny/paths-filter once; every downstream job is
# gated at the JOB level (skipped jobs consume zero runners). Docker image
# builds use dynamic matrices so only changed images build.
#
# Escape hatches:
#   - push to main / merge_group / workflow_dispatch: all check jobs run (full
#     SonarCloud coverage on push); the e2e job follows `e2e_required` below
#   - `ci-full` PR label or workflow_dispatch: additionally forces ALL image builds.
#     ci.yml does NOT trigger on `labeled` (#1527): GitHub takes required checks
#     from the newest run of this workflow on the head SHA, so a label-only run
#     without "CI Complete" would block the PR. Adding `ci-full` later re-runs
#     the latest real run through ci-full-label.yml; the `changes` job reads
#     the labels live, so that re-run is a full one.
#
# Merge queue (#1555): `merge_group` runs test the queued commit (main plus the
# PRs ahead of it) like a main push: every check job runs (run_all_checks),
# including the e2e job and service-tests, while image builds stay
# path-filtered against merge_group.base_sha and build amd64 only without
# pushing (as on a PR). SonarCloud and retag-skipped do not run in the queue.
# "CI Complete" reports on the merge-group head, which is the required check.
#
# The full-stack e2e job (#1583) runs only where `changes.e2e_required` is true:
#   merge_group                       unless the queued group is docs-only
#                                     (`non_docs` exactly 'false'); an empty or
#                                     unknown output still runs e2e.
#                                     merge_group.base_sha is the PARENT of
#                                     the group commit (the previous queue
#                                     entry's temporary head), so the diff
#                                     covers this entry's PR only: a docs PR
#                                     queued behind a code PR skips e2e. That
#                                     is safe because the main ruleset's merge
#                                     queue uses grouping_strategy ALLGREEN:
#                                     every entry must pass its own checks,
#                                     and the code PR ahead runs its own e2e.
#                                     If the grouping strategy changes from
#                                     ALLGREEN (e.g. HEADGREEN), revisit this
#                                     skip.
#   workflow_dispatch                 always
#   pull_request                      with `ci-full`, or a non-docs diff touching
#                                     a risky path (`e2e_paths` filter)
#   push to main                      never: the queue already ran them on this
#                                     exact commit; builds/publish/retag no
#                                     longer wait for integration-test there
# A skipped e2e job is fine for CI Complete unless e2e_required was true.
#
# Release contract: release.yml tag-images retags IMAGE:<sha> -> IMAGE:<version>
# for all 13 release images, so every main push must produce a :<sha> tag for
# every image. Images skipped by the path filter get a seconds-long manifest
# retag from :main instead (retag-skipped job).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Main branch - used for :latest Docker tag
  MAIN_BRANCH: main

concurrency:
  # PRs group by number (new pushes cancel stale runs); pushes group by SHA so
  # main runs never cancel each other mid-image-push. Label events start no
  # run of this workflow (#1527), so they can never cancel the real run.
  # Merge-queue runs group per merge-group ref (gh-readonly-queue/main/pr-N-<sha>)
  # and never cancel: the queue itself drops runs of invalidated groups.
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Single source of truth for "what changed" — all other jobs gate on these
  # outputs at the job level so skipped jobs consume zero runners.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists the PR files
      issues: read         # the force step reads the PR labels live (#1527)
    outputs:
      lib: ${{ steps.f.outputs.lib }}
      rust: ${{ steps.f.outputs.rust }}
      agent: ${{ steps.f.outputs.agent }}
      agent_tests: ${{ steps.f.outputs.agent_tests }}
      flag_service: ${{ steps.f.outputs.flag_service }}
      flag_service_tests: ${{ steps.f.outputs.flag_service_tests }}
      dockerfiles: ${{ steps.f.outputs.dockerfiles }}
      specs: ${{ steps.f.outputs.specs }}
      spec_code: ${{ steps.f.outputs.spec_code }}
      proto_pkg: ${{ steps.f.outputs.proto_pkg }}
      script_tests: ${{ steps.f.outputs.script_tests }}
      integration_deps: ${{ steps.f.outputs.integration_deps }}
      telemetry: ${{ steps.f.outputs.telemetry }}
      flagd_contract: ${{ steps.f.outputs.flagd_contract }}
      service_tests: ${{ steps.f.outputs.service_tests }}
      dashboard_tests: ${{ steps.f.outputs.dashboard_tests }}
      connect_proxy_tests: ${{ steps.f.outputs.connect_proxy_tests }}
      non_docs: ${{ steps.nondocs.outputs.non_docs }}
      # #1583: run the e2e job (merge_group unless the whole group is
      # docs-only, workflow_dispatch, ci-full, or a non-docs PR touching an
      # `e2e_paths` file)
      e2e_required: ${{ steps.force.outputs.e2e }}
      # #1583: e2e builds EVERY stack image at HEAD (full path) instead of
      # pulling :latest and overlaying source (fast path). True on merge_group
      # and workflow_dispatch (when e2e runs). The queue is the only e2e gate
      # before main, so it must test the PR's code for connect-proxy, rust-hid, the dashboard
      # too), with ci-full, or when integration_deps changed. Only an explicit
      # 'false' takes the fast path, so an empty output fails toward the build.
      e2e_full_build: ${{ steps.force.outputs.e2e_full_build }}
      # force_full: ALL image builds + checks (workflow_dispatch / ci-full label)
      # run_all_checks: all test/lint jobs, but builds stay path-filtered (main push)
      force_full: ${{ steps.force.outputs.full }}
      run_all_checks: ${{ steps.force.outputs.checks }}
      python_services_matrix: ${{ steps.matrices.outputs.python_services }}
      docker_build_matrix: ${{ steps.matrices.outputs.docker_build }}
      docker_extra_matrix: ${{ steps.matrices.outputs.docker_extra }}
      retag_matrix: ${{ steps.matrices.outputs.retag }}
    steps:
      - uses: actions/checkout@v6

      # The shared_python anchor is the single source of truth for inputs that
      # every Python service image COPYs (see services/*/Dockerfile). If a
      # Dockerfile starts copying a new shared directory, add it HERE.
      # Pinned to a full commit SHA (SonarCloud security hotspot remediation)
      # Merge queue (#1555): diff the queued commit against the main it was
      # built on. Empty on other events (paths-filter then picks the PR files
      # or, on a push, the commits since `before`).
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: f
        with:
          base: ${{ github.event.merge_group.base_sha }}
          ref: ${{ github.event.merge_group.head_sha }}
          filters: |
            shared_python: &shared_python
              - 'pyproject.toml'
              # #2266: images install their dependencies from the lock
              - 'uv.lock'
              - 'proto/**'
              - 'lib/**'
            lib:
              - 'lib/**'
              - 'proto/**'
              # lib/tests read the shipped flag files and pinned sources
              # (test_flagd_ci_drift.py, test_shipped_safety_defaults.py)
              - 'services/flagd/**'
              - 'services/agent/experiment/targeting.go'
              - 'tests/service/test_experiment_shadow_isolation.py'
              # lib/tests/test_demo_driver.py runs tools/demo/demo_driver.py (FR-092, #1670)
              - 'tools/demo/**'
            rust:
              - 'services/rust-hid/**'
              - 'proto/psmove_hid.proto'
            agent:
              - 'services/agent/**'
            # Agent tests that read shipped flag files (e.g.
            # rollout_fixture_test.go, decide_bounds_test.go) and the flag
            # service's registry (the experiment catalog, #1415). Kept separate
            # from `agent` so a flag edit does not rebuild the agent image.
            agent_tests:
              - 'services/agent/**'
              - 'services/flagd/**'
              - 'services/flag-service/registry.yaml'
            # Flag service (epic #1407): the image ...
            flag_service:
              - 'services/flag-service/**'
            # ... and its tests, which also read the baseline flag files and
            # docs/specs/flags.md (registry sync test).
            flag_service_tests:
              - 'services/flag-service/**'
              - 'services/flagd/**'
              - 'docs/specs/flags.md'
            dockerfiles:
              - '**/Dockerfile'
              - '.hadolint.yaml'
            # Spec gate (#1263): `specs` runs the AIUP spec lint, `spec_code`
            # runs the spec-touched check on PRs.
            specs:
              - 'docs/**'
              - '.github/**'
              - 'scripts/aiup/**'
            spec_code:
              - 'services/**'
              - 'lib/**'
              - 'proto/**'
            # Shell tests for the talk/agent operator scripts (#1366): the
            # scripts, their tests, and the inputs they read.
            script_tests:
              - 'scripts/*.sh'
              - 'scripts/*.py'
              - 'scripts/setup/**'
              # safe-merge.sh / local-gates.sh (scripts/tests covers them)
              - 'scripts/ci/**'
              - 'setup.sh'
              - 'scripts/talk-baseline.json'
              # the script tests' fake flag service enforces the real registry
              - 'services/flag-service/registry.yaml'
              - 'scripts/tests/**'
              - 'services/flagd/**'
              - 'services/agent/actions/writer.go'
              # make lint runs the same scripts locally; keep the two in step
              - 'Makefile'
              # self-test edits to this job
              - '.github/workflows/ci.yml'
            # Telemetry contract (#1357) and infra config tests (#1365):
            # producers, agent extractors, dashboards, envoy and the
            # collector config, plus the compose file (image tags, host ports).
            # The job also runs `make specs-check` (#1280): docs/specs/generated/
            # comes from the metric scans (services, lib, scripts/ and tools/
            # consumers), proto/*.proto, services/flagd/** and docs/specs/notes/.
            # A docs-only edit to the spec runs only this ~30 s job; `non_docs`
            # still skips integration.
            telemetry:
              - 'services/**'
              - 'lib/**'
              - 'proto/**'
              - 'tests/contract/**'
              - 'tests/integration/setup_guard.py'  # tested by tests/contract (#1649)
              - 'docker-compose.yml'
              - 'docker-compose.ci.yml'  # CI overlay env vars (env-var coverage contract, #1535)
              - 'docs/specs/**'
              - 'scripts/**'
              - 'tools/**'
              - 'Makefile'
            # flagd contract tier (#1422): a single real flagd on services/flagd/ci,
            # the flag readers/writers it checks (coordinator, agent, lib), the
            # flagd image tag and --uri list (compose).
            flagd_contract:
              - 'services/flagd/**'
              - 'services/agent/**'
              - 'lib/**'
              - 'services/game_coordinator/**'
              - 'tests/contract/**'
              - 'docker-compose.yml'
              # make test-contract-flagd (deps pins) and this job
              - 'Makefile'
              - '.github/workflows/ci.yml'
            # Service tier (T2, #1524): the services it runs from source, the
            # flag plane (flag service, flagd image tag, CI baseline) and the
            # harness plus the integration helpers it reuses.
            service_tests:
              - 'lib/**'
              - 'proto/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'services/flagd/**'
              - 'services/flag-service/**'
              - 'services/game_coordinator/**'
              - 'services/controller_manager/**'
              - 'services/menu/**'
              - 'services/agent/**'
              - 'services/rust-hid/**'
              - 'tests/service/**'
              - 'tests/integration/fake_openai/**'
              - 'tests/contract/flagd_harness.py'
              - 'tests/contract/flagd_rpc_retry.py'  # imported by the service-tier probes (#2184)
              - 'tests/contract/infra_config.py'
              - 'tests/integration/helpers.py'
              - 'tests/integration/flag_service.py'
              - 'docker-compose.yml'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            # #1491: dashboard tsc + vitest and connect-proxy vet + test, run
            # without waiting for integration-test (the image builds that also
            # compile them are gated on it). The dashboard's src/gen is
            # hand-written from proto/, so a proto change runs it too.
            dashboard_tests:
              - 'services/dashboard/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
            connect_proxy_tests:
              - 'services/connect-proxy/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
            proto_pkg:
              - 'proto/**'
              # #1801: committed agent Go stubs (Validate agent Go stubs step)
              - 'services/agent/gen/**'
              - '**/pyproject.toml'
              - 'tools/ci-proto/**'
              - 'scripts/ci/**'
            controller_manager:
              - *shared_python
              - 'services/controller_manager/**'
            game_coordinator:
              - *shared_python
              - 'services/game_coordinator/**'
            menu:
              - *shared_python
              - 'services/menu/**'
            audio:
              - *shared_python
              - 'services/audio/**'
            pairing_daemon:
              - *shared_python
              - 'services/pairing_daemon/**'
            python_hid:
              - *shared_python
              - 'services/python_hid/**'
            # #2050: the operator pad (profile-gated image, docker-build-extra like python-hid)
            operator_pad:
              - *shared_python
              - 'services/operator_pad/**'
            connect_proxy:
              # Dockerfile buf-generates Go stubs from proto/ at build time
              - 'services/connect-proxy/**'
              - 'proto/**'
            dashboard:
              - 'services/dashboard/**'
            otel_collector:
              - 'images/otel-collector/**'
            # #1583: risky for the full stack, so a PR touching them runs the
            # e2e before the queue does: compose files, any image
            # definition, the e2e suite itself (conftest, helpers), and the
            # collector / envoy config the stack mounts.
            e2e_paths:
              - 'docker-compose*.yml'
              - '**/Dockerfile*'
              - 'tests/integration/**'
              - 'services/otel-collector/**'
              - 'images/otel-collector/**'
              - 'services/envoy/**'
              - 'services/flagd/**'
              - '.github/workflows/ci.yml'
            integration_deps:
              # root pyproject.toml is a deps-fingerprint input
              # (scripts/ci/deps-fingerprint.sh), so it must force fresh images
              - 'pyproject.toml'
              - 'uv.lock'
              - 'services/*/Dockerfile'
              - 'services/*/pyproject.toml'
              - 'lib/pyproject.toml'
              - 'proto/pyproject.toml'
              - 'images/**'
              - 'docker-compose.yml'
              - 'docker-compose.ci.yml'

      # #1422: `non_docs` is true when the PR changes ANY file outside the
      # docs-only set below. It gates Integration Tests, so a PR touching only
      # docs/** (incl. docs/test_cases), Markdown anywhere, or the spec-lint
      # baseline skips the ~10-16 min docker-compose suite. Written as a
      # negation ("everything except docs") rather than a list of code paths,
      # so a new code directory runs integration by default. Separate step
      # because `predicate-quantifier: every` applies to every filter in a
      # step and would break the OR-style filters above.
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: nondocs
        with:
          base: ${{ github.event.merge_group.base_sha }}
          ref: ${{ github.event.merge_group.head_sha }}
          predicate-quantifier: 'every'
          filters: |
            non_docs:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!scripts/aiup/spec-lint-baseline.json'

      # #1527: the PR labels are read LIVE, not from the event payload. Adding
      # `ci-full` re-runs this run (ci-full-label.yml), and a re-run keeps the
      # original payload, which predates the label. The payload is the fallback
      # when the API read fails.
      - name: Determine force-full / run-all-checks
        id: force
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PAYLOAD_CI_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full') }}
          E2E_PATHS: ${{ steps.f.outputs.e2e_paths }}
          NON_DOCS: ${{ steps.nondocs.outputs.non_docs }}
          INTEGRATION_DEPS: ${{ steps.f.outputs.integration_deps }}
        run: |
          ci_full=false
          if [ -n "$PR_NUMBER" ]; then
            if labels=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels" --jq '.[].name'); then
              grep -qx 'ci-full' <<<"$labels" && ci_full=true
            else
              echo "::warning::could not read the PR labels; using the event payload"
              ci_full="$PAYLOAD_CI_FULL"
            fi
          fi
          full="${{ github.event_name == 'workflow_dispatch' }}"
          # merge_group gates main exactly like a push to main (#1555)
          checks="${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'merge_group' }}"
          # #1583: the e2e job gates the merge queue; on PRs only with ci-full or
          # a non-docs diff touching a risky path; never on a push to main.
          # Merge queue: skipped only for a docs-only group (NON_DOCS exactly
          # 'false'; empty/unknown fails closed to running e2e). base_sha is
          # the parent of the group commit, so the diff is this entry's PR
          # only; safe under the ALLGREEN grouping strategy (the PR ahead ran
          # its own e2e). Revisit if the strategy changes (e.g. HEADGREEN).
          e2e="${{ github.event_name == 'workflow_dispatch' }}"
          if [ "${{ github.event_name }}" = merge_group ] && [ "$NON_DOCS" != false ]; then
            e2e=true
          fi
          if [ "$ci_full" = true ]; then full=true; checks=true; e2e=true; fi
          if [ "${{ github.event_name }}" = pull_request ] && [ "$E2E_PATHS" = true ] && [ "$NON_DOCS" = true ]; then
            e2e=true
          fi
          # e2e full path (every image built at HEAD): merge_group and dispatch
          # always; elsewhere with ci-full or a deps change (fast path otherwise).
          e2e_full_build="${{ github.event_name == 'merge_group' }}"
          if [ "$full" = true ] || [ "$INTEGRATION_DEPS" = true ]; then e2e_full_build=true; fi
          echo "ci-full label: $ci_full -> force_full=$full run_all_checks=$checks e2e_required=$e2e e2e_full_build=$e2e_full_build"
          {
            echo "full=$full"
            echo "checks=$checks"
            echo "e2e=$e2e"
            echo "e2e_full_build=$e2e_full_build"
          } >> "$GITHUB_OUTPUT"

      - name: Build dynamic matrices
        id: matrices
        env:
          FORCE_FULL: ${{ steps.force.outputs.full }}
          RUN_ALL_CHECKS: ${{ steps.force.outputs.checks }}
          CH_CONTROLLER_MANAGER: ${{ steps.f.outputs.controller_manager }}
          CH_GAME_COORDINATOR: ${{ steps.f.outputs.game_coordinator }}
          CH_MENU: ${{ steps.f.outputs.menu }}
          CH_AUDIO: ${{ steps.f.outputs.audio }}
          CH_PAIRING_DAEMON: ${{ steps.f.outputs.pairing_daemon }}
          CH_PYTHON_HID: ${{ steps.f.outputs.python_hid }}
          CH_OPERATOR_PAD: ${{ steps.f.outputs.operator_pad }}
          CH_CONNECT_PROXY: ${{ steps.f.outputs.connect_proxy }}
          CH_AGENT: ${{ steps.f.outputs.agent }}
          CH_FLAG_SERVICE: ${{ steps.f.outputs.flag_service }}
          CH_DASHBOARD: ${{ steps.f.outputs.dashboard }}
          CH_RUST: ${{ steps.f.outputs.rust }}
          CH_OTEL_COLLECTOR: ${{ steps.f.outputs.otel_collector }}
        run: |
          set -euo pipefail

          json_array() {
            if [ "$#" -eq 0 ]; then echo -n '[]'; else printf '%s\n' "$@" | jq -R . | jq -sc .; fi
          }

          # service-checks matrix: changed Python services; all 7 on main push /
          # force (keeps full SonarCloud coverage on main)
          checks=()
          for s in controller_manager game_coordinator menu audio pairing_daemon python_hid operator_pad; do
            key="CH_${s^^}"
            if [ "$RUN_ALL_CHECKS" = "true" ] || [ "${!key}" = "true" ]; then checks+=("$s"); fi
          done
          echo "python_services=$(json_array "${checks[@]}")" >> "$GITHUB_OUTPUT"

          # docker-build matrix: 5 Python service images, path-filtered (force_full
          # only via workflow_dispatch / ci-full label — NOT plain main pushes;
          # unchanged images are retagged instead, see retag-skipped)
          build=()
          for s in controller_manager game_coordinator menu audio pairing_daemon; do
            key="CH_${s^^}"
            if [ "$FORCE_FULL" = "true" ] || [ "${!key}" = "true" ]; then build+=("$s"); fi
          done
          echo "docker_build=$(json_array "${build[@]}")" >> "$GITHUB_OUTPUT"

          # docker-build-extra matrix: non-shared-Python images as include objects
          extra=()
          maybe_extra() {
            if [ "$1" = "true" ] || [ "$FORCE_FULL" = "true" ]; then
              extra+=("$(jq -nc --arg s "$2" --arg d "$3" --arg c "$4" --arg i "$5" \
                '{service:$s, dockerfile:$d, context:$c, image_name:$i}')")
            fi
          }
          maybe_extra "$CH_CONNECT_PROXY"  connect-proxy  services/connect-proxy/Dockerfile . connect-proxy
          maybe_extra "$CH_AGENT"          agent          services/agent/Dockerfile         . agent
          maybe_extra "$CH_FLAG_SERVICE"   flag-service   services/flag-service/Dockerfile  . flag-service
          maybe_extra "$CH_DASHBOARD"      dashboard      services/dashboard/Dockerfile     . dashboard
          maybe_extra "$CH_RUST"           rust-hid       services/rust-hid/Dockerfile      . rust-hid
          maybe_extra "$CH_PYTHON_HID"     python-hid     services/python_hid/Dockerfile    . python-hid
          maybe_extra "$CH_OPERATOR_PAD"   operator-pad   services/operator_pad/Dockerfile  . operator-pad
          maybe_extra "$CH_OTEL_COLLECTOR" otel-collector images/otel-collector/Dockerfile  images/otel-collector otel-collector
          if [ "${#extra[@]}" -eq 0 ]; then
            echo "docker_extra=[]" >> "$GITHUB_OUTPUT"
          else
            echo "docker_extra=$(printf '%s\n' "${extra[@]}" | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi

          # retag matrix: the 13 release.yml images NOT built this run — on main
          # pushes they still need a :<sha> tag for release tagging
          retag=()
          maybe_retag() {
            if [ "$FORCE_FULL" != "true" ] && [ "$1" != "true" ]; then retag+=("$2"); fi
          }
          maybe_retag "$CH_CONTROLLER_MANAGER" controller-manager-service
          maybe_retag "$CH_GAME_COORDINATOR"   game-coordinator-service
          maybe_retag "$CH_MENU"               menu-service
          maybe_retag "$CH_AUDIO"              audio-service
          maybe_retag "$CH_PAIRING_DAEMON"     pairing-daemon-service
          maybe_retag "$CH_CONNECT_PROXY"      connect-proxy
          maybe_retag "$CH_DASHBOARD"          dashboard
          maybe_retag "$CH_RUST"               rust-hid
          maybe_retag "$CH_PYTHON_HID"         python-hid
          maybe_retag "$CH_OPERATOR_PAD"       operator-pad
          maybe_retag "$CH_OTEL_COLLECTOR"     otel-collector
          maybe_retag "$CH_FLAG_SERVICE"       flag-service
          maybe_retag "$CH_AGENT"              agent
          echo "retag=$(json_array "${retag[@]}")" >> "$GITHUB_OUTPUT"

  # Build and test shared packages (proto, lib)
  lib-tests:
    name: Lib Unit Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.lib == 'true' || needs.changes.outputs.run_all_checks == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Build proto package
        run: |
          cd proto
          uv sync
          uv build

      - name: Lint proto
        run: |
          cd proto
          uv tool run ruff check .

      - name: Build lib package
        run: |
          cd lib
          uv sync --extra test
          uv build

      - name: Lint lib
        run: |
          cd lib
          uv tool run ruff check .

      - name: Run lib unit tests with coverage
        run: |
          cd lib
          uv run pytest tests/ -v --tb=short \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing
          # Fix paths in coverage.xml for SonarCloud
          sed -i 's|<source>.*</source>|<source>.</source>|g' coverage.xml
          sed -i 's|filename="|filename="lib/|g' coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lib
          path: lib/coverage.xml
          retention-days: 1

  # Per-service checks: lint/typecheck/unit tests for CHANGED services only
  # (all 6 on main pushes so SonarCloud gets full coverage there)
  service-checks:
    name: ${{ matrix.service }} checks
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.python_services_matrix != '[]'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.python_services_matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0

      # Install system dependencies for services with native Python packages
      - name: Install system dependencies
        if: matrix.service == 'controller_manager' || matrix.service == 'audio' || matrix.service == 'pairing_daemon'
        run: |
          sudo apt-get update
          # controller_manager/pairing_daemon: dbus-python needs libdbus-1-dev and libglib2.0-dev
          # audio: pyalsaaudio needs libasound2-dev
          sudo apt-get install -y libdbus-1-dev libglib2.0-dev libasound2-dev pkg-config

      - name: Lint
        run: |
          uv tool install ruff
          cd services/${{ matrix.service }}
          ruff check .

      # CRN RNG-isolation gate (#1003): every random draw in a game mode MUST go
      # through the per-instance self._rng (random.Random(seed)) so seed-matched
      # paired shadow games stay deterministic and concurrent games never corrupt
      # each other via global random state. A reintroduced module-global call
      # (random.shuffle/sample/choice/uniform/...) silently breaks both CRN
      # pairing and concurrency isolation, so fail the build on any bare
      # `random.<lowercase>` under games/. `random.Random` (the per-instance ctor)
      # is allowed; comments (full-line OR trailing-inline) are ignored.
      - name: CRN RNG-isolation gate
        if: matrix.service == 'game_coordinator'
        run: |
          # grep emits `path:line:content`; strip any trailing `#` comment from the
          # content portion (preserving the path:line: prefix) BEFORE matching, so a
          # `random.` inside a comment — full-line or trailing-inline — never trips
          # the gate, while a real bare `random.<lowercase>` call still does (#1032).
          if grep -rnE '(^|[^._a-zA-Z0-9])random\.[a-z]' services/game_coordinator/games --include='*.py' \
               | sed -E 's/(^[^:]+:[0-9]+:[^#]*)#.*$/\1/' \
               | grep -E '(^|[^._a-zA-Z0-9])random\.[a-z]'; then
            echo "::error::Bare module-global random.* call found under services/game_coordinator/games."
            echo "Use the per-instance self._rng (random.Random(seed)) instead — see #1003."
            exit 1
          fi
          echo "OK: no module-global random.* calls under games/"

      # #2107 (UC-031 BR-007, C-050): the voice catalog, voice_manifest.json and
      # the committed generated voice files agree. No TTS, no network; a
      # generator-only change is covered by tests/contract/test_gen_voice.py.
      - name: Voice catalog check
        if: matrix.service == 'audio'
        run: make voice-check

      # C-046 (#2266): images install from uv.lock, so a pyproject range change
      # without a relock must fail here instead of testing a fresh resolve.
      - name: Lock is current
        run: uv lock --check

      - name: Typecheck
        continue-on-error: true  # ty is immature, don't block CI
        run: |
          uv tool install ty
          cd services/${{ matrix.service }}
          uv sync
          ty check .

      - name: Unit tests with coverage
        run: |
          cd services/${{ matrix.service }}
          uv sync --extra test
          # Run with coverage, using repo-relative paths for SonarCloud
          uv run pytest tests/ -v --tb=short \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing
          # Fix paths in coverage.xml for SonarCloud:
          # 1. Set source to "." (repo root) - SonarCloud resolves paths relative to sonar.sources
          # 2. Prefix filenames with services/<name>/ to match repo structure
          sed -i 's|<source>.*</source>|<source>.</source>|g' coverage.xml
          sed -i 's|filename="|filename="services/${{ matrix.service }}/|g' coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml
          retention-days: 1

  # Rust service checks (cargo fmt --check, test, clippy)
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.run_all_checks == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libhidapi-dev libudev-dev pkg-config

      # Version is pinned in services/rust-hid/rust-toolchain.toml (#1255);
      # Renovate proposes bumps, so new lints land in a reviewed PR.
      - name: Read pinned Rust version
        id: rust-version
        run: |
          version=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' services/rust-hid/rust-toolchain.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/rust-hid/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('services/rust-hid/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cargo test
        working-directory: services/rust-hid
        run: cargo test --verbose

      - name: Cargo fmt
        working-directory: services/rust-hid
        run: cargo fmt --check

      - name: Cargo clippy
        working-directory: services/rust-hid
        run: cargo clippy --all-targets -- -D warnings

  # Go agent service tests (OTLP fan-out target)
  agent-tests:
    name: Agent Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.agent_tests == 'true' || needs.changes.outputs.run_all_checks == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/agent/go.mod
          check-latest: true
          cache-dependency-path: services/agent/go.sum

      - name: Run tests
        working-directory: services/agent
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
          go test -v -race ./...
          go vet ./...

  # Go flag service tests (epic #1407, UC-053)
  flag-service-tests:
    name: Flag Service Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.flag_service_tests == 'true' || needs.changes.outputs.run_all_checks == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/flag-service/go.mod
          cache-dependency-path: services/flag-service/go.sum

      - name: Run tests
        working-directory: services/flag-service
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
          go test -v -race ./...
          go vet ./...

  # Self-contained shell tests for the operator scripts (#1366): agent-backend.sh
  # (UC-044), talk-stage.sh / talk-preflight.sh (UC-070) and
  # pattern-replay-check.sh (UC-046). They stub docker/curl on PATH and need only
  # bash, python3 and GNU date, so they run in seconds without the stack. Same
  # list as `make lint`; a new scripts/tests/test-*.sh is picked up automatically.
  script-tests:
    name: Script Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.script_tests == 'true' || needs.changes.outputs.run_all_checks == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Run scripts/tests/*.sh
        run: |
          shopt -s nullglob
          tests=(scripts/tests/test-*.sh)
          if [[ ${#tests[@]} -eq 0 ]]; then
            echo "::error::no script tests found under scripts/tests/"
            exit 1
          fi
          status=0
          for t in "${tests[@]}"; do
            echo "::group::${t}"
            if "${t}"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=${t}::${t} failed"
              status=1
            fi
          done
          exit "${status}"

  # Telemetry producer/consumer contract (#1357): static scan of Python/Go/Rust
  # metric and span producers vs the agent extractors, Grafana dashboards and
  # the dashboard SPA. Infra config tests (#1365): envoy routing (+ `envoy --mode
  # validate`), collector best-effort fan-out. Docker images are the compose tags.
  # Generated spec tables (`make specs-check`, #1280). Runs in ~30 s, no service build.
  telemetry-contract:
    name: Telemetry Contract
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.telemetry == 'true' || needs.changes.outputs.run_all_checks == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read  # spec-refs-gate.sh reads the PR labels live
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Generated specs are up to date (make specs-check)
        # docs/specs/generated/ must equal what scripts/gen_specs.py renders from
        # the code; on failure: run `make specs` and commit (#1280).
        run: make specs-check

      - name: Spec counts (job summary, not committed)
        # Flag, RPC and metric totals are not committed: two PRs that each add
        # one would always conflict and the merge queue ejected the later (#2152).
        # Informational: it must never fail the job or skip the steps after it.
        if: always()
        continue-on-error: true
        run: make specs-counts >> "$GITHUB_STEP_SUMMARY"

      - name: Spec references resolve (spec-refs-gate.sh)
        # Every path:line / path:Symbol in docs/specs names a full repo path that
        # exists; Go Span*/Attr* values appear in telemetry.md (#1280). Line-ref
        # growth warns; baseline growth needs the spec-baseline-growth label.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/ci/spec-refs-gate.sh

      - name: Install GLib for the GKeyFile round trip (UC-061 BR-004)
        # tests/contract/test_hotspot_profile.py parses the rendered NM keyfile with
        # GLib's own GKeyFile parser through the system python3; it fails in CI without it.
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends python3-gi gir1.2-glib-2.0

      - name: Run telemetry contract tests
        # test_flagd_resolution.py, test_flagd_rpc_retry.py and test_fractional_bucketing.py (grpc + provider) run in the Flagd Contract job below.
        run: uv run --no-project --with pytest --with pyyaml --with pytest-rerunfailures pytest tests/contract -v --tb=short -p no:cacheprovider --ignore tests/contract/test_flagd_resolution.py --ignore tests/contract/test_flagd_rpc_retry.py --ignore tests/contract/test_fractional_bucketing.py

  # flagd contract tier (#1422): ONE real flagd (compose image tag) on a temp
  # copy of services/flagd/ci, no game services, no build. Typed-getter
  # resolution of every coordinator-read flag (the #903 TYPE_MISMATCH class)
  # and the baseline's windows ladder, with flagd reading the baseline files
  # directly (in the stack its only source is the flag service). ~1 min.
  flagd-contract:
    name: Flagd Contract
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.flagd_contract == 'true' || needs.changes.outputs.run_all_checks == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Run flagd contract tests
        run: make test-contract-flagd

  # Service tier (T2, #1422 S1 / #1524): game coordinator, controller manager
  # and menu from source at HEAD as subprocesses, a fresh flag plane per stack
  # (go-built flag service + one flagd container), fake audio; the AGENT
  # composition adds the go-built agent and a fake OpenAI backend (#1600). No image build.
  # Path-filtered on PRs, always on main (run_all_checks). tests/service/README.md.
  service-tests:
    name: Service Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.service_tests == 'true' || needs.changes.outputs.run_all_checks == 'true'
    # ~7 min locally with the agent journeys (#1600), plus the first go builds
    # and the rust-hid build for its live flag test (#1713).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: |
            services/flag-service/go.sum
            services/agent/go.sum

      # rust-hid's live flag test (tests/service/test_rust_hid_flag_live.py, #1713)
      # builds rust-hid: same toolchain and system packages as Rust Checks.
      - name: Install rust-hid build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libhidapi-dev libudev-dev pkg-config

      - name: Read pinned Rust version
        id: rust-version
        run: |
          version=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' services/rust-hid/rust-toolchain.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/rust-hid/target
          key: ${{ runner.os }}-cargo-service-${{ hashFiles('services/rust-hid/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-service-

      # #1612: a failed run names its exit code and the failing tests as
      # annotations and in the job summary, so the failure is visible without
      # scrolling the log (`gh run view --log` shows the LATEST attempt only).
      - name: Run service tier tests
        shell: bash
        run: |
          set +e -o pipefail
          log="$RUNNER_TEMP/service-tests.log"
          make test-service PYTEST_EXTRA="--durations=15" 2>&1 | tee "$log"
          status=$?
          echo "make test-service exit=$status"
          if [ "$status" -ne 0 ]; then
            if grep -qE '^(FAILED|ERROR) ' "$log"; then
              grep -E '^(FAILED|ERROR) ' "$log" | while IFS= read -r line; do
                echo "::error title=Service Tests (exit $status)::$line"
              done
            else
              echo "::error title=Service Tests (exit $status)::no FAILED/ERROR line; see the log tail"
            fi
            {
              echo "### Service Tests failed (exit $status)"
              echo '```'
              grep -E '^(FAILED|ERROR) |^=+ .*in [0-9.]+s' "$log" || tail -n 40 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  lint-dockerfiles:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.dockerfiles == 'true' || needs.changes.outputs.run_all_checks == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Lint Dockerfiles
        run: make ci-lint-dockerfiles

  # Spec gate (#1263, AIUP). Two independent steps:
  #  1. Spec lint (scripts/aiup/spec-lint-gate.sh): the AI Unified Process
  #     spec_lint.py (vendored under scripts/aiup/, see its NOTICE) checks docs/
  #     across files. Every ERROR fails (checked without the baseline, so errors
  #     cannot be baselined); every WARN not in the committed baseline
  #     (scripts/aiup/spec-lint-baseline.json) fails, so existing warning debt is
  #     reported but only NEW warnings block; on PRs the baseline may not grow
  #     versus the base branch unless the `spec-baseline-growth` label is set.
  #  2. Spec touched: a PR changing services/**, lib/** or proto/** must change
  #     the spec, or carry the `no-spec-change` label, or be a bot / agent-
  #     promoter PR. Adding/removing either label re-runs this job via
  #     spec-label-rerun.yml (the steps read the labels live from the API).
  spec-gate:
    name: Spec Gate
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      needs.changes.outputs.specs == 'true' ||
      needs.changes.outputs.spec_code == 'true' ||
      needs.changes.outputs.run_all_checks == 'true'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6

      - name: Spec lint (AIUP spec_lint.py; errors always fail, new warnings fail)
        if: needs.changes.outputs.specs == 'true' || needs.changes.outputs.run_all_checks == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/aiup/spec-lint-gate.sh

      - name: Spec touched (no-spec-change label or bot/agent PR to skip)
        if: github.event_name == 'pull_request' && needs.changes.outputs.spec_code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: scripts/aiup/check-spec-touched.sh

  # SonarCloud analysis with coverage.
  # !cancelled() lets it run even when upstream jobs were skipped by the path
  # filter; the coverage download degrades gracefully when artifacts are missing.
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [changes, service-checks, lib-tests]
    # Skip on forks that don't have SONAR_TOKEN configured, and in the merge
    # queue (#1555): informational only, and each queue ref would become a
    # SonarCloud branch.
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') &&
      github.event_name != 'merge_group' &&
      (github.repository == 'WatchMeJoustMyFlags/JoustMania' || vars.ENABLE_SONARCLOUD == 'true')
    timeout-minutes: 15
    # Informational only: a Sonar failure (quality gate, or an expired
    # SONAR_TOKEN returning 403) must not fail CI Complete, the one required
    # check. With job-level continue-on-error, needs.sonarcloud.result reports
    # success while the job itself still shows red.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Download coverage reports
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-reports
        continue-on-error: true  # Don't fail if no coverage artifacts

      - name: List and combine coverage reports
        run: |
          echo "=== Looking for coverage reports ==="
          find coverage-reports -name "*.xml" -type f 2>/dev/null || echo "No coverage directory"
          ls -la coverage-reports/ 2>/dev/null || echo "No coverage-reports dir"

          # Find all coverage.xml files (they're in subdirectories per artifact)
          COVERAGE_FILES=$(find coverage-reports -name "coverage.xml" -type f 2>/dev/null | tr '\n' ',' | sed 's/,$//')

          if [ -n "$COVERAGE_FILES" ]; then
            echo "Found coverage files: $COVERAGE_FILES"
            # SonarCloud can accept multiple coverage files via comma-separated list
            echo "SONAR_COVERAGE_PATHS=$COVERAGE_FILES" >> "$GITHUB_ENV"
          else
            echo "No coverage files found"
            echo "SONAR_COVERAGE_PATHS=" >> "$GITHUB_ENV"
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=${{ env.SONAR_COVERAGE_PATHS }}

  # Validate proto files and Python package dependencies (merged jobs — both
  # use the same ci-proto image; one Make invocation builds it once)
  validate:
    name: Validate Protos & Packages
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.proto_pkg == 'true' || needs.changes.outputs.run_all_checks == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Validate protos and packages
        run: make ci-validate-protos ci-validate-packages

      # #1801: the committed agent Go stubs (services/agent/gen) must match a
      # fresh `make protos-agent` (pinned buf image + BSR plugin revisions).
      # Needs buf.build and Docker Hub, so in the merge queue it runs only for
      # an entry whose own diff touches proto_pkg (base_sha is the parent of
      # the group commit, so the diff is this entry's PR only); safe under the
      # ALLGREEN grouping strategy, revisit if it changes (e.g. HEADGREEN).
      # PRs, push to main and dispatch always run it (push catches drift from
      # outside the repo, e.g. a re-tagged image). Fails closed: a generation
      # error fails the step (exit 2), drift fails it (exit 1).
      - name: Validate agent Go stubs
        if: needs.changes.outputs.proto_pkg == 'true' || github.event_name != 'merge_group'
        run: make ci-validate-agent-protos

  # #1491: dashboard type check + unit tests. Before this, vitest never ran in
  # CI and tsc only ran inside the dashboard image build, which waits for
  # integration-test: a red or skipped integration run left TS changes with no
  # evidence at all. Node 24 matches the image's builder stage.
  dashboard-tests:
    name: Dashboard Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.dashboard_tests == 'true' || needs.changes.outputs.run_all_checks == 'true'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/dashboard/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

  # #1491: connect-proxy `buf generate` + `go vet` + `go test`. They live in the
  # Dockerfile's builder stage (the generated proto packages exist only there),
  # so build that stage alone: no runtime image, no push, no integration-test
  # dependency. A vet or test failure fails the build.
  connect-proxy-tests:
    name: Connect Proxy Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.connect_proxy_tests == 'true' || needs.changes.outputs.run_all_checks == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: buf generate, go vet, go test (builder stage)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/connect-proxy/Dockerfile
          target: builder
          platforms: linux/amd64
          push: false
          # Read-only: the publish job (docker-build-extra) owns this scope.
          cache-from: type=gha,scope=connect-proxy

  # #1780: the custom collector (OCB compile, ~7 min, fetches Go modules and
  # flakes on proxy errors) is built once per content hash of
  # images/otel-collector/** and pushed as otel-collector:<hash>; the e2e job
  # pull it (OTEL_COLLECTOR_TAG, docker-compose.collector-prebuilt.yml). The tag
  # is separate from the released :<sha>/:main/:latest images (docker-build-extra
  # and retag-skipped are untouched). A tag that already exists is reused, so
  # only the first run after a collector change builds. Only merge_group (and a
  # push to main) pushes the tag: a PR runs unreviewed ci.yml and must not plant
  # an image the queue then trusts. PRs (same repo or fork) pull the tag when it
  # exists; otherwise `tag` stays empty and the e2e job builds it locally. Best
  # effort: the risky steps are continue-on-error and the e2e job's `if` ignores
  # this job's result, so any failure here means a local build, never a skip.
  # Same gate as integration-test.
  collector-image:
    name: Prebuilt otel-collector
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      needs.changes.outputs.e2e_required == 'true' ||
      (github.event_name == 'merge_group' && needs.changes.outputs.non_docs != 'false')
    timeout-minutes: 20
    # packages: write is used only by the merge_group/push build step (job
    # permissions cannot vary by event); PR runs only read.
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.result.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute collector content hash
        id: hash
        run: echo "hash=$(scripts/ci/collector-image-hash.sh)" >> "$GITHUB_OUTPUT"

      - name: Set image ref
        id: ref
        env:
          HASH: ${{ steps.hash.outputs.hash }}
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/otel-collector:${HASH}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the tag exists
        id: exists
        continue-on-error: true
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          if docker buildx imagetools inspect "$REF" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: >-
          steps.exists.outputs.exists != 'true' &&
          (github.event_name == 'merge_group' || github.event_name == 'push')
        continue-on-error: true
        uses: docker/setup-buildx-action@v4

      # Push only from reviewed code (merge_group, push to main); PRs never push.
      # Step timeout: #1781's retries on a ~7 min OCB build must not hit the job timeout.
      - name: Build and push collector
        if: >-
          steps.exists.outputs.exists != 'true' &&
          (github.event_name == 'merge_group' || github.event_name == 'push')
        continue-on-error: true
        timeout-minutes: 12
        uses: docker/build-push-action@v7
        with:
          context: images/otel-collector
          file: images/otel-collector/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.ref.outputs.ref }}
          # Read-only: the publish job (docker-build-extra) owns this scope.
          cache-from: type=gha,scope=otel-collector

      - name: Publish result
        id: result
        env:
          REF: ${{ steps.ref.outputs.ref }}
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          if docker buildx imagetools inspect "$REF" > /dev/null 2>&1; then
            echo "tag=${HASH}" >> "$GITHUB_OUTPUT"
            echo "Prebuilt collector: ${REF}"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "::warning::no prebuilt collector ${REF}; the e2e job builds it locally"
          fi

  # #1422: one job, one compose stack, every module of tests/integration
  # (formerly two shards, merged in S13 PR3). The job id stays integration-test
  # (needs.* and ci-complete unchanged).
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [changes, collector-image]
    env:
      # #1780: prebuilt collector for this content hash; empty = build locally.
      OTEL_COLLECTOR_TAG: ${{ needs.collector-image.outputs.tag }}
    # #1583: runs only when e2e_required (merge_group, workflow_dispatch,
    # `ci-full`, or a non-docs PR touching a risky path; docs-only PRs still
    # skip it, #1422). Skipped on a push to main: the queue ran it on that
    # commit. ci-complete accepts a skip unless e2e_required was true.
    # The queue skips it only when this entry's diff is docs-only (non_docs
    # exactly 'false'); safe under the ALLGREEN grouping strategy, revisit if
    # it changes (e.g. HEADGREEN). merge_group is ORed in with that test so a
    # wrong/empty output cannot skip the queue's e2e gate (fail closed). The
    # full path (e2e_full_build) runs there.
    # !cancelled() + changes.result: run whatever collector-image did (failed,
    # skipped, timed out); an empty tag means a local collector build (#1780).
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      (needs.changes.outputs.e2e_required == 'true' ||
      (github.event_name == 'merge_group' && needs.changes.outputs.non_docs != 'false'))
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v8.2.0

      # #925 fast-path freshness guard: BEFORE mounting current source into the
      # pulled :latest images, confirm each carries a deps-fingerprint label that
      # matches this checkout. A stale :latest (e.g. a deps-changing commit whose
      # publish was skipped by a flake) fails here with a one-line diagnosis
      # instead of erroring all 18 tests with no obvious cause. No-op on a fresh
      # image (fingerprint matches). Only runs on the fast path.
      - name: Guard against stale prebuilt images
        if: needs.changes.outputs.e2e_full_build == 'false'
        # IMAGE_PREFIX is already in env scope from the "Set image prefix" step.
        env:
          IMAGE_TAG: latest
        run: bash scripts/ci/check-image-freshness.sh

      # #1487: the fast path mounts the checked-out collector config into the
      # pulled collector image. When that image predates a config change (a
      # cancelled main run left otel-collector:main on a June build while
      # #1472 moved the config onto span_metrics), the collector exits 1 and
      # every test errors in setup. Validate the config with the pulled image;
      # on a mismatch, build the collector from this checkout under the same
      # ref. docker-compose.dev.yml gives the collector pull_policy "missing",
      # so the suite's `compose pull` keeps that build. The build only runs on
      # a mismatch (~7 min uncached; read-only GHA cache).
      - name: Resolve collector image ref (fast path)
        id: collector_image
        if: needs.changes.outputs.e2e_full_build == 'false'
        env:
          IMAGE_TAG: latest
        run: |
          ref="$(docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.ci.yml \
            -f docker-compose.dev.yml config --format json | jq -r '.services."otel-collector".image')"
          echo "Collector image ref: ${ref}"
          [[ -n "$ref" && "$ref" != "null" ]] || { echo "::error::could not resolve otel-collector image ref"; exit 1; }
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          rc=0
          bash scripts/ci/check-collector-config.sh "$ref" services/otel-collector/config.yaml || rc=$?
          case "$rc" in
            0) echo "build=false" >> "$GITHUB_OUTPUT" ;;
            1 | 2)
              echo "::warning::${ref} does not accept services/otel-collector/config.yaml; building the collector at HEAD for this run"
              echo "build=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      - name: Build otel-collector at HEAD (fast path, config mismatch)
        if: steps.collector_image.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: images/otel-collector
          file: images/otel-collector/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.collector_image.outputs.ref }}
          # Read-only: the publish job (docker-build-extra) owns this scope.
          cache-from: type=gha,scope=otel-collector

      # A config that the HEAD build rejects too is a broken config, not a stale
      # image: fail here with the collector's own error instead of 18 setup errors.
      - name: Validate collector config against the HEAD build
        if: steps.collector_image.outputs.build == 'true'
        run: bash scripts/ci/check-collector-config.sh --no-pull "${{ steps.collector_image.outputs.ref }}" services/otel-collector/config.yaml

      # #1254: the Go agent has no dev mount, so on the fast path it would run the
      # published :latest, which can lag the code under test: a PR changing only
      # services/agent/**/*.go never matches integration_deps, and :latest is only
      # pushed by the agent publish job AFTER main's image builds finish (main
      # pushes run no e2e since #1583; the queue builds everything at HEAD), so
      # any run starting in that window (2026-10-16: ~15 min after #1252) tests
      # new agent assertions against the old binary. Build the agent from this
      # checkout instead, under the exact ref compose resolves, and load it
      # locally. The suite's session `compose pull` skips the profile-gated
      # agent, and the tests that start it use pull_policy "missing", so they run
      # this HEAD build. Runs on the fast path; it costs ~1-1.5 min
      # (amd64 only; `go build` has no build-cache mount, so any source change
      # rebuilds). The full-build path already builds the agent at HEAD.
      - name: Resolve agent image ref (fast path)
        id: agent_image
        if: needs.changes.outputs.e2e_full_build == 'false'
        env:
          IMAGE_TAG: latest
        run: |
          ref="$(docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.ci.yml \
            --profile agent config --format json | jq -r '.services.agent.image')"
          echo "Agent image ref: ${ref}"
          # An unresolved ref would tag "null" and silently test the pulled
          # :latest again (#1254), so fail loudly instead.
          [[ -n "$ref" && "$ref" != "null" ]] || { echo "::error::could not resolve agent image ref"; exit 1; }
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Build agent at HEAD (fast path)
        if: needs.changes.outputs.e2e_full_build == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/agent/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.agent_image.outputs.ref }}
          # Read-only: the publish job (docker-build-extra) owns the agent scope.
          cache-from: type=gha,scope=agent

      # Fast path: pull latest images, overlay current source (agent: HEAD build above;
      # flag-service: built at HEAD by compose, pull_policy build in docker-compose.dev.yml).
      # PYTEST_EXTRA="--reruns 1" (#925): tolerate a single integration flake so
      # one flake no longer skips image publish. Generic — reruns ANY failure
      # once, never quarantines a test by name. --durations=15 lists the slowest
      # tests of the run (#1422).
      - name: Run integration tests (fast - source only)
        if: needs.changes.outputs.e2e_full_build == 'false'
        run: COLLECTOR_PULL_POLICY=missing USE_PREBUILT_IMAGES=true USE_DEV_MOUNTS=true PYTEST_EXTRA="--reruns 1 --durations=15" make test-integration

      # Slow path: every stack image built at HEAD (merge_group, dispatch, ci-full,
      # or Dockerfiles/deps changed; see changes.e2e_full_build)
      - name: Run integration tests (full build)
        if: needs.changes.outputs.e2e_full_build != 'false'
        run: PYTEST_EXTRA="--reruns 1 --durations=15" make test-integration

      # #1649: a cancelled run never prints the pytest summary, so the cause of a
      # setup error was lost. Show every container's state and log tail instead.
      - name: Dump containers on failure
        if: failure() || cancelled()
        timeout-minutes: 2
        run: |
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
          for c in $(docker ps -aq); do
            echo "::group::$(docker inspect -f '{{.Name}}' "$c")"
            docker logs --tail 60 "$c" 2>&1 || true
            echo "::endgroup::"
          done

  # #1487: arm64 is built on a native arm64 runner (free for public repos), NOT
  # under QEMU. Emulated Go/Rust compiles (otel-collector, rust-hid) hit the
  # 30 min timeout on main, so :main was never republished. Each platform job
  # pushes its image by digest; the *-merge job below assembles the multi-arch
  # manifest with the same tags as before. PRs and merge-queue runs (#1555)
  # stay amd64-only and push nothing: only push and workflow_dispatch publish.
  docker-build:
    name: Build ${{ matrix.service }} (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs: [changes, integration-test]
    # #1583: wait for the e2e job only where it runs (merge_group,
    # dispatch, ci-full / risky PRs); a skipped e2e job (push to main, plain PR)
    # does not hold the build back. A required e2e job must have succeeded.
    if: >-
      needs.changes.outputs.docker_build_matrix != '[]' &&
      !cancelled() && needs.changes.result == 'success' &&
      (needs.integration-test.result == 'success' ||
       (needs.integration-test.result == 'skipped' && needs.changes.outputs.e2e_required != 'true'))
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.docker_build_matrix) }}
        platform: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && '["linux/amd64","linux/arm64"]' || '["linux/amd64"]') }}
    steps:
      - uses: actions/checkout@v6

      - name: Set image prefix and platform pair
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert service name to image name
        id: image_name
        run: |
          # Convert underscore to hyphen for docker image name
          SERVICE="${{ matrix.service }}"
          IMAGE_NAME="${SERVICE//_/-}-service"
          echo "name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      # #925: per-service deps fingerprint, scoped to exactly the deps inputs
      # that rebuild THIS image (shared workspace deps + this service's
      # own pyproject/Dockerfile). Baked into the image as a label below; the
      # fast path recomputes the same per-service value and refuses to mount
      # source into an image whose fingerprint is stale.
      - name: Compute deps fingerprint
        id: fingerprint
        run: echo "value=$(bash scripts/ci/deps-fingerprint.sh '${{ matrix.service }}')" >> "$GITHUB_OUTPUT"

      - name: Build and push service
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          # Non-PR: push by digest only; tags are applied by the merge job.
          outputs: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.IMAGE_PREFIX, steps.image_name.outputs.name) || '' }}
          build-args: |
            DEPS_FINGERPRINT=${{ steps.fingerprint.outputs.value }}
          # #1487: retag-skipped reads this to refuse a :main older than its sources.
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # amd64 keeps the pre-existing scope name; arm64 gets its own.
          cache-from: type=gha,scope=${{ matrix.service }}${{ matrix.platform == 'linux/arm64' && '-arm64' || '' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}${{ matrix.platform == 'linux/arm64' && '-arm64' || '' }}

      - name: Export digest
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: digests-${{ matrix.service }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-build-merge:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [changes, docker-build]
    # #1509: publish only when every build leg succeeded. A build skipped
    # (a required integration-test failed) or failed leaves no digests to assemble; the
    # real failure is already reported by the upstream job. A skipped publish
    # is fine for retag-skipped (gates on != 'failure') and ci-complete (only
    # failure/cancelled fail it; it still sees docker-build's own result).
    if: >-
      !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.docker_build_matrix != '[]' &&
      needs.docker-build.result == 'success'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.docker_build_matrix) }}
    steps:
      # Commit graph for the :main ordering guard (#1793): full history, but a
      # blobless partial clone with only scripts/ci checked out (merge-base needs commits only).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts/ci

      - name: Set image name
        run: |
          SERVICE="${{ matrix.service }}"
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${SERVICE//_/-}-service" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.service }}-linux-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IS_MAIN: ${{ github.ref_name == env.MAIN_BRANCH }}
        run: |
          IMAGE="${IMAGE_PREFIX}/${IMAGE_NAME}"
          # Docker tags forbid "/" (and uppercase/other chars): same as metadata-action type=ref
          REF_TAG="$(printf '%s' "${GITHUB_REF_NAME,,}" | sed 's#[^a-z0-9._-]#-#g')"
          TAGS=(--tag "${IMAGE}:${GITHUB_SHA}")
          MOVE_TAGS=true
          if [[ "$IS_MAIN" == "true" ]]; then
            # #1793: main runs are not serialised; an older run finishing late must not
            # move :main/:latest back. Skip them (keep :<sha>) only when :main is proven newer (exit 3);
            # a failed git fetch (exit 2) fails the step instead of silently freezing :main.
            rc=0
            bash "${GITHUB_WORKSPACE}/scripts/ci/check-main-tag-order.sh" "${IMAGE_NAME}" || rc=$?
            [[ "$rc" == 0 || "$rc" == 3 ]] || exit "$rc"
            [[ "$rc" == 0 ]] || MOVE_TAGS=false
          fi
          if [[ "$MOVE_TAGS" == "true" ]]; then
            TAGS+=(--tag "${IMAGE}:${REF_TAG}")
            if [[ "$IS_MAIN" == "true" ]]; then TAGS+=(--tag "${IMAGE}:latest"); fi
          fi
          SOURCES=()
          for digest in *; do SOURCES+=("${IMAGE}@sha256:${digest}"); done
          (( ${#SOURCES[@]} == 2 )) || { echo "expected 2 platform digests, got ${#SOURCES[@]}"; exit 1; }
          docker buildx imagetools create "${TAGS[@]}" "${SOURCES[@]}"

      - name: Inspect manifest
        run: docker buildx imagetools inspect "${IMAGE_PREFIX}/${IMAGE_NAME}:${GITHUB_SHA}"

  # Build non-Python services (Go/Node.js/Rust)
  # Publish (incl. :latest on main) is gated on the build (and, where the e2e
  # job ran, on integration-test), not on CI Complete: an unrelated red job
  # such as Rust Checks does not stop :latest from moving (#1254). On a push to
  # main e2e is skipped (#1583): the merge queue tested that commit.
  docker-build-extra:
    name: Build ${{ matrix.item.service }} (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs: [changes, integration-test]
    # #1583: same e2e gate as docker-build.
    if: >-
      needs.changes.outputs.docker_extra_matrix != '[]' &&
      !cancelled() && needs.changes.result == 'success' &&
      (needs.integration-test.result == 'success' ||
       (needs.integration-test.result == 'skipped' && needs.changes.outputs.e2e_required != 'true'))
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.changes.outputs.docker_extra_matrix) }}
        platform: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && '["linux/amd64","linux/arm64"]' || '["linux/amd64"]') }}
    steps:
      - uses: actions/checkout@v6

      - name: Set image prefix and platform pair
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push service
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.item.context }}
          file: ${{ matrix.item.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          # Non-PR: push by digest only; tags are applied by the merge job.
          outputs: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.IMAGE_PREFIX, matrix.item.image_name) || '' }}
          # #1487: retag-skipped reads this to refuse a :main older than its sources.
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # amd64 keeps the pre-existing scope name; arm64 gets its own.
          cache-from: type=gha,scope=${{ matrix.item.service }}${{ matrix.platform == 'linux/arm64' && '-arm64' || '' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.item.service }}${{ matrix.platform == 'linux/arm64' && '-arm64' || '' }}

      - name: Export digest
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          overwrite: true
          name: digests-${{ matrix.item.service }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-build-extra-merge:
    name: Publish ${{ matrix.item.service }}
    runs-on: ubuntu-latest
    needs: [changes, docker-build-extra]
    # #1509: same gate as docker-build-merge.
    if: >-
      !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.docker_extra_matrix != '[]' &&
      needs.docker-build-extra.result == 'success'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.changes.outputs.docker_extra_matrix) }}
    steps:
      # Commit graph for the :main ordering guard (#1793): full history, but a
      # blobless partial clone with only scripts/ci checked out (merge-base needs commits only).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts/ci

      - name: Set image name
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${{ matrix.item.image_name }}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.item.service }}-linux-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IS_MAIN: ${{ github.ref_name == env.MAIN_BRANCH }}
        run: |
          IMAGE="${IMAGE_PREFIX}/${IMAGE_NAME}"
          # Docker tags forbid "/" (and uppercase/other chars): same as metadata-action type=ref
          REF_TAG="$(printf '%s' "${GITHUB_REF_NAME,,}" | sed 's#[^a-z0-9._-]#-#g')"
          TAGS=(--tag "${IMAGE}:${GITHUB_SHA}")
          MOVE_TAGS=true
          if [[ "$IS_MAIN" == "true" ]]; then
            # #1793: main runs are not serialised; an older run finishing late must not
            # move :main/:latest back. Skip them (keep :<sha>) only when :main is proven newer (exit 3);
            # a failed git fetch (exit 2) fails the step instead of silently freezing :main.
            rc=0
            bash "${GITHUB_WORKSPACE}/scripts/ci/check-main-tag-order.sh" "${IMAGE_NAME}" || rc=$?
            [[ "$rc" == 0 || "$rc" == 3 ]] || exit "$rc"
            [[ "$rc" == 0 ]] || MOVE_TAGS=false
          fi
          if [[ "$MOVE_TAGS" == "true" ]]; then
            TAGS+=(--tag "${IMAGE}:${REF_TAG}")
            if [[ "$IS_MAIN" == "true" ]]; then TAGS+=(--tag "${IMAGE}:latest"); fi
          fi
          SOURCES=()
          for digest in *; do SOURCES+=("${IMAGE}@sha256:${digest}"); done
          (( ${#SOURCES[@]} == 2 )) || { echo "expected 2 platform digests, got ${#SOURCES[@]}"; exit 1; }
          docker buildx imagetools create "${TAGS[@]}" "${SOURCES[@]}"

      - name: Inspect manifest
        run: docker buildx imagetools inspect "${IMAGE_PREFIX}/${IMAGE_NAME}:${GITHUB_SHA}"

  # Release contract: release.yml tag-images expects IMAGE:<sha> for all 13
  # release images. Images skipped by the path filter get a manifest-only retag
  # from :main (seconds each). Explicit if-condition because the build jobs may
  # legitimately be 'skipped' (plain `needs` semantics would skip this job too).
  # Push only, where integration-test no longer runs (#1583: the merge queue
  # ran it on this commit), so it does not need it.
  retag-skipped:
    name: Retag ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [changes, docker-build, docker-build-extra, docker-build-merge, docker-build-extra-merge]
    if: >-
      !cancelled() && github.event_name == 'push' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.retag_matrix != '[]' &&
      needs.docker-build.result != 'failure' &&
      needs.docker-build-extra.result != 'failure' &&
      needs.docker-build-merge.result != 'failure' &&
      needs.docker-build-extra-merge.result != 'failure'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.retag_matrix) }}
    steps:
      # Full history: the freshness check below finds the last commit that
      # touched this image's sources and compares it with :main's build commit.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # #1487: refuse to copy a :main forward that was built BEFORE the last
      # commit touching this image's sources (same globs as the `changes`
      # filter). A cancelled main run (c14cb15e) left otel-collector:main on a
      # June build, and the next push retagged that stale image as current.
      # Fails the job (red main, CI Complete red) with the remedy; exit 2 means
      # :main is missing, which the warning step below already handles.
      - name: Check :main includes the image's last source change
        id: fresh
        run: |
          rc=0
          bash scripts/ci/check-retag-source.sh "${{ matrix.image }}" || rc=$?
          [[ "$rc" == 0 || "$rc" == 2 ]] || exit "$rc"

      # #2120: the copy used to be continue-on-error and could leave a commit
      # without its :<sha> image while the job stayed green. retag-image.sh
      # copies by digest, then re-reads :<sha> and requires the same digest;
      # any failure fails the job. Only a missing :main (exit 2: first run /
      # fork) stays a warning, the next release would miss this image's :<sha>.
      # Remedy: one full run via workflow_dispatch (or merge a change touching
      # the image).
      - name: Retag :main -> :sha and verify
        id: retag
        run: |
          rc=0
          TARGET_SHA="${{ github.sha }}" bash scripts/ci/retag-image.sh "${{ matrix.image }}" || rc=$?
          if [[ "$rc" == 2 ]]; then
            echo "::warning::No :main tag for ${{ matrix.image }}; its :${{ github.sha }} tag is missing. Trigger a full build (workflow_dispatch) before the next release."
          elif [[ "$rc" != 0 ]]; then
            exit "$rc"
          fi

  # Final status check job for branch protection
  # This job depends on all other jobs and provides a single status check
  # that represents the entire CI pipeline's health.
  # Skipped jobs (path filter) keep this green; failures fail it.
  ci-complete:
    # The required check. A skipped job still posts a check run, and GitHub
    # counts a skipped required check as passing (#1497), so this job must
    # never be skipped on a run that tested nothing: label events no longer
    # start this workflow at all (#1527).
    name: CI Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - dashboard-tests
      - connect-proxy-tests
      - lib-tests
      - service-checks
      - rust-checks
      - agent-tests
      - flag-service-tests
      - script-tests
      - telemetry-contract
      - flagd-contract
      - service-tests
      - lint-dockerfiles
      - spec-gate
      - sonarcloud
      - validate
      - integration-test
      - docker-build
      - docker-build-extra
      - docker-build-merge
      - docker-build-extra-merge
      - retag-skipped
    # `!cancelled()` (was `always()`, #1086) skips CI Complete in a run cancelled
    # by the concurrency group (a newer push), so it posts no stale FAILURE.
    # Real failures and per-job cancellations still fail the step below.
    # Merge queue (#1555): runs on merge_group too; its result on the
    # merge-group head is what the queue waits for.
    if: ${{ !cancelled() }}
    steps:
      - name: Check all jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          FAILED="${{ contains(needs.*.result, 'failure') }}"
          CANCELLED="${{ contains(needs.*.result, 'cancelled') }}"
          if [[ "$FAILED" == "true" || "$CANCELLED" == "true" ]]; then
            echo "❌ One or more CI jobs failed or were cancelled"
            echo "$NEEDS_JSON" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"' || true
            exit 1
          fi
          echo "✅ All CI checks passed (skipped jobs are OK)"

      # #1583: a skipped e2e job is OK only where it was not required; in the
      # merge queue (and with ci-full / risky paths) it must have succeeded.
      # Fails closed: merge_group requires e2e unless non_docs is exactly
      # 'false' (docs-only group; empty counts as required), and an
      # e2e_required that is neither 'true' nor 'false' (empty/broken output)
      # fails.
      - name: Check required e2e ran
        env:
          E2E_REQUIRED: ${{ needs.changes.outputs.e2e_required }}
          E2E_RESULT: ${{ needs.integration-test.result }}
          EVENT_NAME: ${{ github.event_name }}
          NON_DOCS: ${{ needs.changes.outputs.non_docs }}
        run: |
          if [[ "$E2E_REQUIRED" != "true" && "$E2E_REQUIRED" != "false" ]]; then
            echo "❌ changes.e2e_required is '$E2E_REQUIRED' (expected 'true' or 'false')"
            exit 1
          fi
          if [[ "$E2E_REQUIRED" == "true" || ( "$EVENT_NAME" == "merge_group" && "$NON_DOCS" != "false" ) ]]; then
            if [[ "$E2E_RESULT" != "success" ]]; then
              echo "❌ e2e was required (e2e_required=$E2E_REQUIRED, event=$EVENT_NAME) but integration-test is '$E2E_RESULT'"
              exit 1
            fi
            echo "✅ Required e2e passed"
          else
            echo "✅ e2e not required (result: $E2E_RESULT)"
          fi
