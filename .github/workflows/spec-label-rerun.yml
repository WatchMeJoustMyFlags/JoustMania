name: Spec label re-run

# #1263: adding or removing the `no-spec-change` label must flip the Spec Gate
# without a new push. ci.yml deliberately ignores non-`ci-full` label events
# (#1086: no redundant heavy runs), so this workflow re-runs only the Spec Gate
# job of the latest real CI run for the PR head; GitHub re-runs its dependents
# (CI Complete) with it, which updates the required status. The Spec Gate step
# reads the labels live from the API, so the re-run sees the change.

on:
  pull_request:
    branches: [main]
    types: [labeled, unlabeled]

permissions:
  actions: write
  contents: read

jobs:
  rerun-spec-gate:
    name: Re-run Spec Gate
    if: github.event.label.name == 'no-spec-change'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Re-run the Spec Gate job of the latest CI run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Newest first; skip the label-event runs whose Spec Gate was skipped.
          for run_id in $(gh run list --workflow ci.yml --commit "$HEAD_SHA" --event pull_request \
                            --limit 20 --json databaseId --jq '.[].databaseId'); do
            job=$(gh run view "$run_id" --json jobs \
                    --jq '.jobs[] | select(.name == "Spec Gate" and .conclusion != "skipped") | .databaseId' | head -n1)
            status=$(gh run view "$run_id" --json status --jq .status)
            if [ -z "$job" ] && [ "$status" = "completed" ]; then
              continue
            fi
            if [ "$status" != "completed" ]; then
              # A job can only be re-run once its run has finished. If the Spec Gate
              # has not started yet it reads the new label itself; re-running after
              # the run finishes is harmless either way.
              echo "CI run $run_id is $status; waiting for it to finish"
              gh run watch "$run_id" --interval 30 > /dev/null || true
              job=$(gh run view "$run_id" --json jobs \
                      --jq '.jobs[] | select(.name == "Spec Gate" and .conclusion != "skipped") | .databaseId' | head -n1)
              [ -z "$job" ] && continue
            fi
            echo "Re-running Spec Gate job $job of CI run $run_id"
            gh run rerun --job "$job"
            exit 0
          done
          echo "No CI run with a Spec Gate job for $HEAD_SHA; nothing to re-run."
