name: Spec label re-run

# #1263: adding or removing the `no-spec-change` (or `spec-baseline-growth`)
# label must flip the Spec Gate without a new push. ci.yml does not trigger on label events
# (#1527: a newer label-only CI run would hide "CI Complete" and block the PR), so this workflow re-runs only the Spec Gate
# job of the latest real CI run for the PR head; GitHub re-runs its dependents
# (CI Complete) with it, which updates the required status. The Spec Gate step
# reads the labels live from the API, so the re-run sees the change. Fork PRs
# get a read-only token here, so they re-push instead (docs/CONTRIBUTING.md).

on:
  pull_request:
    branches: [main]
    types: [labeled, unlabeled]

permissions:
  actions: write
  contents: read
  pull-requests: read  # re-check the PR head before re-running

jobs:
  rerun-spec-gate:
    name: Re-run Spec Gate
    if: github.event.label.name == 'no-spec-change' || github.event.label.name == 'spec-baseline-growth'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A newer label event for the same PR supersedes this one (the re-run reads
    # the labels live anyway). Job-level, so an unrelated label (job skipped)
    # never cancels a pending re-run.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Re-run the Spec Gate (and Telemetry Contract) job of the latest CI run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABEL: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow ci.yml --commit "$HEAD_SHA" --event pull_request \
                     --limit 1 --json databaseId --jq '.[0].databaseId // empty') || {
            echo '::warning::Could not list CI runs; re-add the label to retry.'
            exit 0
          }
          if [ -z "$run_id" ]; then
            echo "No CI run for $HEAD_SHA; nothing to re-run."
            exit 0
          fi
          status=$(gh run view "$run_id" --json status --jq .status) || {
            echo "::warning::Could not read CI run $run_id; re-add the label to retry."
            exit 0
          }
          if [ "$status" != "completed" ]; then
            # A job can only be re-run once its run has finished. If the Spec Gate
            # has not started yet it reads the new label itself; re-running after
            # the run finishes is harmless either way.
            echo "CI run $run_id is $status; waiting for it to finish"
            # Bounded below the job's timeout-minutes (60): a timed-out job is a red
            # check that safe-merge reads as CI RED. 50 min leaves room for the steps after.
            if ! timeout 50m gh run watch "$run_id" --interval 30 > /dev/null; then
              echo "::warning::CI run $run_id not finished after 50 min (or watch failed); re-add the label to retry."
              exit 0
            fi
          fi
          # spec-baseline-growth also gates the spec-refs baseline (#1280), checked
          # in the Telemetry Contract job.
          jobs=$(gh run view "$run_id" --json jobs \
                  --jq '.jobs[] | select((.name == "Spec Gate" or (.name == "Telemetry Contract" and env.LABEL == "spec-baseline-growth")) and .conclusion != "skipped") | .databaseId') || {
            echo "::warning::Could not read the jobs of CI run $run_id; re-add the label to retry."
            exit 0
          }
          if [ -z "$jobs" ]; then
            echo "CI run $run_id has no Spec Gate / Telemetry Contract job that ran (no spec/code change); nothing to re-run."
            exit 0
          fi
          # A push while waiting gives the new head its own run, which reads the
          # labels itself. Re-running the old head's run would cancel that run
          # (same ci.yml concurrency group).
          head=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.sha) || {
            echo "::warning::Could not read the PR head; re-add the label to retry."
            exit 0
          }
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "PR head moved to $head; its own CI run reads the labels."
            exit 0
          fi
          # GitHub refuses to re-run a job of a run that is in progress, so the
          # jobs go one at a time: wait for the run to finish again before each
          # re-run after the first. Every failure is a warning, never a red check.
          first=1
          for job in $jobs; do
            if [ "$first" -eq 0 ]; then
              sleep 15  # let the run leave "completed" after the previous re-run
              # One shared budget with the first wait, below the job's 60 min limit.
              left=$((50 * 60 - SECONDS))
              if [ "$left" -le 0 ] || ! timeout "${left}s" gh run watch "$run_id" --interval 30 > /dev/null; then
                echo "::warning::CI run $run_id did not finish after the previous re-run; re-add the label to retry."
                exit 0
              fi
            fi
            first=0
            echo "Re-running job $job of CI run $run_id"
            if ! gh run rerun "$run_id" --job "$job"; then
              echo "::warning::Could not re-run job $job of CI run $run_id; re-add the label to retry."
              exit 0
            fi
          done
