name: Spec label re-run

# #1263: adding or removing the `no-spec-change` (or `spec-baseline-growth`)
# label must flip the Spec Gate without a new push. ci.yml does not trigger on label events
# (#1527: a newer label-only CI run would hide "CI Complete" and block the PR), so this workflow re-runs only the Spec Gate
# job of the latest real CI run for the PR head; GitHub re-runs its dependents
# (CI Complete) with it, which updates the required status. The Spec Gate step
# reads the labels live from the API, so the re-run sees the change. Fork PRs
# get a read-only token here, so they re-push instead (docs/CONTRIBUTING.md).

on:
  pull_request:
    branches: [main]
    types: [labeled, unlabeled]

permissions:
  actions: write
  contents: read
  pull-requests: read  # re-check the PR head before re-running

jobs:
  rerun-spec-gate:
    name: Re-run Spec Gate
    if: github.event.label.name == 'no-spec-change' || github.event.label.name == 'spec-baseline-growth'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A newer label event for the same PR supersedes this one (the re-run reads
    # the labels live anyway). Job-level, so an unrelated label (job skipped)
    # never cancels a pending re-run.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Re-run the Spec Gate job of the latest CI run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow ci.yml --commit "$HEAD_SHA" --event pull_request \
                     --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "No CI run for $HEAD_SHA; nothing to re-run."
            exit 0
          fi
          status=$(gh run view "$run_id" --json status --jq .status)
          if [ "$status" != "completed" ]; then
            # A job can only be re-run once its run has finished. If the Spec Gate
            # has not started yet it reads the new label itself; re-running after
            # the run finishes is harmless either way.
            echo "CI run $run_id is $status; waiting for it to finish"
            gh run watch "$run_id" --interval 30 > /dev/null || true
          fi
          job=$(gh run view "$run_id" --json jobs \
                  --jq '.jobs[] | select(.name == "Spec Gate" and .conclusion != "skipped") | .databaseId' | head -n1)
          if [ -z "$job" ]; then
            echo "CI run $run_id has no Spec Gate job that ran (no spec/code change); nothing to re-run."
            exit 0
          fi
          # A push while waiting gives the new head its own run, which reads the
          # labels itself. Re-running the old head's run would cancel that run
          # (same ci.yml concurrency group).
          head=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.sha)
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "PR head moved to $head; its own CI run reads the labels."
            exit 0
          fi
          echo "Re-running Spec Gate job $job of CI run $run_id"
          gh run rerun --job "$job"
