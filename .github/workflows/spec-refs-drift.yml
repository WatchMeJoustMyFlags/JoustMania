name: Spec refs drift

# #1918: weekly report of stale `path:line` references in docs/specs. Opens or
# updates ONE tracking issue (stable title); it never gates a PR and never fails
# the default branch build (report mode always exits 0, the issue step is
# best-effort).

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: spec-refs-drift
  cancel-in-progress: false

jobs:
  report:
    name: Spec refs drift report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_TITLE: Spec reference drift report
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0  # git blame / log -L need the history

      - name: Build the report
        run: python3 scripts/spec_refs.py --report > "${RUNNER_TEMP}/spec-refs-report.md"

      - name: Open or update the tracking issue
        # A gh failure must not fail the default branch, but is never silent:
        # every failure path below emits ::warning:: and exits 0.
        run: |
          report="${RUNNER_TEMP}/spec-refs-report.md"
          count="$(sed -n '1s/.*spec-refs-drift: \([0-9]*\).*/\1/p' "$report")"
          if [ -z "$count" ]; then
            echo "::warning::report has no count line"; exit 0
          fi
          # Exact title only: a dropped label must not cause a duplicate issue.
          if ! number="$(gh issue list --state open --limit 200 --search "\"${ISSUE_TITLE}\" in:title" \
            --json number,title --jq "[.[] | select(.title == env.ISSUE_TITLE)][0].number // empty")"; then
            echo "::warning::gh issue list failed; tracking issue not updated"; exit 0
          fi
          if [ "$count" = "0" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "No broken or drifted references in this week's run." \
                || echo "::warning::gh issue close #${number} failed"
            fi
            exit 0
          fi
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$report" \
              || echo "::warning::gh issue edit #${number} failed"
          elif ! gh issue create --title "$ISSUE_TITLE" --label documentation --body-file "$report"; then
            # most likely the label is missing: retry without it
            gh issue create --title "$ISSUE_TITLE" --body-file "$report" \
              || echo "::warning::gh issue create failed; tracking issue not opened"
          fi
