name: Review gate

# #1809: the "Reviewed head" check for the merge queue. The reviewer posts a
# "Reviewed head" commit status on the PR head SHA (`safe-merge.sh --arm`); a
# merge-queue commit has its own SHA, so this job reports the same context
# there after checking the newest status on the PR's current head
# (scripts/ci/review-gate.sh, fails closed).
#
# merge_group ONLY: on pull_request a check run with this name would show up on
# PR heads and could satisfy the required check without a review. CI Complete
# (ci.yml) must not depend on this job: it also runs on PR heads.
# ACCEPTED RISK (#1809, review of PR #2439): merge_group runs the workflow and
# script from the merge-group commit, i.e. including the gated PR's own changes.
# A PR that edits this workflow, review-gate.sh, or adds a job named
# "Reviewed head" can satisfy the check itself. Accepted for now: the threat is a
# push after the review, not a hostile PR (every agent runs as the maintainer).
# Defence in depth: the script is checked out at merge_group.base_sha, the base
# of the queue entry (main's tip, or the merge-group commit of the entry ahead;
# stops a script edit, not a yml edit). Reviewers must flag any diff touching
# `.github/workflows/**` or `scripts/ci/review-gate.sh` (review-pr guidance, PR2).
# Real fix (follow-up): a reviewer GitHub App posting both statuses, with the
# required check pinned to its integration id.
# The gate is sound only under merge-queue grouping_strategy ALLGREEN (it checks
# only the PR of its own queue entry); `safe-merge.sh --arm` refuses otherwise.
# Required in the `main` ruleset with source "Any source" (the PR-head status
# comes from a user token, the queue check run from GitHub Actions).

on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  statuses: read
  pull-requests: read

jobs:
  reviewed-head:
    name: Reviewed head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci/review-gate.sh
          sparse-checkout-cone-mode: false

      - name: Check the newest "Reviewed head" status on the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REVIEW_APPROVERS: ${{ vars.REVIEW_APPROVERS }}
        run: scripts/ci/review-gate.sh
