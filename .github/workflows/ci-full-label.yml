name: ci-full label

# #1527: ci.yml does not trigger on `labeled`. GitHub takes required checks from
# the NEWEST run of a workflow on the head SHA, so every label-only CI run (which
# tests nothing and has no "CI Complete") left the PR BLOCKED. Only `ci-full`
# needs CI when a label is added: this workflow re-runs the PR's latest real CI
# run in place (same run, same check suite). That run's `changes` job reads the
# labels live, so the re-run builds all images and runs all checks, and its
# "CI Complete" lands on the head SHA as the newest CI result. A label never
# posts a "CI Complete" for code it did not test.
#
# Fork PRs get a read-only token here, so they push a commit after adding the
# label instead (docs/CONTRIBUTING.md).

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions: {}

jobs:
  rerun-full:
    name: Re-run CI in full mode
    if: github.event.label.name == 'ci-full'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write        # re-run the CI run
      pull-requests: read   # re-check the PR head before re-running
    concurrency:
      group: ci-full-label-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Re-run the latest CI run of the PR head in full mode
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABEL_TIME: ${{ github.event.pull_request.updated_at }}
        run: |
          set -euo pipefail
          # updated_at of the payload is a snapshot taken at the label event: never
          # earlier than the label, so the worst case is a double run, never a missed one.
          label_time="$LABEL_TIME"
          run_id=""
          # The PR's own CI run may still be being created (PR opened with the label).
          for _ in $(seq 1 12); do
            run_id=$(gh run list --workflow ci.yml --commit "$HEAD_SHA" --event pull_request \
                       --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::warning::No CI run for $HEAD_SHA; the next push runs CI with ci-full."
            exit 0
          fi
          # A run whose `changes` job started after the label read it live: already full
          # (also true for a run that has already finished).
          started=$(gh run view "$run_id" --json jobs \
                      --jq '.jobs[] | select(.name == "Detect changes") | .startedAt // empty' | head -n1) || started=""
          if [ -n "$started" ] && [[ ! "$started" < "$label_time" ]]; then
            echo "CI run $run_id started its change detection after the label: already full."
            exit 0
          fi
          # A failed read leaves status empty: the guarded loop below retries it.
          status=$(gh run view "$run_id" --json status --jq .status) || status=""
          if [ "$status" != "completed" ]; then
            # A run can only be re-run once it has finished. Stuck-state guard (#1569):
            # give up with a warning (exit 0, not a red check) instead of looping forever.
            echo "CI run $run_id is $status and predates the label; waiting for it to finish"
            # The 30-min "never started" limit below counts from here, not from when
            # the run entered queued/waiting; a run that re-enters waiting late gets less.
            start_epoch=$(date +%s)
            errs=0
            while true; do
              if s=$(gh run view "$run_id" --json status --jq .status); then
                errs=0
                status="$s"
              else
                errs=$((errs + 1))
              fi
              [ "$status" = "completed" ] && break
              if [ "$errs" -ge 5 ]; then
                echo "::warning::5 failed reads of CI run $run_id in a row; push or re-add ci-full."
                exit 0
              fi
              # A newer push has its own run, which reads the label itself.
              cur=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.sha) || cur="$HEAD_SHA"
              if [ "$cur" != "$HEAD_SHA" ]; then
                echo "PR head moved to $cur; its own CI run reads the ci-full label."
                exit 0
              fi
              waited=$(( $(date +%s) - start_epoch ))
              case "$status" in
                queued|waiting|requested|pending) limit=1800 ;;
                *) limit=6600 ;;
              esac
              if [ "$waited" -ge "$limit" ] || [ "$waited" -ge 6600 ]; then
                echo "::warning::CI run $run_id still $status after ${waited}s; push or re-add ci-full."
                exit 0
              fi
              sleep 30
            done
          fi
          # A newer push has its own run, which reads the label itself. Re-running
          # the old head's run would cancel it (same concurrency group).
          # Never fall back to HEAD_SHA here: that would re-run CI on a head that may have moved.
          head=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.sha) || {
            echo "::warning::Could not read the PR head; push or re-add ci-full."
            exit 0
          }
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "PR head moved to $head; its own CI run reads the ci-full label."
            exit 0
          fi
          echo "Re-running CI run $run_id in full mode"
          gh run rerun "$run_id"
