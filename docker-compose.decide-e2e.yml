# Decide-backend e2e overlay (#1230, epic #1225). TEST-ONLY.
#
# Layered by tests/integration/test_decide_backend_e2e.py ON TOP of the suite's
# session stack (docker-compose.yml + override + ci) under `--profile agent`:
#
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#     -f docker-compose.ci.yml -f docker-compose.decide-e2e.yml \
#     --profile agent up -d --wait fake-openai agent
#
# Validating it: alone it is not a valid project (the `agent` entry is a partial
# override and the `joustmania` network lives in docker-compose.yml), and both
# services are in the `agent` profile, so without `--profile agent` (the profile the
# test brings them up under) `config` silently filters them out. Use the full stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#     -f docker-compose.ci.yml -f docker-compose.decide-e2e.yml --profile agent config -q
#
# The test builds the agent at HEAD with its own image tag (IMAGE_TAG=decide-e2e,
# `up --build --no-deps agent`), whatever the suite's prebuilt/dev-mount mode, so the
# agent under test always carries this checkout's Go code (CI's fast path would
# otherwise run the published :latest agent).
#
# No production stack loads this file: it adds a scriptable fake
# OpenAI-compatible endpoint (fake-openai) and hands the agent a DUMMY
# DECISION_OPENAI_API_KEY so the `openai` decision backend is available. The
# test points the agent at the fake through the decision.openai.base_url /
# decision.openai.model flags (ci/agent.json, restored after every test).

services:
  # Scriptable fake for the agent's `openai` decision backend
  # (tests/integration/fake_openai/server.py, stdlib only). The host-side test
  # scripts each answer (valid / garbage / hold, confidence, intervention) via
  # its control API on host port 18089, and reads Jaeger through its /_jaeger/
  # relay (the integration stack publishes no Jaeger host port).
  fake-openai:
    profiles:
      - agent
    image: python:3.14.5-alpine
    container_name: joustmania-fake-openai
    command: ["python", "-u", "/app/server.py"]
    volumes:
      - ./tests/integration/fake_openai:/app:ro
    environment:
      - FAKE_OPENAI_PORT=8080
      - FAKE_OPENAI_API_KEY=fake-decide-e2e-key
      - JAEGER_QUERY_URL=http://jaeger:16686
    ports:
      - "127.0.0.1:18089:8080"
    networks:
      - joustmania
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 1s

  # Flag service: its own admin state file for this stack (re-review N4).
  flag-service:
    environment:
      - FLAG_SERVICE_STATE_FILE=/var/lib/flag-service/admin-decide-e2e.json

  agent:
    environment:
      # Dummy key, matched by fake-openai (FAKE_OPENAI_API_KEY). Never a real key.
      - DECISION_OPENAI_API_KEY=fake-decide-e2e-key
      # Lift the shared per-minute remote-call budget (llm.max_requests_per_minute,
      # 6/min by default) for the test run: across several back-to-back games the
      # default would exhaust and turn calls into budget_exhausted rules fallbacks.
      - AGENT_LLM_MAX_REQUESTS_PER_MINUTE=600
    depends_on:
      fake-openai:
        condition: service_healthy
