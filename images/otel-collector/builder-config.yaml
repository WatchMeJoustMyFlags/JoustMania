# Custom OpenTelemetry Collector build.
#
# Based on contrib v0.147.0, trimmed to only the components used by
# config.yaml and config.dynatrace.yaml.  Includes a custom
# dtbizevents exporter that converts metric data points directly to
# Dynatrace business events (bypassing 1-min metric resolution).
#
# To update: bump the version numbers below and rebuild the image.
# The full contrib manifest lives at:
#   https://github.com/open-telemetry/opentelemetry-collector-releases/
#     blob/main/distributions/otelcol-contrib/manifest.yaml

dist:
  module: github.com/watchmejoustmyflags/joustmania/otel-collector
  name: otelcol-joustmania
  description: JoustMania OpenTelemetry Collector (contrib + dtbizevents)
  version: 0.147.0
  output_path: /build/_output

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.147.0

receivers:
  # OTLP (gRPC + HTTP) — all services push here
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.147.0
  # Prometheus scrape — node-exporter, flagd, victoria-metrics, self-telemetry
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver v0.147.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.147.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/cumulativetodeltaprocessor v0.147.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.147.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.147.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/prometheusexporter v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/prometheusremotewriteexporter v0.147.0
  # dtbizevents: converts metric data points directly to Dynatrace
  # business events. High-frequency accel data (100Hz) is invisible in
  # Dynatrace's 1-min metric resolution — this exporter bypasses that
  # limit by POSTing flat JSON to /api/v2/bizevents/ingest.
  - gomod: github.com/watchmejoustmyflags/joustmania/otel-collector/dtbizeventsexporter v0.0.0

replaces:
  - github.com/watchmejoustmyflags/joustmania/otel-collector/dtbizeventsexporter v0.0.0 => ./dtbizeventsexporter

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.53.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.53.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.53.0
