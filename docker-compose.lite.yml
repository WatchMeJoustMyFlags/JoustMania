# JoustMania Lite Configuration - Raspberry Pi Optimized
#
# Excludes observability stack (Jaeger, Prometheus, Grafana, OTEL Collector)
# for minimal resource usage on constrained devices.
#
# Usage: docker compose -f docker-compose.lite.yml up -d
#
# Memory savings: ~768MB compared to full stack
# Recommended for: Raspberry Pi 5, production deployments without monitoring
#
# All images use canonical GHCR names for consistency.
# Use IMAGE_TAG environment variable to specify version (default: latest)

services:
  # Flag-dir permission init (#1031). The lite stack is a STANDALONE compose
  # (not layered on docker-compose.yml), so it needs its own copy of this
  # sidecar. The menu persists admin settings — game.json / user.json — by
  # writing the bind-mounted flag files via lib/flag_config_writer.py (an
  # in-place "w" truncate, so write perm on the FILE is what matters). The menu
  # image runs nonroot (uid 65532, chainguard); the host flag files are owned by
  # the deploy user (mode 644), so a nonroot write fails with PermissionError
  # and the change is silently lost. This one-shot root sidecar makes the files
  # the lite menu writes group-owned by the menu's nonroot gid (65532) and
  # group-writable, so the nonroot menu can persist writes WITHOUT running as
  # root. We chmod the SPECIFIC files the lite menu mounts (game.json,
  # user.json) — lite bind-mounts individual files, not the whole dir, and the
  # menu only ever writes these two. The sidecar mounts the whole dir to reach
  # them on the same host inodes the menu sees.
  #
  # Lite has NO agent service, so the #819 agent.json kill-switch is not present
  # here and agent.json persistence is out of scope. flagd only READS the files,
  # so it does NOT depend on this step (a future reader should not "fix" that
  # asymmetry — it would needlessly serialize flagd startup behind a chmod).
  flag-dir-init:
    image: busybox:1.37.0
    container_name: joustmania-flag-dir-init
    user: "0"  # must be root to chgrp/chmod the bind-mounted host files
    command:
      - "sh"
      - "-c"
      - "chgrp 65532 /etc/flagd/game.json /etc/flagd/user.json && chmod g+w /etc/flagd/game.json /etc/flagd/user.json"
    volumes:
      - ./services/flagd:/etc/flagd
    restart: "no"
  # flagd for feature flag evaluation
  flagd:
    image: ghcr.io/open-feature/flagd:v0.16.0
    container_name: joustmania-flagd
    command:
      - "start"
      - "--uri"
      - "file:/etc/flagd/system.json"
      - "--uri"
      - "file:/etc/flagd/controller.json"
      - "--uri"
      - "file:/etc/flagd/observability.json"
      - "--uri"
      - "file:/etc/flagd/game.json"
      - "--uri"
      - "file:/etc/flagd/user.json"
      - "--uri"
      - "file:/etc/flagd/agent.json"
      - "--uri"
      - "file:/etc/flagd/interventions.json"
      - "--uri"
      - "file:/etc/flagd/rollout.json"
    volumes:
      - ./services/flagd/system.json:/etc/flagd/system.json
      - ./services/flagd/controller.json:/etc/flagd/controller.json
      - ./services/flagd/observability.json:/etc/flagd/observability.json
      - ./services/flagd/game.json:/etc/flagd/game.json
      - ./services/flagd/user.json:/etc/flagd/user.json
      - ./services/flagd/agent.json:/etc/flagd/agent.json
      - ./services/flagd/interventions.json:/etc/flagd/interventions.json
      - ./services/flagd/rollout.json:/etc/flagd/rollout.json
    expose:
      - "8013"
      - "8015"
    networks:
      - joustmania
    restart: unless-stopped
  # Controller Manager Service
  controller-manager:
    image: ghcr.io/watchmejoustmyflags/joustmania/controller-manager-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/controller_manager/Dockerfile
    container_name: joustmania-controller-manager
    privileged: true
    # Required for controller hot-plug
    pid: "host"
    networks:
      - joustmania
    expose:
      - "50052"
    environment:
      - CONTROLLER_NAMES_FILE=/app/data/controller_names.txt
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/var/run/dbus/system_bus_socket
      - OTEL_SDK_DISABLED=true
    volumes:
      - /var/run/dbus:/var/run/dbus:ro
      - /var/lib/bluetooth:/var/lib/bluetooth:ro
      - /dev:/dev:rslave
      - controller-names:/app/data
    depends_on:
      flagd:
        condition: service_started
    restart: unless-stopped
    # Healthcheck defined in Dockerfile

  # Pairing Daemon - USB controller pairing and Bluetooth monitoring
  pairing-daemon:
    image: ghcr.io/watchmejoustmyflags/joustmania/pairing-daemon-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/pairing_daemon/Dockerfile
    container_name: joustmania-pairing-daemon
    privileged: true
    pid: "host"
    volumes:
      - /var/run/dbus:/var/run/dbus
      - /var/lib/bluetooth:/var/lib/bluetooth
      - /dev:/dev:rslave
    networks:
      - joustmania
    expose:
      - "8002"
    environment:
      - POLL_INTERVAL=10
      - BT_MONITOR_INTERVAL=5
      - METRICS_PORT=8002
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/var/run/dbus/system_bus_socket
      - OTEL_SDK_DISABLED=true
    restart: unless-stopped
    # Healthcheck defined in Dockerfile

  # Game Coordinator Service
  game-coordinator:
    image: ghcr.io/watchmejoustmyflags/joustmania/game-coordinator-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/game_coordinator/Dockerfile
    container_name: joustmania-game-coordinator
    expose:
      - "50053"
    environment:
      - OTEL_SDK_DISABLED=true
    depends_on:
      flagd:
        condition: service_started
    networks:
      - joustmania
    restart: unless-stopped
    # Healthcheck defined in Dockerfile

  # Menu Service
  menu:
    image: ghcr.io/watchmejoustmyflags/joustmania/menu-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/menu/Dockerfile
    container_name: joustmania-menu
    expose:
      - "50054"
    environment:
      - OTEL_SDK_DISABLED=true
      - AUDIO_HOST=audio
      - AUDIO_PORT=50056
      - FLAGD_HOST=flagd
      - FLAGD_PORT=8015
      # Single source of truth for the active flag directory (#959/#966):
      # the menu writes $FLAGD_FLAG_DIR/<domain>.json via lib/flagd_paths.py.
      - FLAGD_FLAG_DIR=/etc/flagd
    volumes:
      - ./services/flagd/game.json:/etc/flagd/game.json
      - ./services/flagd/user.json:/etc/flagd/user.json
    depends_on:
      flagd:
        condition: service_started
      # Wait for the flag files to be made group-writable so the nonroot menu
      # can persist admin settings on first start (#1031). flagd intentionally
      # does NOT depend on flag-dir-init — it only reads the files.
      flag-dir-init:
        condition: service_completed_successfully
    networks:
      - joustmania
    restart: unless-stopped
    # Healthcheck defined in Dockerfile

  # Audio Service
  audio:
    image: ghcr.io/watchmejoustmyflags/joustmania/audio-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/audio/Dockerfile
    container_name: joustmania-audio
    privileged: true
    volumes:
      - ./services/audio/assets:/app/services/audio/assets:ro
      - /usr/share/alsa:/usr/share/alsa:ro
    devices:
      - /dev/snd:/dev/snd
    expose:
      - "50056"
    environment:
      - OTEL_SDK_DISABLED=true
      - AUDIODEV=default
      - FLAGD_HOST=flagd
      - FLAGD_PORT=8015
      - ALSA_CARD=auto  # Auto-detect sound card; set to card number (e.g. "1") to override
    depends_on:
      flagd:
        condition: service_started
    networks:
      - joustmania
    restart: unless-stopped
    group_add:
      - audio
    # Healthcheck defined in Dockerfile

  # Connect-Web Proxy
  connect-proxy:
    image: ghcr.io/watchmejoustmyflags/joustmania/connect-proxy:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/connect-proxy/Dockerfile
    container_name: joustmania-connect-proxy
    expose:
      - "8080"
    environment:
      - CONTROLLER_MANAGER_SERVICE=controller-manager:50052
      - GAME_COORDINATOR_SERVICE=game-coordinator:50053
      - MENU_SERVICE=menu:50054
      - FLAGD_CONFIG_PATH=/etc/flagd/flags/controller.json
    volumes:
      - ./services/flagd:/etc/flagd/flags
    networks:
      - joustmania
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 1s

  # Dashboard (SPA)
  dashboard:
    image: ghcr.io/watchmejoustmyflags/joustmania/dashboard:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    container_name: joustmania-dashboard
    expose:
      - "8080"
    networks:
      - joustmania
    restart: unless-stopped
    # Healthcheck defined in Dockerfile

  # Envoy (Gateway)
  envoy:
    image: envoyproxy/envoy:v1.38-latest
    container_name: joustmania-envoy
    ports:
      - "80:80"
    volumes:
      - ./services/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      - joustmania
    restart: unless-stopped

networks:
  joustmania:
    driver: bridge
    name: joustmania-network

volumes:
  controller-names: