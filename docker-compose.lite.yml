# JoustMania Lite Configuration - Raspberry Pi Optimized
#
# Excludes observability stack (Jaeger, VictoriaMetrics, Loki, Grafana, OTEL Collector)
# for minimal resource usage on constrained devices.
#
# Usage: docker compose -f docker-compose.lite.yml up -d
#
# Memory savings: ~768MB compared to full stack
# Recommended for: Raspberry Pi 5, production deployments without monitoring
#
# Controllers: real PS Move controllers are read through rust-hid, the default
# Bluetooth backend (backend=rust in services/flagd/controller.json, #1371/#1318).
# The controller manager reaches it as rust-hid:50058 on the joustmania network;
# the pairing daemon runs on the host network (raw HCI, as in docker-compose.yml)
# and reaches rust-hid and flagd through their loopback-published ports
# (#1402). python-hid is not part of the lite stack (opt-in on the full stack
# only, `docker compose --profile python-hid up -d`), and neither is the
# operator pad (`operator-pad` profile, full stack only, #2050).
#
# All images use canonical GHCR names for consistency.
# Use IMAGE_TAG environment variable to specify version (default: latest)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: "com.docker.compose.service,com.docker.compose.image"

services:
  # Flag service (epic #1407): runtime flags in memory, served to flagd as ONE
  # gRPC sync source for every flag set (flagd reads no flag file). Same
  # contract as docker-compose.yml; no OTel
  # export here (no collector in lite). Memory limit 64 MiB (NFR-051).
  flag-service:
    image: ghcr.io/watchmejoustmyflags/joustmania/flag-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/flag-service/Dockerfile
    container_name: joustmania-flag-service
    expose:
      - "50064"
      - "8070"
    environment:
      - FLAG_SERVICE_SETS=system,observability,interventions,rollout,agent,game,user,controller,operator
      - FLAG_SERVICE_BASELINE_DIR=/etc/flagd
      # The registry comes from the same checkout as the baseline (mounted below):
      # the image copy would reject a renamed flag (#1838).
      - FLAG_SERVICE_REGISTRY=/etc/flag-service/registry.yaml
      - FLAG_SERVICE_STATE_FILE=/var/lib/flag-service/admin.json
      # Go runtime soft limit under the 64 MiB container limit (NFR-051).
      - GOMEMLIMIT=48MiB
    volumes:
      - ./services/flagd:/etc/flagd:ro
      - ./services/flag-service/registry.yaml:/etc/flag-service/registry.yaml:ro
      - flag-service-state:/var/lib/flag-service
    healthcheck:
      test: ["CMD", "/flag-service", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
    networks:
      - joustmania
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.25'

  # flagd for feature flag evaluation. Served sets come over the flag service's
  # gRPC sync source; flagd starts after it is healthy and restarts with it.
  flagd:
    image: ghcr.io/open-feature/flagd:v0.18.1
    container_name: joustmania-flagd
    command:
      - "start"
      - "--uri"
      - "grpc://flag-service:50064"
    depends_on:
      flag-service:
        condition: service_healthy
        restart: true
    ports:
      # Sync port for the host-networked pairing-daemon (127.0.0.1:8015).
      # Loopback only: the flag config must not be readable from the venue
      # network (#1319).
      - "127.0.0.1:8015:8015"
    expose:
      - "8013"
      - "8015"
    networks:
      - joustmania
    restart: unless-stopped
    logging: *default-logging
  # Controller Manager Service
  controller-manager:
    image: ghcr.io/watchmejoustmyflags/joustmania/controller-manager-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/controller_manager/Dockerfile
    container_name: joustmania-controller-manager
    privileged: true
    # Required for controller hot-plug
    pid: "host"
    networks:
      - joustmania
    expose:
      - "50052"
    environment:
      - CONTROLLER_NAMES_FILE=/app/data/controller_names.txt
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/var/run/dbus/system_bus_socket
      - OTEL_SDK_DISABLED=true
      # rust-hid: the default controller I/O backend (#1318, #1371)
      - RUST_HID_HOST=rust-hid
      - RUST_HID_PORT=50058
    volumes:
      - /var/run/dbus:/var/run/dbus:ro
      - /var/lib/bluetooth:/var/lib/bluetooth:ro
      - /dev:/dev:rslave
      - controller-names:/app/data
    depends_on:
      flagd:
        condition: service_started
      rust-hid:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    # Healthcheck defined in Dockerfile

  # Pairing Daemon - USB controller pairing and Bluetooth monitoring
  pairing-daemon:
    image: ghcr.io/watchmejoustmyflags/joustmania/pairing-daemon-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/pairing_daemon/Dockerfile
    container_name: joustmania-pairing-daemon
    privileged: true
    pid: "host"
    # Host network required for AF_BLUETOOTH HCI sockets (hciconfig/hcitool,
    # Bluetooth monitor RSSI), as in docker-compose.yml (#1402).
    network_mode: host
    volumes:
      - /var/run/dbus:/var/run/dbus
      - /var/lib/bluetooth:/var/lib/bluetooth
      - /dev:/dev:rslave
    environment:
      - METRICS_PORT=8002
      # Port 8002 (health + UC-005 unpair) binds on the host via network_mode:
      # host, only on loopback and the docker0 gateway (what host.docker.internal
      # resolves to), so the connect-proxy reaches it but the LAN does not
      # (UC-005 BR-003).
      - CONTROL_BIND=${PAIRING_CONTROL_BIND:-127.0.0.1,172.17.0.1}
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/var/run/dbus/system_bus_socket
      - OTEL_SDK_DISABLED=true
      # bluetooth_backend (default rust) pairs through rust-hid's PairingService
      # (UC-001 BR-003). Loopback because network_mode: host can't use Docker
      # DNS; 127.0.0.1, not localhost: 8015 and 50058 are published on
      # 127.0.0.1 only (#1319), and localhost may resolve to ::1 first.
      - FLAGD_HOST=127.0.0.1
      - FLAGD_PORT=8015
      - RUST_HID_HOST=127.0.0.1
      - RUST_HID_PORT=50058
      # Primary game state for pairing.bluez_restart_mode=when_idle (UC-001 BR-005),
      # through envoy's published port 80 (the coordinator has no host port)
      - GAME_STATE_URL=http://localhost/joustmania.game_coordinator.GameCoordinatorService/GetGameState
    depends_on:
      flagd:
        condition: service_started
      rust-hid:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    # Healthcheck defined in Dockerfile

  # Rust HID Service - PS Move HID access (ControllerIOService + PairingService)
  # via gRPC. The default Bluetooth backend (#1318, #1371). Same device access as
  # the full stack: privileged, host PID namespace and /dev with rslave
  # propagation, so hot-plugged hidraw nodes appear. No OTLP endpoint is set, so
  # it exports no telemetry (the lite stack has no collector).
  rust-hid:
    image: ghcr.io/watchmejoustmyflags/joustmania/rust-hid:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/rust-hid/Dockerfile
    container_name: joustmania-rust-hid
    privileged: true
    pid: "host"
    volumes:
      - /dev:/dev:rslave
    networks:
      - joustmania
    expose:
      - "50058"
    ports:
      # For the host-networked pairing-daemon (127.0.0.1:50058). Loopback only:
      # the HID gRPC API must not be reachable from the venue network (#1319).
      - "127.0.0.1:50058:50058"
    environment:
      - OTEL_SERVICE_NAME=rust-hid
      - OTEL_SERVICE_NAMESPACE=infrastructure
      - FLAGD_HOST=flagd
      - RUST_LOG=info
    depends_on:
      flagd:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging
    # Healthcheck defined in Dockerfile (uses grpc_health_probe)
    deploy:
      resources:
        limits:
          memory: 64m
          # 1.0, not 0.25 (#2125): with 3 controllers on the stage Pi rust-hid used
          # 14.7 % of a core (mostly syscalls of the 1 kHz poll) and was CFS-throttled
          # in 117 periods; about 9 controllers exceed 0.25, and every throttled 100 ms
          # period stalls input, output and gRPC for up to 75 ms.
          cpus: '1.0'

  # Game Coordinator Service
  game-coordinator:
    image: ghcr.io/watchmejoustmyflags/joustmania/game-coordinator-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/game_coordinator/Dockerfile
    container_name: joustmania-game-coordinator
    expose:
      - "50053"
    environment:
      - OTEL_SDK_DISABLED=true
      - FLAG_SERVICE_URL=http://flag-service:8070
      - FLAG_SERVICE_INSTANCE=game-coordinator  # stable across recreate (the hostname is the container id), UC-053 A10
    depends_on:
      flagd:
        condition: service_started
    networks:
      - joustmania
    restart: unless-stopped
    logging: *default-logging
    # Healthcheck defined in Dockerfile

  # Menu Service
  menu:
    image: ghcr.io/watchmejoustmyflags/joustmania/menu-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/menu/Dockerfile
    container_name: joustmania-menu
    expose:
      - "50054"
    environment:
      - OTEL_SDK_DISABLED=true
      - AUDIO_HOST=audio
      - AUDIO_PORT=50056
      - FLAGD_HOST=flagd
      - FLAGD_PORT=8015
      # Admin settings are persisted admin values on the flag service (UC-053 A2).
      - FLAG_SERVICE_URL=http://flag-service:8070
    depends_on:
      flagd:
        condition: service_started
    networks:
      - joustmania
    restart: unless-stopped
    logging: *default-logging
    # Healthcheck defined in Dockerfile

  # Audio Service
  audio:
    image: ghcr.io/watchmejoustmyflags/joustmania/audio-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/audio/Dockerfile
    container_name: joustmania-audio
    privileged: true
    volumes:
      - ./services/audio/assets:/app/services/audio/assets:ro
      - /usr/share/alsa:/usr/share/alsa:ro
    devices:
      - /dev/snd:/dev/snd
    expose:
      - "50056"
    environment:
      - OTEL_SDK_DISABLED=true
      - AUDIODEV=default
      - FLAGD_HOST=flagd
      - FLAGD_PORT=8015
      - ALSA_CARD=auto  # Auto-detect sound card; set to card number (e.g. "1") to override
    depends_on:
      flagd:
        condition: service_started
    networks:
      - joustmania
    restart: unless-stopped
    logging: *default-logging
    group_add:
      - audio
    # Healthcheck defined in Dockerfile

  # Connect-Web Proxy
  connect-proxy:
    image: ghcr.io/watchmejoustmyflags/joustmania/connect-proxy:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/connect-proxy/Dockerfile
    container_name: joustmania-connect-proxy
    expose:
      - "8080"
    environment:
      - CONTROLLER_MANAGER_SERVICE=controller-manager:50052
      - GAME_COORDINATOR_SERVICE=game-coordinator:50053
      - MENU_SERVICE=menu:50054
      - FLAG_SERVICE_URL=http://flag-service:8070
      # Pairing daemon control API (UC-005 unpair); the daemon runs on the host network
      - PAIRING_DAEMON_URL=http://host.docker.internal:8002
      # Extra host names the dashboard is reached by (comma-separated), besides IP
      # literals, localhost and the host's own <hostname> / <hostname>.local (read
      # from the mount below); /pairing/unpair answers 403 for any other Host
      # (UC-005 BR-003, DNS rebinding)
      - JOUSTMANIA_HOSTNAMES=${JOUSTMANIA_HOSTNAMES:-}
    volumes:
      # The Pi's host name for the unpair Host allow-list (UC-005 BR-003)
      - /etc/hostname:/etc/joustmania/host-hostname:ro
    extra_hosts:
      # Reach the host-networked pairing daemon (:8002) for UC-005 unpair
      - "host.docker.internal:host-gateway"
    networks:
      - joustmania
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 1s

  # Dashboard (SPA)
  dashboard:
    image: ghcr.io/watchmejoustmyflags/joustmania/dashboard:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    container_name: joustmania-dashboard
    expose:
      - "8080"
    networks:
      - joustmania
    restart: unless-stopped
    logging: *default-logging
    # Healthcheck defined in Dockerfile

  # Envoy (Gateway)
  envoy:
    image: envoyproxy/envoy:v1.38-latest
    container_name: joustmania-envoy
    ports:
      - "80:80"
    volumes:
      - ./services/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      - joustmania
    restart: unless-stopped
    logging: *default-logging

networks:
  joustmania:
    driver: bridge
    name: joustmania-network

volumes:
  flag-service-state:
  controller-names: